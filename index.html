<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Statistics Dashboard</title>
    <style>
        :root {
            --bg: #070b14;
            --panel: #111b2e;
            --border: #1e2a40;
            --text: #e5ecf5;
            --muted: #7386a2;
            --gold: #fbbf24;
            --emerald: #10b981;
            --red: #f87171;
            --green: #34d399;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(1200px 600px at 70% -10%, #13203a 0%, transparent 60%), radial-gradient(800px 400px at 10% 0%, rgba(16, 185, 129, 0.06) 0%, transparent 50%), var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 28px 24px 40px;
        }
        header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 28px;
        }
        h1 {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .updated-pill {
            font-size: 0.72rem;
            color: var(--emerald);
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 7px 14px;
            border-radius: 999px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        .section-title {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 14px;
        }
        .section-title h2 {
            font-size: 1.05rem;
            font-weight: 700;
        }
        .section-title .sub {
            font-size: 0.72rem;
            color: var(--muted);
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0) 60%), var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            inset: 0 0 auto 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(251, 191, 36, 0.5), transparent);
            opacity: 0.4;
        }
        .stat-card .icon {
            font-size: 1.4rem;
        }
        .stat-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-top: 8px;
        }
        .stat-value {
            font-size: 1.55rem;
            font-weight: 750;
            margin-top: 4px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            letter-spacing: -0.02em;
        }
        .stat-caption {
            font-size: 0.7rem;
            color: var(--muted);
            margin-top: 4px;
        }
        .stat-card.top-service {
            border-color: rgba(251, 191, 36, 0.35);
            box-shadow: 0 0 40px rgba(251, 191, 36, 0.08), inset 0 0 30px rgba(251, 191, 36, 0.03);
        }
        .stat-card.top-service .stat-value {
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            color: var(--gold);
        }

        /* Trending */
        .trending-section {
            margin-bottom: 28px;
        }
        .trending-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        .trend-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .trend-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .service-name {
            font-size: 0.85rem;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .request-count {
            font-size: 1.5rem;
            font-weight: 750;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        .request-count .unit {
            font-size: 0.72rem;
            color: var(--muted);
            font-weight: 500;
            margin-left: 2px;
        }
        .delta-badge {
            align-self: flex-start;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 999px;
        }
        .delta-up {
            background: rgba(52, 211, 153, 0.12);
            color: var(--green);
        }
        .delta-down {
            background: rgba(248, 113, 113, 0.12);
            color: var(--red);
        }
        .delta-flat {
            background: rgba(115, 134, 162, 0.12);
            color: var(--muted);
        }
        .trend-meta {
            font-size: 0.68rem;
            color: var(--muted);
        }

        /* Dashboard grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: minmax(0, 2.3fr) minmax(300px, 1fr);
            gap: 24px;
            align-items: start;
        }
        .table-section,
        .ranking-section {
            min-width: 0;
        }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(14, 22, 38, 0.7);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.84rem;
            min-width: 880px;
        }
        thead th {
            background: #0b1322;
            text-align: right;
            padding: 10px 12px;
            font-size: 0.64rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            position: sticky;
            top: 0;
        }
        thead th.left {
            text-align: left;
        }
        tbody td {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(30, 42, 64, 0.5);
            vertical-align: middle;
        }
        td.num {
            text-align: right;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.78rem;
            white-space: nowrap;
        }
        td.service-cell {
            white-space: nowrap;
        }
        tbody tr.game-row {
            background: rgba(251, 191, 36, 0.05);
        }
        tbody tr.game-row:hover {
            background: rgba(251, 191, 36, 0.1);
        }
        tbody tr.game-row td:first-child {
            border-left: 2px solid rgba(251, 191, 36, 0.35);
        }
        tbody tr.infra-row {
            color: var(--muted);
        }
        tbody tr.infra-row:hover {
            background: rgba(255, 255, 255, 0.02);
        }
        tbody tr.infra-row td:first-child {
            border-left: 2px solid transparent;
        }
        tbody tr.zero-row {
            opacity: 0.45;
        }
        tfoot td {
            font-weight: 700;
            padding: 10px 12px;
            border-top: 1px solid var(--border);
            background: rgba(16, 185, 129, 0.04);
        }
        tfoot td.num {
            font-size: 0.82rem;
        }
        .total-cell {
            color: var(--gold);
            font-weight: 700;
        }
        .top-total {
            text-shadow: 0 0 12px rgba(251, 191, 36, 0.4);
        }
        .account {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.68rem;
            color: var(--muted);
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.62rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }
        .badge.worker {
            background: rgba(96, 165, 250, 0.15);
            color: #93c5fd;
        }
        .badge.pages {
            background: rgba(167, 139, 250, 0.15);
            color: #c4b5fd;
        }
        .game-icon {
            font-size: 0.9rem;
            margin-right: 4px;
        }
        .infra-tag {
            font-size: 0.58rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            border: 1px solid #334155;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
        }
        .trend-up {
            color: var(--green);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.74rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .trend-down {
            color: var(--red);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.74rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .trend-flat {
            color: var(--muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.74rem;
        }

        /* Bar chart */
        .ranking-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
        }
        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .bar-label {
            width: 170px;
            flex-shrink: 0;
            font-size: 0.7rem;
            text-align: right;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
        }
        .bar-track {
            flex: 1;
            height: 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 999px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #b45309, #fbbf24 80%);
            border-radius: 999px;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.35);
        }
        .bar-value {
            flex-shrink: 0;
            width: 70px;
            text-align: right;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.72rem;
            color: var(--muted);
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            font-size: 1.1rem;
            color: var(--muted);
            border: 1px dashed var(--border);
            border-radius: 16px;
        }
        footer {
            margin-top: 36px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 0.73rem;
            color: var(--muted);
        }

        @media (max-width: 1050px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 1000px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 800px) {
            .trending-grid {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 520px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

        const sorted = [...services].sort((a, b) => b.total - a.total);
        const topService = sorted[0];

        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        function shortDate(d) {
            const parts = d.split('-');
            return months[parseInt(parts[1], 10) - 1] + ' ' + parseInt(parts[2], 10);
        }

        document.getElementById('updated-at').textContent = '🕒 ' + DATA.updatedAt;
        document.getElementById('footer-updated').textContent = DATA.updatedAt;
        document.getElementById('trending-sub').textContent = 'Day-over-day change · ' + shortDate(prevDate) + ' → ' + shortDate(lastDate);

        if (allTimeTotal === 0) {
            document.getElementById('app').innerHTML = '<div class="empty">💤 No data collected yet</div>';
        } else {
            renderStats();
            renderTrending();
            renderTable();
            renderBars();
        }

        function renderStats() {
            const statsGrid = document.getElementById('stats-grid');
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="icon">📈</div>
                    <div class="stat-label">Requests · ${shortDate(lastDate)}</div>
                    <div class="stat-value">${fmt(lastDayTotal)}</div>
                    <div class="stat-caption">Across all services</div>
                </div>
                <div class="stat-card">
                    <div class="icon">🗓️</div>
                    <div class="stat-label">All-Time Requests</div>
                    <div class="stat-value">${fmt(allTimeTotal)}</div>
                    <div class="stat-caption">${shortDate(dates[0])} – ${shortDate(dates[dates.length - 1])}</div>
                </div>
                <div class="stat-card">
                    <div class="icon">🛠️</div>
                    <div class="stat-label">Services Tracked</div>
                    <div class="stat-value">${services.length}</div>
                    <div class="stat-caption">Workers + Pages</div>
                </div>
                <div class="stat-card top-service">
                    <div class="icon">🏆</div>
                    <div class="stat-label">Top Service</div>
                    <div class="stat-value">${topService.isGame ? '🎮 ' : ''}${topService.service}</div>
                    <div class="stat-caption">${fmt(topService.total)} requests all time</div>
                </div>
            `;
        }

        function renderTrending() {
            const trending = services
                .filter(s => (s.daily[lastDate] || 0) > 0)
                .map(s => {
                    const prev = s.daily[prevDate] || 0;
                    const last = s.daily[lastDate] || 0;
                    const delta = last - prev;
                    const pct = prev > 0 ? (delta / prev) * 100 : (last > 0 ? 100 : 0);
                    return { ...s, delta, pct, last };
                })
                .sort((a, b) => b.delta - a.delta)
                .slice(0, 3);

            const grid = document.getElementById('trending-grid');
            if (trending.length === 0) {
                grid.innerHTML = '<div class="empty">No active services on the latest day.</div>';
                return;
            }

            grid.innerHTML = trending.map(s => {
                const cls = s.delta > 0 ? 'delta-up' : s.delta < 0 ? 'delta-down' : 'delta-flat';
                const arrow = s.delta > 0 ? '▲' : s.delta < 0 ? '▼' : '—';
                const label = s.delta === 0 ? '0' : fmt(Math.abs(s.delta)) + (s.pct !== null ? ' (' + Math.abs(s.pct).toFixed(1) + '%)' : '');
                return `
                    <div class="trend-card">
                        <div class="trend-top">
                            <span class="service-name">${s.isGame ? '🎮 ' : ''}${s.service}</span>
                            <span class="badge ${s.platform}">${s.platform}</span>
                        </div>
                        <div class="request-count">${fmt(s.last)}<span class="unit">requests</span></div>
                        <div class="delta-badge ${cls}">${arrow} ${label}</div>
                        <div class="trend-meta">${shortDate(prevDate)} → ${shortDate(lastDate)}</div>
                    </div>
                `;
            }).join('');
        }

        function renderTable() {
            const dailyTotals = {};
            dates.forEach(d => {
                dailyTotals[d] = services.reduce((sum, s) => sum + (s.daily[d] || 0), 0);
            });

            const rows = sorted.map(s => {
                const prev = s.daily[prevDate] || 0;
                const last = s.daily[lastDate] || 0;
                const delta = last - prev;
                let trendHtml;
                if (delta > 0) trendHtml = `<span class="trend-up">▲ ${fmt(delta)}</span>`;
                else if (delta < 0) trendHtml = `<span class="trend-down">▼ ${fmt(Math.abs(delta))}</span>`;
                else trendHtml = `<span class="trend-flat">—</span>`;

                const rowClass = (s.isGame ? 'game-row' : 'infra-row') + (s.total === 0 ? ' zero-row' : '');

                return `
                    <tr class="${rowClass}">
                        <td class="service-cell">
                            ${s.isGame ? '<span class="game-icon">🎮</span>' : ''}${s.service}
                            ${s.isGame ? '' : '<span class="infra-tag">infra</span>'}
                        </td>
                        <td><span class="account" title="${s.account}">${s.account.slice(0, 8)}…${s.account.slice(-6)}</span></td>
                        <td><span class="badge ${s.platform}">${s.platform}</span></td>
                        ${dates.map(d => `<td class="num">${fmt(s.daily[d] || 0)}</td>`).join('')}
                        <td class="num total-cell${s.total === topService.total ? ' top-total' : ''}">${fmt(s.total)}</td>
                        <td class="num">${trendHtml}</td>
                    </tr>
                `;
            }).join('');

            const foot = `
                <tr>
                    <td colspan="3">All services</td>
                    ${dates.map(d => `<td class="num">${fmt(dailyTotals[d])}</td>`).join('')}
                    <td class="num">${fmt(allTimeTotal)}</td>
                    <td></td>
                </tr>
            `;

            document.getElementById('main-table').innerHTML = `
                <thead>
                    <tr>
                        <th class="left">Service</th>
                        <th class="left">Account</th>
                        <th class="left">Platform</th>
                        ${dates.map(d => `<th title="${d}">${shortDate(d)}</th>`).join('')}
                        <th>Total</th>
                        <th>Trend</th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
                <tfoot>${foot}</tfoot>
            `;
        }

        function renderBars() {
            const topBars = sorted.filter(s => s.total > 0).slice(0, 10);
            const maxBar = topBars.length > 0 ? topBars[0].total : 0;

            document.getElementById('bar-chart').innerHTML = topBars.map(s => {
                const width = maxBar > 0 ? ((s.total / maxBar) * 100).toFixed(1) : 0;
                return `
                    <div class="bar-row">
                        <div class="bar-label" title="${s.service}">${s.isGame ? '🎮 ' : ''}${s.service}</div>
                        <div class="bar-track"><div class="bar-fill" style="width:${width}%"></div></div>
                        <div class="bar-value">${fmt(s.total)}</div>
                    </div>
                `;
            }).join('') || '<div class="empty">No data yet</div>';
        }
    </script>
</body>
</html>
