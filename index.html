<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Statistics Dashboard 🎮</title>
<style>
:root{--bg-deep:#070b18;--bg-primary:#0c1222;--bg-card:#131c31;--bg-card-alt:#162038;--bg-game:rgba(251,191,36,0.07);--bg-game-border:rgba(251,191,36,0.18);--gold:#fbbf24;--gold-soft:#d4a017;--emerald:#10b981;--red:#ef4444;--blue:#3b82f6;--purple:#8b5cf6;--text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-dim:#475569;--border:#1e293b;--shadow:0 4px 24px rgba(0,0,0,0.4);--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg-deep);color:var(--text-primary);line-height:1.6;min-height:100vh;background-image:radial-gradient(ellipse at 15% 50%,rgba(16,185,129,0.04) 0%,transparent 50%),radial-gradient(ellipse at 85% 15%,rgba(251,191,36,0.04) 0%,transparent 50%)}
.dashboard{max-width:1400px;margin:0 auto;padding:20px 24px 40px}
.header{text-align:center;padding:40px 20px 30px;position:relative}
.header h1{font-size:2.2rem;font-weight:800;background:linear-gradient(135deg,var(--gold),#f59e0b,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.5px}
.header .subtitle{color:var(--text-secondary);font-size:1rem;margin-top:6px;font-weight:400}
.header::after{content:'';display:block;width:80px;height:3px;background:linear-gradient(90deg,var(--gold),var(--emerald));border-radius:2px;margin:20px auto 0}
.summary-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:28px 0 36px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;transition:transform .2s,box-shadow .2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-card .card-icon{font-size:1.5rem;margin-bottom:8px}
.stat-card .card-label{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-secondary);font-weight:600}
.stat-card .card-value{font-size:1.65rem;font-weight:700;margin-top:4px;color:var(--text-primary);font-variant-numeric:tabular-nums}
.stat-card .card-sub{font-size:.8rem;color:var(--text-dim);margin-top:4px}
.stat-card.gold{border-color:var(--bg-game-border);background:var(--bg-game)}
.stat-card.gold .card-value{color:var(--gold)}
.section{margin:36px 0}
.section h2{font-size:1.2rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;color:var(--text-primary)}
.section h2 span{font-size:1.3rem}
.bar-chart{display:flex;flex-direction:column;gap:6px}
.bar-row{display:flex;align-items:center;gap:12px}
.bar-label{width:180px;min-width:180px;text-align:right;font-size:.82rem;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.bar-label.game{color:var(--gold)}
.bar-track{flex:1;height:26px;background:var(--bg-card);border-radius:6px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:6px;transition:width .6s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font-size:.72rem;font-weight:600;color:rgba(255,255,255,.9);min-width:fit-content}
.bar-fill.game{background:linear-gradient(90deg,rgba(251,191,36,.25),rgba(251,191,36,.55))}
.bar-fill.non-game{background:linear-gradient(90deg,rgba(59,130,246,.2),rgba(59,130,246,.45))}
.bar-value{width:90px;min-width:90px;font-size:.82rem;color:var(--text-secondary);font-variant-numeric:tabular-nums;font-weight:500}
.table-wrapper{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card);-webkit-overflow-scrolling:touch}
.table-wrapper::-webkit-scrollbar{height:8px}
.table-wrapper::-webkit-scrollbar-track{background:var(--bg-card)}
.table-wrapper::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:.82rem}
thead{position:sticky;top:0;z-index:2}
th{background:var(--bg-primary);padding:12px 10px;text-align:center;font-weight:600;color:var(--text-secondary);font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border);cursor:pointer;user-select:none;transition:color .15s}
th:hover{color:var(--gold)}
th.sorted-asc::after{content:' ▲';color:var(--gold);font-size:.65rem}
th.sorted-desc::after{content:' ▼';color:var(--gold);font-size:.65rem}
th.col-service,th.col-account,th.col-platform,th.col-total,th.col-trend{text-align:left;padding-left:14px}
td{padding:10px 10px;border-bottom:1px solid rgba(30,41,59,.6);text-align:center;font-variant-numeric:tabular-nums}
td.col-service{text-align:left;padding-left:14px;font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis}
td.col-account{text-align:left;padding-left:14px;color:var(--text-dim);font-family:'SF Mono',Consolas,Monaco,monospace;font-size:.75rem}
td.col-platform{text-align:left;padding-left:14px}
td.col-total{text-align:left;padding-left:14px;font-weight:700;color:var(--emerald)}
td.col-trend{text-align:left;padding-left:14px;font-weight:600}
tr.game-row{background:var(--bg-game)}
tr.game-row:hover{background:rgba(251,191,36,0.12)}
tr.infra-row{opacity:.5}
tr.infra-row:hover{opacity:.75}
tr:hover td{background:rgba(255,255,255,.02)}
.game-badge{color:var(--gold);margin-right:4px}
.trend-up{color:var(--emerald)}
.trend-down{color:var(--red)}
.trend-flat{color:var(--text-dim)}
.platform-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.platform-worker{background:rgba(139,92,246,.15);color:#a78bfa}
.platform-pages{background:rgba(16,185,129,.15);color:#6ee7b7}
.no-data-cell{color:var(--text-dim);font-style:italic}
.trending-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.trend-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.trend-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.trend-card .trend-emoji{font-size:2rem;margin-bottom:10px}
.trend-card .trend-name{font-size:1rem;font-weight:700;margin-bottom:4px}
.trend-card .trend-amount{font-size:1.5rem;font-weight:800;margin-bottom:4px}
.trend-card .trend-desc{font-size:.78rem;color:var(--text-secondary)}
.trend-card.top-gain{border-color:rgba(16,185,129,.3)}
.trend-card.top-gain .trend-amount{color:var(--emerald)}
.trend-card.mid-gain{border-color:rgba(59,130,246,.3)}
.trend-card.mid-gain .trend-amount{color:var(--blue)}
.trend-card.flat{border-color:rgba(148,163,184,.2)}
.trend-card.flat .trend-amount{color:var(--text-secondary)}
.footer{text-align:center;padding:32px 20px;margin-top:40px;border-top:1px solid var(--border);color:var(--text-dim);font-size:.82rem}
.footer a{color:var(--text-secondary);text-decoration:none}
.sort-hint{text-align:right;font-size:.72rem;color:var(--text-dim);margin-bottom:8px}
@media(max-width:1024px){.summary-cards{grid-template-columns:repeat(2,1fr)}.trending-cards{grid-template-columns:1fr}}
@media(max-width:600px){.summary-cards{grid-template-columns:1fr}.bar-label{width:120px;min-width:120px;font-size:.75rem}.dashboard{padding:12px 14px 30px}.header h1{font-size:1.5rem}.header{padding:24px 12px 20px}}
</style>
</head>

const GAME_PATTERNS=['trivia','bible','quran','dice','bluff','snake','pop','casino','voice','rumble','blast','brick','songs','balloon','stickman','arena'];
const INFRA_NAMES=['opencode-proxy','audiobooks','youstream-proxy','egress-probe','wstest-probe2','hindsight'];

function fmt(n){return n.toLocaleString('en-US')}
function fmtDate(d){const p=d.split('-');return parseInt(p[1])+'/'+parseInt(p[2])}
function fmtDateLong(d){const p=d.split('-');const m=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return m[parseInt(p[1])]+' '+parseInt(p[2])+', '+p[0]}

function isGame(name,kind){
  if(kind&&kind.toLowerCase().includes('game'))return true;
  return GAME_PATTERNS.some(p=>name.toLowerCase().includes(p));
}
function isInfra(name){
  return INFRA_NAMES.some(n=>name.toLowerCase().includes(n));
}

const services=RAW_DATA.services.map(s=>{
  const dates=Object.keys(s.daily).sort();
  const total=Object.values(s.daily).reduce((a,b)=>a+b,0);
  const game=isGame(s.service,s.kind);
  const infra=isInfra(s.service);
  return{...s,dates,total,game,infra};
}).sort((a,b)=>b.total-a.total);

const allDates=[...new Set(RAW_DATA.services.flatMap(s=>Object.keys(s.daily)))].sort();
const lastDate=allDates[allDates.length-1];
const prevDate=allDates[allDates.length-2];
const totalLastDay=services.reduce((s,sv)=>s+(sv.daily[lastDate]||0),0);
const totalAllTime=services.reduce((s,sv)=>s+sv.total,0);
const topService=services[0];

// Render summary cards
const sc=document.getElementById('summary-cards');
sc.innerHTML=`
<div class="stat-card">
  <div class="card-icon">📊</div>
  <div class="card-label">Yesterday's Total</div>
  <div class="card-value">${fmt(totalLastDay)}</div>
  <div class="card-sub">${fmtDateLong(lastDate)}</div>
</div>
<div class="stat-card">
  <div class="card-icon">📈</div>
  <div class="card-label">All-Time Total</div>
  <div class="card-value">${fmt(totalAllTime)}</div>
  <div class="card-sub">${allDates.length} days tracked</div>
</div>
<div class="stat-card">
  <div class="card-icon">🔧</div>
  <div class="card-label">Services Tracked</div>
  <div class="card-value">${services.length}</div>
  <div class="card-sub">${services.filter(s=>s.game).length} games, ${services.filter(s=>!s.game).length} other</div>
</div>
<div class="stat-card gold">
  <div class="card-icon">🏆</div>
  <div class="card-label">Top Service</div>
  <div class="card-value">${topService.game?'🎮 ':''}${topService.service}</div>
  <div class="card-sub">${fmt(topService.total)} total requests</div>
</div>`;

// Render bar chart
const barChart=document.getElementById('bar-chart');
const barServices=services.filter(s=>s.total>0);
const maxTotal=barServices.length?barServices[0].total:1;
barChart.innerHTML=barServices.map(s=>{
  const pct=Math.max((s.total/maxTotal)*100,2);
  const cls=s.game?'game':'non-game';
  return`<div class="bar-row">
    <div class="bar-label ${s.game?'game':''}">${s.game?'🎮 ':''}${s.service}</div>
    <div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%">${s.total>=maxTotal*0.15?fmt(s.total):''}</div></div>
    <div class="bar-value">${fmt(s.total)}</div>
  </div>`}).join('');

// Render table
let sortCol='total';
let sortDir='desc';
function renderTable(){
  const sorted=[...services];
  sorted.sort((a,b)=>{
    let va,vb;
    if(sortCol==='service'){va=a.service.toLowerCase();vb=b.service.toLowerCase();sortDir==='asc'?0:0}
    else if(sortCol==='account'){va=a.account;vb=b.account}
    else if(sortCol==='platform'){va=a.platform;vb=b.platform}
    else if(sortCol==='total'){va=a.total;vb=b.total}
    else if(sortCol==='trend'){
      va=(a.daily[lastDate]||0)-(a.daily[prevDate]||0);
      vb=(b.daily[lastDate]||0)-(b.daily[prevDate]||0);
    }
    else{va=a.daily[sortCol]||0;vb=b.daily[sortCol]||0}
    if(typeof va==='string')return sortDir==='asc'?va.localeCompare(vb):vb.localeCompare(va);
    return sortDir==='asc'?va-vb:vb-va;
  });
  const ths=['service','account','platform',...allDates,'total','trend'];
  const labels=['Service','Account','Platform',...allDates.map(d=>fmtDate(d)),'Total','Trend'];
  let html='<thead><tr>';
  ths.forEach((k,i)=>{
    const isDateCol=allDates.includes(k);
    const cls=k==='service'?'col-service':k==='account'?'col-account':k==='platform'?'col-platform':k==='total'?'col-total':k==='trend'?'col-trend':'';
    const sortedCls=sortCol===k?(sortDir==='asc'?'sorted-asc':'sorted-desc'):'';
    html+=`<th class="${cls} ${sortedCls}" data-col="${k}" style="${isDateCol?'min-width:60px':''}">${labels[i]}</th>`;
  });
  html+='</tr></thead><tbody>';
  sorted.forEach(s=>{
    const rowCls=s.game?'game-row':s.infra?'infra-row':'';
    html+=`<tr class="${rowCls}">`;
    html+=`<td class="col-service">${s.game?'<span class="game-badge">🎮</span>':''}${s.service}</td>`;
    html+=`<td class="col-account">${s.account.substring(0,8)}…</td>`;
    html+=`<td class="col-platform"><span class="platform-badge platform-${s.platform}">${s.platform}</span></td>`;
    allDates.forEach(d=>{
      const v=s.daily[d];
      const hasData=v!==undefined;
      if(hasData&&v>0)html+=`<td>${fmt(v)}</td>`;
      else if(hasData)html+=`<td class="no-data-cell">0</td>`;
      else html+=`<td class="no-data-cell">—</td>`;
    });
    html+=`<td class="col-total">${fmt(s.total)}</td>`;
    const cur=s.daily[lastDate]||0;
    const prev=s.daily[prevDate]||0;
    const diff=cur-prev;
    let trendHtml='';
    if(cur===0&&prev===0)trendHtml='<span class="trend-flat">—</span>';
    else if(diff>0)trendHtml=`<span class="trend-up">▲ +${fmt(diff)}</span>`;
    else if(diff<0)trendHtml=`<span class="trend-down">▼ ${fmt(diff)}</span>`;
    else trendHtml=`<span class="trend-flat">— 0</span>`;
    html+=`<td class="col-trend">${trendHtml}</td>`;
    html+='</tr>';
  });
  html+='</tbody>';
  document.getElementById('data-table').innerHTML=html;
  document.querySelectorAll('#data-table th').forEach(th=>{
    th.addEventListener('click',()=>{
      const col=th.dataset.col;
      if(sortCol===col)sortDir=sortDir==='asc'?'desc':'asc';
      else{sortCol=col;sortDir=col==='service'||col==='account'||col==='platform'?'asc':'desc'}
      renderTable();
    });
  });
}
renderTable();

// Render trending
const growthData=services.filter(s=>{
  const c=s.daily[lastDate]||0;
  const p=s.daily[prevDate]||0;
  return c>0||p>0;
}).map(s=>{
  const c=s.daily[lastDate]||0;
  const p=s.daily[prevDate]||0;
  return{...s,change:c-p,cur:c,prev:p};
}).sort((a,b)=>b.change-a.change);

const trendEl=document.getElementById('trending');
const trending=growthData.slice(0,3);
const trendLabels=[
  {emoji:'🔥',cls:'top-gain',desc:'Biggest day-over-day growth'},
  {emoji:'📈',cls:'mid-gain',desc:'Strong upward momentum'},
  {emoji:'⚖️',cls:'flat',desc:'Holding steady — minimal change'}
];
trendEl.innerHTML=trending.map((s,i)=>{
  const t=trendLabels[i]||trendLabels[2];
  const sign=s.change>0?'+':'';
  const arrow=s.change>0?'▲':s.change<0?'▼':'—';
  return`<div class="trend-card ${t.cls}">
    <div class="trend-emoji">${t.emoji}</div>
    <div class="trend-name">${s.game?'🎮 ':''}${s.service}</div>
    <div class="trend-amount">${arrow} ${sign}${fmt(s.change)}</div>
    <div class="trend-desc">${t.desc}<br><span style="color:var(--text-dim)">${fmt(s.prev)} → ${fmt(s.cur)} requests</span></div>
  </div>`}).join('');

// Footer timestamp
const dt=new Date(RAW_DATA.updatedAt);
const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let hrs=dt.getUTCHours();
const ampm=hrs>=12?'PM':'AM';
hrs=hrs%12||12;
const mins=String(dt.getUTCMinutes()).padStart(2,'0');
document.getElementById('updated-at').textContent=months[dt.getUTCMonth()]+' '+dt.getUTCDate()+', '+dt.getUTCFullYear()+' at '+hrs+':'+mins+' '+ampm+' UTC';
</script>
</body>
