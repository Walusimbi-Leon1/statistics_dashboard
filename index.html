    <title>Game Statistics Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #0a0f1a 0%, #0d1b2a 50%, #0a1628 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #e0e6ed;
            min-height: 100vh;
            padding: 2rem 1.5rem;
        }
        .dashboard {
            max-width: 1440px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 2rem;
            color: #f5c542;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(245, 197, 66, 0.2);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        h1 span {
            font-size: 2.5rem;
        }
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2.5rem;
        }
        .stat-card {
            background: linear-gradient(135deg, #111c2e 0%, #0d1626 100%);
            border: 1px solid #1e2d45;
            border-radius: 16px;
            padding: 1.5rem 1.25rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            border-color: #f5c542;
        }
        .stat-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #8a9bb5;
            margin-bottom: 0.75rem;
            font-weight: 600;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.2;
        }
        .stat-value.gold {
            color: #f5c542;
        }
        .stat-value.small {
            font-size: 1.4rem;
        }
        .stat-sub {
            font-size: 0.85rem;
            color: #6c7a91;
            margin-top: 0.5rem;
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 2.5rem 0 1.25rem;
            color: #f5c542;
            border-bottom: 2px solid #1e2d45;
            padding-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #1e2d45;
            background: #0d1626;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            min-width: 900px;
        }
        thead {
            background: #111c2e;
            position: sticky;
            top: 0;
        }
        th {
            padding: 1rem 0.75rem;
            text-align: right;
            font-weight: 600;
            color: #8a9bb5;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #1e2d45;
            white-space: nowrap;
        }
        th:first-child, th:nth-child(2), th:nth-child(3) {
            text-align: left;
        }
        td {
            padding: 0.75rem;
            text-align: right;
            border-bottom: 1px solid #16233a;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        td:first-child, td:nth-child(2), td:nth-child(3) {
            text-align: left;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tbody tr {
            transition: background 0.15s;
        }
        tbody tr:hover {
            background: #111c2e;
        }
        .service-name {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .service-name .emoji {
            font-size: 1.1rem;
        }
        .game-row {
            background: rgba(245, 197, 66, 0.05);
        }
        .game-row:hover {
            background: rgba(245, 197, 66, 0.1);
        }
        .game-row .service-name {
            color: #f5c542;
        }
        .infra-row {
            opacity: 0.55;
        }
        .infra-row .service-name {
            color: #6c7a91;
        }
        .trend-up {
            color: #4ade80;
            font-weight: 600;
        }
        .trend-down {
            color: #f87171;
            font-weight: 600;
        }
        .trend-flat {
            color: #6c7a91;
        }
        .total-cell {
            font-weight: 700;
            color: #ffffff;
        }
        .account-cell {
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: #8a9bb5;
        }
        .platform-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .platform-worker {
            background: #1e3a5f;
            color: #93c5fd;
        }
        .platform-pages {
            background: #2d3748;
            color: #cbd5e1;
        }
        .chart-section {
            margin-top: 2.5rem;
        }
        .chart-container {
            background: #0d1626;
            border: 1px solid #1e2d45;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .chart-item {
            display: flex;
            align-items: center;
            margin-bottom: 0.75rem;
            gap: 1rem;
        }
        .chart-label {
            width: 180px;
            text-align: right;
            font-size: 0.85rem;
            color: #a0aec0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
        }
        .chart-bar-wrapper {
            flex: 1;
            background: #16233a;
            border-radius: 6px;
            height: 24px;
            overflow: hidden;
            position: relative;
        }
        .chart-bar {
            height: 100%;
            background: linear-gradient(90deg, #f5c542, #fbbf24);
            border-radius: 6px;
            min-width: 2px;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px rgba(245, 197, 66, 0.3);
        }
        .chart-value {
            width: 100px;
            font-size: 0.85rem;
            color: #ffffff;
            font-weight: 600;
            text-align: left;
            flex-shrink: 0;
        }
        .trending-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.25rem;
            margin-top: 1rem;
        }
        .trending-card {
            background: linear-gradient(135deg, #111c2e 0%, #0d1626 100%);
            border: 1px solid #1e2d45;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease;
        }
        .trending-card:hover {
            transform: translateY(-3px);
            border-color: #f5c542;
        }
        .trending-rank {
            font-size: 0.8rem;
            color: #f5c542;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }
        .trending-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .trending-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }
        .trending-change {
            font-weight: 700;
            font-size: 1.1rem;
        }
        .trending-change.positive {
            color: #4ade80;
        }
        .trending-change.negative {
            color: #f87171;
        }
        .trending-dates {
            color: #6c7a91;
            font-size: 0.8rem;
        }
        footer {
            margin-top: 3rem;
            text-align: center;
            color: #4a5568;
            font-size: 0.85rem;
            padding: 1.5rem 0;
            border-top: 1px solid #1e2d45;
        }
        .no-data {
            text-align: center;
            padding: 4rem 2rem;
            font-size: 1.2rem;
            color: #8a9bb5;
        }
        .no-data .emoji {
            font-size: 3rem;
            display: block;
            margin-bottom: 1rem;
        }
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            h1 {
                font-size: 1.6rem;
            }
            .stat-value {
                font-size: 1.5rem;
            }
            .chart-label {
                width: 120px;
            }
            .chart-value {
                width: 80px;
            }
        }
    </style>
</head>

                        "2026-08-12": 0, "2026-08-13": 0, "2026-08-14": 0, "2026-08-15": 0, "2026-08-16": 0,
                        "2026-08-17": 0, "2026-08-18": 0, "2026-08-19": 0, "2026-08-20": 0, "2026-08-21": 0,
                        "2026-08-22": 0, "2026-08-23": 0, "2026-08-24": 0, "2026-08-25": 0, "2026-08-26": 0,
                        "2026-08-27": 0, "2026-08-28": 0, "2026-08-29": 0, "2026-08-30": 0, "2026-08-31": 0,
                        "2026-09-01": 0
                    }
                }
            ]
        };

        // Helper functions
        function formatNumber(num) {
            return num.toLocaleString('en-US');
        }

        function getTotal(daily) {
            return Object.values(daily).reduce((sum, val) => sum + val, 0);
        }

        function getLastDay(daily) {
            const dates = Object.keys(daily).sort();
            if (dates.length === 0) return 0;
            return daily[dates[dates.length - 1]];
        }

        function getPreviousDay(daily) {
            const dates = Object.keys(daily).sort();
            if (dates.length < 2) return 0;
            return daily[dates[dates.length - 2]];
        }

        function getTrend(daily) {
            const last = getLastDay(daily);
            const prev = getPreviousDay(daily);
            if (last > prev) return 'up';
            if (last < prev) return 'down';
            return 'flat';
        }

        function isGame(service) {
            const name = service.service.toLowerCase();
            const gameKeywords = ['trivia', 'bible', 'quran', 'dice', 'bluff', 'snake', 'pop', 'casino', 'voice', 'youtrivia', 'rumble', 'stickman', 'arrow', 'brick', 'memory', 'balloon', 'game'];
            return gameKeywords.some(keyword => name.includes(keyword));
        }

        // Process data
        const services = data.services;
        const allDates = new Set();
        services.forEach(s => Object.keys(s.daily).forEach(d => allDates.add(d)));
        const sortedDates = Array.from(allDates).sort();

        // Calculate totals
        let totalAllTime = 0;
        let totalLastDay = 0;
        services.forEach(s => {
            totalAllTime += getTotal(s.daily);
            totalLastDay += getLastDay(s.daily);
        });

        // Find top service
        let topService = null;
        let topTotal = -1;
        services.forEach(s => {
            const total = getTotal(s.daily);
            if (total > topTotal) {
                topTotal = total;
                topService = s;
            }
        });

        // Build summary cards
        const summaryHtml = `
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-label">Requests (Last Day)</div>
                    <div class="stat-value gold">${formatNumber(totalLastDay)}</div>
                    <div class="stat-sub">${sortedDates.length > 0 ? sortedDates[sortedDates.length - 1] : 'N/A'}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Requests (All Time)</div>
                    <div class="stat-value">${formatNumber(totalAllTime)}</div>
                    <div class="stat-sub">${sortedDates.length} days tracked</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Services Tracked</div>
                    <div class="stat-value">${services.length}</div>
                    <div class="stat-sub">${services.filter(s => isGame(s)).length} games · ${services.filter(s => !isGame(s)).length} infra</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Top Service</div>
                    <div class="stat-value small">${topService ? topService.service : 'N/A'}</div>
                    <div class="stat-sub">${topService ? formatNumber(topTotal) + ' total requests' : ''}</div>
                </div>
            </div>
        `;

        // Build table
        let tableHtml = `
            <div class="section-title">📊 Service Breakdown</div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Service</th>
                            <th>Account</th>
                            <th>Platform</th>
                            ${sortedDates.map(d => `<th>${d.slice(5)}</th>`).join('')}
                            <th>Total</th>
                            <th>Trend</th>
                        </tr>
                    </thead>
                    <tbody>
        `;

        services.forEach(s => {
            const isGameService = isGame(s);
            const rowClass = isGameService ? 'game-row' : 'infra-row';
            const total = getTotal(s.daily);
            const trend = getTrend(s.daily);
            const trendIcon = trend === 'up' ? '▲' : trend === 'down' ? '▼' : '•';
            const trendClass = trend === 'up' ? 'trend-up' : trend === 'down' ? 'trend-down' : 'trend-flat';
            const platformClass = s.platform === 'worker' ? 'platform-worker' : 'platform-pages';
            
            tableHtml += `
                <tr class="${rowClass}">
                    <td>
                        <div class="service-name">
                            <span class="emoji">${isGameService ? '🎮' : '🔧'}</span>
                            <span>${s.service}</span>
                        </div>
                    </td>
                    <td class="account-cell">${s.account.slice(0, 8)}…</td>
                    <td><span class="platform-badge ${platformClass}">${s.platform}</span></td>
                    ${sortedDates.map(d => `<td>${s.daily[d] !== undefined ? formatNumber(s.daily[d]) : '—'}</td>`).join('')}
                    <td class="total-cell">${formatNumber(total)}</td>
                    <td class="${trendClass}">${trendIcon}</td>
                </tr>
            `;
        });

        tableHtml += `
                    </tbody>
                </table>
            </div>
        `;

        // Build chart
        const sortedByTotal = [...services].sort((a, b) => getTotal(b.daily) - getTotal(a.daily)).slice(0, 10);
        const maxTotal = sortedByTotal.length > 0 ? getTotal(sortedByTotal[0].daily) : 1;

        let chartHtml = `
            <div class="section-title">🏆 Top Services by Total Requests</div>
            <div class="chart-container">
        `;

        sortedByTotal.forEach(s => {
            const total = getTotal(s.daily);
            const width = Math.max((total / maxTotal) * 100, 2);
            chartHtml += `
                <div class="chart-item">
                    <div class="chart-label">${isGame(s) ? '🎮 ' : '🔧 '}${s.service}</div>
                    <div class="chart-bar-wrapper">
                        <div class="chart-bar" style="width: ${width}%"></div>
                    </div>
                    <div class="chart-value">${formatNumber(total)}</div>
                </div>
            `;
        });

        chartHtml += `</div>`;

        // Build trending section
        const trendingServices = services.filter(s => {
            const dates = Object.keys(s.daily).sort();
            return dates.length >= 2;
        }).map(s => {
            const dates = Object.keys(s.daily).sort();
            const lastDate = dates[dates.length - 1];
            const prevDate = dates[dates.length - 2];
            const lastVal = s.daily[lastDate];
            const prevVal = s.daily[prevDate];
            return {
                service: s,
                lastVal,
                prevVal,
                change: lastVal - prevVal,
                lastDate,
                prevDate
            };
        }).sort((a, b) => b.change - a.change).slice(0, 3);

        let trendingHtml = `
            <div class="section-title">🔥 Trending Services</div>
            <div class="trending-grid">
        `;

        trendingServices.forEach((item, index) => {
            const changeClass = item.change >= 0 ? 'positive' : 'negative';
            const changeSign = item.change >= 0 ? '+' : '';
            trendingHtml += `
                <div class="trending-card">
                    <div class="trending-rank">#${index + 1} · ${item.change >= 0 ? 'Growth' : 'Decline'}</div>
                    <div class="trending-name">${isGame(item.service) ? '🎮' : '🔧'} ${item.service.service}</div>
                    <div class="trending-stats">
                        <div>
                            <div style="color: #8a9bb5; font-size: 0.8rem;">${item.prevDate}</div>
                            <div style="font-weight: 600;">${formatNumber(item.prevVal)}</div>
                        </div>
                        <div class="trending-change ${changeClass}">${changeSign}${formatNumber(item.change)}</div>
                        <div>
                            <div style="color: #8a9bb5; font-size: 0.8rem;">${item.lastDate}</div>
                            <div style="font-weight: 600;">${formatNumber(item.lastVal)}</div>
                        </div>
                    </div>
                </div>
            `;
        });

        trendingHtml += `</div>`;

        // Check if there's any data at all
        const hasAnyData = services.some(s => getTotal(s.daily) > 0);

        let contentHtml;
        if (hasAnyData) {
            contentHtml = summaryHtml + tableHtml + chartHtml + trendingHtml;
        } else {
            contentHtml = `
                <div class="no-data">
                    <span class="emoji">📭</span>
                    No data collected yet
                </div>
            `;
        }

        // Inject content
        document.getElementById('dashboard-content').innerHTML = contentHtml;
        document.getElementById('updated-at').textContent = new Date(data.updatedAt).toLocaleString();
    </script>
</body>
</html>
