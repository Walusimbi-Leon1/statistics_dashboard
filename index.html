<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Statistics Dashboard 🎮</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e1a;--surface:#111827;--surface2:#161f33;--surface3:#1a2440;
  --border:#1e2d4a;--gold:#f5a623;--gold-dim:rgba(245,166,35,0.07);
  --gold-glow:rgba(245,166,35,0.25);--text:#e4e8f1;--text2:#8b95ad;
  --text3:#4e5a73;--green:#34d399;--red:#f87171;--blue:#60a5fa;
  --infra-bg:#0f1219;--infra-text:#3b4560;
}
html{font-size:14px}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;line-height:1.5;min-height:100vh}
a{color:var(--gold);text-decoration:none}
.container{max-width:1600px;margin:0 auto;padding:24px 20px}
header{text-align:center;margin-bottom:32px}
header h1{font-size:2rem;font-weight:700;letter-spacing:-0.5px;margin-bottom:4px}
header h1 span.emoji{font-size:1.8rem}
header .subtitle{color:var(--text2);font-size:0.9rem}
header .updated{color:var(--text3);font-size:0.78rem;margin-top:6px}

/* Summary Cards */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:32px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px;position:relative;overflow:hidden;transition:border-color .2s}
.card:hover{border-color:var(--gold)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),transparent);opacity:0.7}
.card .label{font-size:0.78rem;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.card .value{font-size:1.6rem;font-weight:700;color:var(--text)}
.card .detail{font-size:0.78rem;color:var(--text3);margin-top:4px}
.card .value.gold{color:var(--gold)}

/* Table */
.table-section{margin-bottom:36px}
.table-section h2{font-size:1.15rem;font-weight:600;margin-bottom:14px;color:var(--text)}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:0.82rem;white-space:nowrap}
thead th{background:var(--surface2);color:var(--text2);font-weight:600;padding:12px 14px;text-align:left;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:2;cursor:pointer;user-select:none;transition:color .15s}
thead th:hover{color:var(--gold)}
thead th.sort-active{color:var(--gold)}
thead th .sort-arrow{margin-left:4px;font-size:0.7rem;opacity:0.5}
thead th.sort-active .sort-arrow{opacity:1}
tbody tr{border-bottom:1px solid var(--border);transition:background .15s}
tbody tr:hover{background:var(--surface2)}
tbody tr.game-row{background:var(--gold-dim)}
tbody tr.game-row:hover{background:rgba(245,166,35,0.12)}
tbody tr.infra-row{opacity:0.5}
tbody tr.infra-row:hover{opacity:0.75}
td{padding:10px 14px}
td.service-cell{font-weight:600;color:var(--text)}
td.service-cell .game-icon{margin-right:5px}
td.account-cell{color:var(--text3);font-family:monospace;font-size:0.72rem;max-width:90px;overflow:hidden;text-overflow:ellipsis}
td.platform-cell{text-transform:capitalize}
td.day-cell{text-align:right;font-variant-numeric:tabular-nums}
td.total-cell{font-weight:700;text-align:right;color:var(--text)}
td.trend-cell{text-align:center;font-weight:600;font-size:0.85rem}
td.trend-cell.up{color:var(--green)}
td.trend-cell.down{color:var(--red)}
td.trend-cell.flat{color:var(--text3)}
.no-data-row td{text-align:center;color:var(--text3);padding:40px 20px;font-style:italic}

/* Bar Chart */
.chart-section{margin-bottom:36px}
.chart-section h2{font-size:1.15rem;font-weight:600;margin-bottom:14px;color:var(--text)}
.bar-chart{display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;align-items:center;gap:12px}
.bar-label{width:180px;text-align:right;font-size:0.78rem;color:var(--text2);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-label.is-game{color:var(--gold)}
.bar-track{flex:1;height:26px;background:var(--surface2);border-radius:6px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:6px;transition:width .6s ease;min-width:2px}
.bar-fill.game{background:linear-gradient(90deg,#c5850f,var(--gold))}
.bar-fill.infra{background:linear-gradient(90deg,#2a3040,#3d4555)}
.bar-value{width:90px;font-size:0.78rem;color:var(--text2);font-variant-numeric:tabular-nums;flex-shrink:0}

/* Trending */
.trending-section{margin-bottom:36px}
.trending-section h2{font-size:1.15rem;font-weight:600;margin-bottom:14px;color:var(--text)}
.trending-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.trend-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 22px;display:flex;align-items:center;gap:16px;transition:border-color .2s,transform .2s}
.trend-card:hover{border-color:var(--gold);transform:translateY(-2px)}
.trend-rank{font-size:2rem;font-weight:800;color:var(--gold);opacity:0.6;min-width:36px}
.trend-info{flex:1}
.trend-info .trend-name{font-weight:600;font-size:0.95rem;margin-bottom:2px}
.trend-info .trend-meta{font-size:0.78rem;color:var(--text3)}
.trend-change{font-size:1.2rem;font-weight:700;padding:6px 14px;border-radius:8px}
.trend-change.positive{color:var(--green);background:rgba(52,211,153,0.1)}
.trend-change.negative{color:var(--red);background:rgba(248,113,113,0.1)}
.trend-change.zero{color:var(--text3);background:rgba(78,90,115,0.15)}

/* Footer */
footer{text-align:center;padding:28px 20px;color:var(--text3);font-size:0.78rem;border-top:1px solid var(--border);margin-top:20px}
footer span{color:var(--text2)}

/* Legend */
.legend{display:flex;gap:20px;margin-bottom:18px;font-size:0.78rem;color:var(--text2);flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:10px;height:10px;border-radius:3px}
.legend-dot.game{background:var(--gold)}
.legend-dot.infra{background:#3d4555}

/* Responsive */
@media(max-width:768px){
  .container{padding:16px 12px}
  header h1{font-size:1.5rem}
  .summary{grid-template-columns:repeat(2,1fr);gap:10px}
  .card{padding:14px 16px}
  .card .value{font-size:1.3rem}
  .bar-label{width:120px;font-size:0.7rem}
  .trending-grid{grid-template-columns:1fr}
}

/* Scrollbar */
.table-wrap::-webkit-scrollbar{height:8px}
.table-wrap::-webkit-scrollbar-track{background:var(--surface2)}
.table-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.table-wrap::-webkit-scrollbar-thumb:hover{background:var(--text3)}

/* Day columns with alternate shading */
td.day-cell:nth-child(odd){background:rgba(255,255,255,0.01)}
thead th:nth-child(n+5):nth-child(odd){background:var(--surface3)}
</style>
</head>

(function(){
  const app = document.getElementById('app');
  const d = RAW_DATA;
  const services = d.services;
  const updatedAt = d.updatedAt;

  if(!services || services.length === 0){
    app.innerHTML = '<div style="text-align:center;padding:80px 20px;color:var(--text2)"><h2 style="margin-bottom:10px">🎮 No data collected yet</h2><p>Check back later for request statistics.</p></div>';
    return;
  }

  // Gather all unique dates
  const dateSet = new Set();
  services.forEach(s => Object.keys(s.daily).forEach(dt => dateSet.add(dt)));
  const dates = Array.from(dateSet).sort();

  // Format helpers
  function fmt(n){ return n.toLocaleString('en-US'); }
  function fmtDate(dt){ return dt.slice(5).replace('-','/'); }

  // Game detection
  const gamePatterns = /game|trivia|bible|quran|dice|bluff|snake|pop|casino|voice|youtrivia|stickman|arrow|brick|rumble|balloon|party/i;
  const infraNames = /proxy|audiobook|youstream|wstest|probe|odespace|repo-task|tiktok|discord-activity|test|hindsight/i;

  function isGame(s){
    if(s.kind === 'game') return true;
    if(infraNames.test(s.service)) return false;
    if(gamePatterns.test(s.service)) return true;
    if(s.kind === 'game') return true;
    return false;
  }

  // Compute per-service totals and display info
  const enriched = services.map(s => {
    const total = Object.values(s.daily).reduce((a,b) => a+b, 0);
    const lastDate = dates[dates.length-1];
    const prevDate = dates[dates.length-2];
    const lastDayVal = s.daily[lastDate] || 0;
    const prevDayVal = s.daily[prevDate] || 0;
    const diff = lastDayVal - prevDayVal;
    const displayName = services.filter(x => x.service === s.service).length > 1
      ? s.service + ' (' + s.platform + ')'
      : s.service;
    return { ...s, total, lastDayVal, prevDayVal, diff, displayName, isGame: isGame(s) };
  });

  // Sort by total desc
  enriched.sort((a,b) => b.total - a.total);

  // Summary stats
  const totalAllTime = enriched.reduce((a,s) => a + s.total, 0);
  const lastDate = dates[dates.length-1];
  const totalLastDay = enriched.reduce((a,s) => a + (s.daily[lastDate]||0), 0);
  const topService = enriched[0];
  const numServices = services.length;

  // Trending: biggest growth (or least decline) between last two dates
  const prevDate = dates[dates.length-2];
  const trending = enriched
    .filter(s => s.total > 0)
    .sort((a,b) => b.diff - a.diff)
    .slice(0,3);

  // Bar chart data: top 18 services with activity
  const barData = enriched.filter(s => s.total > 0).slice(0,18);
  const barMax = barData.length > 0 ? barData[0].total : 1;

  // Build HTML
  let html = '';

  // Header
  html += '<header>';
  html += '<h1><span class="emoji">🎮</span> Game Statistics Dashboard</h1>';
  html += '<div class="subtitle">Daily Cloudflare Request Counts for Games &amp; Services</div>';
  html += '<div class="updated">Generated by big-pickle · ' + new Date(updatedAt).toLocaleString('en-US', {dateStyle:'medium',timeStyle:'short'}) + ' · Data: Cloudflare GraphQL Analytics</div>';
  html += '</header>';

  // Summary cards
  html += '<div class="summary">';
  html += '<div class="card"><div class="label">Requests (Last Day)</div><div class="value gold">' + fmt(totalLastDay) + '</div><div class="detail">' + fmtDate(lastDate) + '</div></div>';
  html += '<div class="card"><div class="label">Requests (All Time)</div><div class="value">' + fmt(totalAllTime) + '</div><div class="detail">' + dates.length + ' days tracked</div></div>';
  html += '<div class="card"><div class="label">Services Tracked</div><div class="value">' + numServices + '</div><div class="detail">' + enriched.filter(s=>s.isGame).length + ' games · ' + enriched.filter(s=>!s.isGame).length + ' infra</div></div>';
  html += '<div class="card"><div class="label">Top Service (All Time)</div><div class="value gold">' + topService.displayName + '</div><div class="detail">' + fmt(topService.total) + ' total requests</div></div>';
  html += '</div>';

  // Legend
  html += '<div class="legend">';
  html += '<div class="legend-item"><div class="legend-dot game"></div> Game Service 🎮</div>';
  html += '<div class="legend-item"><div class="legend-dot infra"></div> Infrastructure</div>';
  html += '</div>';

  // Trending section
  html += '<div class="trending-section">';
  html += '<h2>📈 Trending — Biggest Growth (' + fmtDate(prevDate) + ' → ' + fmtDate(lastDate) + ')</h2>';
  html += '<div class="trending-grid">';
  trending.forEach((s,i) => {
    const cls = s.diff > 0 ? 'positive' : s.diff < 0 ? 'negative' : 'zero';
    const arrow = s.diff > 0 ? '▲' : s.diff < 0 ? '▼' : '—';
    const sign = s.diff > 0 ? '+' : '';
    html += '<div class="trend-card">';
    html += '<div class="trend-rank">#' + (i+1) + '</div>';
    html += '<div class="trend-info">';
    html += '<div class="trend-name">' + (s.isGame ? '🎮 ' : '') + s.displayName + '</div>';
    html += '<div class="trend-meta">' + fmt(s.prevDayVal) + ' → ' + fmt(s.lastDayVal) + ' requests</div>';
    html += '</div>';
    html += '<div class="trend-change ' + cls + '">' + arrow + ' ' + sign + fmt(s.diff) + '</div>';
    html += '</div>';
  });
  html += '</div></div>';

  // Bar Chart
  html += '<div class="chart-section">';
  html += '<h2>📊 Requests by Service (All Time)</h2>';
  html += '<div class="bar-chart">';
  barData.forEach(s => {
    const pct = barMax > 0 ? (s.total / barMax * 100) : 0;
    const cls = s.isGame ? 'game' : 'infra';
    html += '<div class="bar-row">';
    html += '<div class="bar-label ' + (s.isGame ? 'is-game' : '') + '">' + (s.isGame ? '🎮 ' : '') + s.displayName + '</div>';
    html += '<div class="bar-track"><div class="bar-fill ' + cls + '" style="width:' + pct.toFixed(1) + '%"></div></div>';
    html += '<div class="bar-value">' + fmt(s.total) + '</div>';
    html += '</div>';
  });
  html += '</div></div>';

  // Main Table
  html += '<div class="table-section">';
  html += '<h2>📋 Detailed Daily Breakdown</h2>';
  html += '<div class="table-wrap"><table id="dataTable">';
  // Header
  html += '<thead><tr>';
  html += '<th data-col="name" class="sort-active" onclick="sortTable(\'name\',1)">Service <span class="sort-arrow">▼</span></th>';
  html += '<th data-col="account">Account</th>';
  html += '<th data-col="platform">Platform</th>';
  dates.forEach(dt => {
    html += '<th data-col="day_'+dt+'">' + fmtDate(dt) + '</th>';
  });
  html += '<th data-col="total" onclick="sortTable(\'total\',-1)">Total <span class="sort-arrow">▼</span></th>';
  html += '<th data-col="trend" onclick="sortTable(\'trend\',-1)">Trend <span class="sort-arrow">▼</span></th>';
  html += '</tr></thead>';
  // Body
  html += '<tbody id="tableBody">';
  enriched.forEach(s => {
    const rowCls = s.isGame ? 'game-row' : (s.total === 0 ? 'infra-row' : '');
    html += '<tr class="' + rowCls + '" data-total="' + s.total + '" data-trend="' + s.diff + '" data-name="' + s.displayName.toLowerCase() + '">';
    html += '<td class="service-cell">' + (s.isGame ? '<span class="game-icon">🎮</span>' : '<span style="opacity:0.3;margin-right:5px">⚙</span>') + s.displayName + '</td>';
    html += '<td class="account-cell" title="' + s.account + '">' + s.account.slice(0,8) + '…</td>';
    html += '<td class="platform-cell">' + s.platform + '</td>';
    dates.forEach(dt => {
      const val = s.daily[dt] || 0;
      html += '<td class="day-cell">' + (val > 0 ? fmt(val) : '—') + '</td>';
    });
    html += '<td class="total-cell">' + fmt(s.total) + '</td>';
    const tCls = s.diff > 0 ? 'up' : s.diff < 0 ? 'down' : 'flat';
    const tSign = s.diff > 0 ? '+' : '';
    const tArrow = s.diff > 0 ? '▲' : s.diff < 0 ? '▼' : '—';
    html += '<td class="trend-cell ' + tCls + '">' + tArrow + ' ' + tSign + fmt(s.diff) + '</td>';
    html += '</tr>';
  });
  html += '</tbody></table></div></div>';

  // Footer
  html += '<footer>Generated by <span>big-pickle</span> · ' + new Date(updatedAt).toLocaleString('en-US', {dateStyle:'medium',timeStyle:'short'}) + ' · Data: Cloudflare GraphQL Analytics</footer>';

  app.innerHTML = html;
})();

// Minimal table sorting
function sortTable(col, dir){
  const tbody = document.getElementById('tableBody');
  if(!tbody) return;
  const rows = Array.from(tbody.querySelectorAll('tr'));
  rows.sort((a,b) => {
    let va, vb;
    if(col === 'total'){
      va = parseFloat(a.dataset.total)||0;
      vb = parseFloat(b.dataset.total)||0;
    } else if(col === 'trend'){
      va = parseFloat(a.dataset.trend)||0;
      vb = parseFloat(b.dataset.trend)||0;
    } else {
      va = a.dataset.name||'';
      vb = b.dataset.name||'';
    }
    if(typeof va === 'string') return va.localeCompare(vb) * dir;
    return (va - vb) * dir;
  });
  // Update sort arrows
  document.querySelectorAll('thead th').forEach(th => {
    th.classList.remove('sort-active');
  });
  const activeTh = document.querySelector('thead th[data-col="'+col+'"]');
  if(activeTh){
    activeTh.classList.add('sort-active');
    activeTh.querySelector('.sort-arrow').textContent = dir > 0 ? '▼' : '▲';
  }
  rows.forEach(r => tbody.appendChild(r));
}
