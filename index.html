<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Statistics Dashboard</title>
    <style>
        :root {
            --bg-primary: #0d1b2a;
            --bg-secondary: #1b2d3f;
            --bg-card: #1f3349;
            --text-primary: #e6f7ff;
            --text-secondary: #88b1cc;
            --gold: #ffd700;
            --gold-light: rgba(255, 215, 0, 0.1);
            --emerald: #10b981;
            --red: #ef4444;
            --border: #2a4158;
            --infrastructure: #4b5563;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #0d2f4a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .stat-card h3 {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--gold);
        }

        .stat-card .detail {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .section-title {
            color: var(--gold);
            margin: 30px 0 15px;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .table-container {
            overflow-x: auto;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1200px;
        }

        th {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            padding: 15px 12px;
            text-align: left;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        tr:hover {
            background: rgba(255, 215, 0, 0.05);
        }

        tr.infrastructure {
            color: var(--infrastructure);
        }

        tr.infrastructure td {
            opacity: 0.7;
        }

        tr.game {
            background: var(--gold-light);
        }

        .service-name {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .trend-up {
            color: var(--emerald);
        }

        .trend-down {
            color: var(--red);
        }

        .chart-container {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 800px;
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .bar-label {
            width: 180px;
            text-align: right;
            font-size: 0.9rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bar-container {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.05);
            height: 24px;
            border-radius: 4px;
            overflow: hidden;
        }

        .bar {
            height: 100%;
            background: linear-gradient(90deg, var(--gold) 0%, #e6b800 100%);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .bar-value {
            width: 100px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--gold);
        }

        .trending-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .trending-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
            border-left: 4px solid var(--gold);
        }

        .trending-card h4 {
            color: var(--text-secondary);
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .trending-service {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .trending-service:last-child {
            border-bottom: none;
        }

        .trending-name {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .trending-change {
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .trending-change.positive {
            background: rgba(16, 185, 129, 0.2);
            color: var(--emerald);
        }

        .trending-change.negative {
            background: rgba(239, 68, 68, 0.2);
            color: var(--red);
        }

        footer {
            text-align: center;
            padding: 30px 0;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            margin-top: 40px;
            font-size: 0.9rem;
        }

        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        .no-data span {
            font-size: 2rem;
            display: block;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
                flex-direction: column;
                gap: 5px;
            }
            
            .stats-row {
                grid-template-columns: 1fr;
            }
            
            .stat-card .value {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

            }
            
            // Check if kind contains "game"
            if (service.kind && service.kind.toLowerCase().includes('game')) {
                return true;
            }
            
            return false;
        }

        // Get all unique dates from all services
        function getAllDates() {
            const dates = new Set();
            data.services.forEach(service => {
                Object.keys(service.daily).forEach(date => dates.add(date));
            });
            return Array.from(dates).sort();
        }

        // Calculate total requests for a service
        function getTotal(service) {
            return Object.values(service.daily).reduce((sum, count) => sum + count, 0);
        }

        // Get the last day with data for each service
        function getLastDay(service) {
            const dates = Object.keys(service.daily).sort();
            return dates.length > 0 ? dates[dates.length - 1] : null;
        }

        // Get requests for a specific date
        function getRequests(service, date) {
            return service.daily[date] || 0;
        }

        // Main dashboard rendering
        function renderDashboard() {
            const container = document.getElementById('dashboard-content');
            const updateSpan = document.getElementById('update-time');
            
            // Check if there's any data
            if (!data.services || data.services.length === 0) {
                container.innerHTML = `
                    <div class="no-data">
                        <span>📊</span>
                        No data collected yet
                    </div>
                `;
                return;
            }
            
            // Set update time
            const updateDate = new Date(data.updatedAt);
            updateSpan.textContent = updateDate.toLocaleString();
            
            // Process services and calculate totals
            const services = data.services.map(service => ({
                ...service,
                total: getTotal(service),
                lastDay: getLastDay(service),
                isGame: isGame(service)
            }));
            
            // Sort services by total requests (descending)
            services.sort((a, b) => b.total - a.total);
            
            // Get all unique dates
            const allDates = getAllDates();
            
            // Calculate summary statistics
            const lastDayDate = allDates[allDates.length - 1];
            const totalLastDay = services.reduce((sum, service) => sum + getRequests(service, lastDayDate), 0);
            const totalAllTime = services.reduce((sum, service) => sum + service.total, 0);
            const topService = services[0];
            
            // Find trending services (biggest growth between two most recent days)
            const trendingServices = [];
            if (allDates.length >= 2) {
                const recentDay = allDates[allDates.length - 1];
                const previousDay = allDates[allDates.length - 2];
                
                services.forEach(service => {
                    const recent = getRequests(service, recentDay);
                    const previous = getRequests(service, previousDay);
                    const change = recent - previous;
                    
                    if (service.total > 0) { // Only consider services with some traffic
                        trendingServices.push({
                            service: service.service,
                            change: change,
                            percentage: previous > 0 ? Math.round((change / previous) * 100) : change > 0 ? 100 : 0
                        });
                    }
                });
                
                // Sort by change (descending) - positive changes first
                trendingServices.sort((a, b) => b.change - a.change);
            }
            
            // Build HTML
            let html = `
                <div class="stats-row">
                    <div class="stat-card">
                        <h3>Last Day Total</h3>
                        <div class="value">${formatNumber(totalLastDay)}</div>
                        <div class="detail">${lastDayDate}</div>
                    </div>
                    <div class="stat-card">
                        <h3>All Time Total</h3>
                        <div class="value">${formatNumber(totalAllTime)}</div>
                        <div class="detail">${allDates.length} days of data</div>
                    </div>
                    <div class="stat-card">
                        <h3>Services Tracked</h3>
                        <div class="value">${services.length}</div>
                        <div class="detail">${services.filter(s => s.isGame).length} games</div>
                    </div>
                    <div class="stat-card">
                        <h3>Top Service</h3>
                        <div class="value">${topService.service}</div>
                        <div class="detail">${formatNumber(topService.total)} total requests</div>
                    </div>
                </div>
                
                <h2 class="section-title">Trending Services</h2>
                <div class="trending-section">
                    <div class="trending-card">
                        <h4>Top Growth (vs Previous Day)</h4>
            `;
            
            // Top 3 trending services
            const topTrending = trendingServices.slice(0, 3);
            if (topTrending.length > 0) {
                topTrending.forEach(service => {
                    const isPositive = service.change >= 0;
                    const emoji = isPositive ? '📈' : '📉';
                    const changeText = service.change === 0 ? 'No change' : 
                        (service.percentage > 0 ? `+${service.percentage}%` : `${service.percentage}%`);
                    
                    html += `
                        <div class="trending-service">
                            <div class="trending-name">${emoji} ${service.service}</div>
                            <div class="trending-change ${isPositive ? 'positive' : 'negative'}">${changeText}</div>
                        </div>
                    `;
                });
            } else {
                html += `
                    <div class="trending-service">
                        <div class="trending-name">No significant changes</div>
                    </div>
                `;
            }
            
            html += `
                    </div>
                    <div class="trending-card">
                        <h4>Top Declines</h4>
            `;
            
            // Top 3 declining services (if any)
            const bottomTrending = trendingServices.filter(s => s.change < 0).slice(0, 3);
            if (bottomTrending.length > 0) {
                bottomTrending.forEach(service => {
                    const changeText = service.percentage < 0 ? `${service.percentage}%` : 'No decline';
                    
                    html += `
                        <div class="trending-service">
                            <div class="trending-name">📉 ${service.service}</div>
                            <div class="trending-change negative">${changeText}</div>
                        </div>
                    `;
                });
            } else {
                html += `
                    <div class="trending-service">
                        <div class="trending-name">No significant declines</div>
                    </div>
                `;
            }
            
            html += `
                    </div>
                </div>
                
                <h2 class="section-title">📊 Service Details</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Service</th>
                                <th>Account</th>
                                <th>Platform</th>
            `;
            
            // Add date columns (newest last)
            allDates.forEach(date => {
                html += `<th>${date.slice(5)}</th>`; // Show MM-DD only
            });
            
            html += `
                                <th>Total</th>
                                <th>Trend</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            // Table rows
            services.forEach(service => {
                const rowClass = service.isGame ? 'game' : 'infrastructure';
                const emoji = service.isGame ? '🎮 ' : '';
                
                html += `
                    <tr class="${rowClass}">
                        <td><div class="service-name">${emoji}${service.service}</div></td>
                        <td>${service.account.slice(0, 8)}...</td>
                        <td>${service.platform}</td>
                `;
                
                // Daily values
                allDates.forEach(date => {
                    const value = getRequests(service, date);
                    html += `<td>${value > 0 ? formatNumber(value) : '-'}</td>`;
                });
                
                html += `<td>${formatNumber(service.total)}</td>`;
                
                // Trend calculation (compare last two days with data)
                const datesWithData = Object.keys(service.daily).sort();
                if (datesWithData.length >= 2) {
                    const last = getRequests(service, datesWithData[datesWithData.length - 1]);
                    const prev = getRequests(service, datesWithData[datesWithData.length - 2]);
                    
                    if (last > prev) {
                        html += `<td class="trend-up">▲ ${formatNumber(last - prev)}</td>`;
                    } else if (last < prev) {
                        html += `<td class="trend-down">▼ ${formatNumber(prev - last)}</td>`;
                    } else {
                        html += `<td>—</td>`;
                    }
                } else {
                    html += `<td>—</td>`;
                }
                
                html += `</tr>`;
            });
            
            html += `
                        </tbody>
                    </table>
                </div>
                
                <h2 class="section-title">📈 Request Distribution</h2>
                <div class="chart-container">
                    <div class="bar-chart">
            `;
            
            // Bar chart (top 10 services)
            const maxTotal = services[0] ? services[0].total : 1;
            services.slice(0, 10).forEach(service => {
                const widthPercent = (service.total / maxTotal) * 100;
                
                html += `
                    <div class="bar-row">
                        <div class="bar-label">${service.isGame ? '🎮 ' : ''}${service.service}</div>
                        <div class="bar-container">
                            <div class="bar" style="width: ${widthPercent}%"></div>
                        </div>
                        <div class="bar-value">${formatNumber(service.total)}</div>
                    </div>
                `;
            });
            
            html += `
                    </div>
                </div>
            `;
            
            container.innerHTML = html;
        }
        
        // Render dashboard when page loads
        document.addEventListener('DOMContentLoaded', renderDashboard);
    </script>
</body>
</html>
