<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Statistics Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #0b1a2e 0%, #10243a 100%);
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      color: #e3e9f2;
      padding: 2rem 1.5rem;
      min-height: 100vh;
    }

    .dashboard {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: #f5d47a;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
      border-bottom: 2px solid #2c4059;
      padding-bottom: 0.75rem;
    }

    h1 span {
      font-size: 2.5rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .stat-card {
      background: #132a3f;
      border-radius: 16px;
      padding: 1.2rem 1rem;
      border: 1px solid #2e4a66;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
      backdrop-filter: blur(2px);
    }

    .stat-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8fa9c2;
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: #f5d47a;
      line-height: 1.2;
    }

    .stat-sub {
      font-size: 0.8rem;
      color: #b0c7de;
      margin-top: 0.3rem;
    }

    .table-wrapper {
      background: #0f2135;
      border-radius: 18px;
      border: 1px solid #2e4a66;
      overflow-x: auto;
      margin-bottom: 2.5rem;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1200px;
      font-size: 0.9rem;
    }

    th {
      background: #1b3a52;
      color: #f0d68a;
      font-weight: 600;
      padding: 0.9rem 0.8rem;
      text-align: right;
      border-bottom: 2px solid #3a5a7a;
      white-space: nowrap;
      position: sticky;
      top: 0;
    }

    th:first-child, th:nth-child(2), th:nth-child(3) {
      text-align: left;
    }

    td {
      padding: 0.7rem 0.8rem;
      border-bottom: 1px solid #1e3a52;
      text-align: right;
      white-space: nowrap;
    }

    td:first-child, td:nth-child(2), td:nth-child(3) {
      text-align: left;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .service-name {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .game-service {
      background-color: rgba(212, 175, 55, 0.12);
      color: #f5e2a9;
    }

    .game-service .service-name {
      color: #f5d47a;
    }

    .infra-service {
      opacity: 0.55;
      color: #a0b6cc;
    }

    .infra-service .service-name {
      color: #9bb0c7;
    }

    .trend-up {
      color: #4cd964;
      font-weight: 600;
    }

    .trend-down {
      color: #ff6b6b;
      font-weight: 600;
    }

    .trend-flat {
      color: #8fa9c2;
    }

    .total-cell {
      font-weight: 700;
      color: #f5d47a;
      border-left: 1px solid #2e4a66;
    }

    .bar-chart-section {
      background: #0f2135;
      border-radius: 18px;
      border: 1px solid #2e4a66;
      padding: 1.8rem 1.5rem;
      margin-bottom: 2.5rem;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: #f5d47a;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .bar-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 0.7rem;
    }

    .bar-label {
      width: 180px;
      text-align: right;
      font-size: 0.85rem;
      color: #c0d2e5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bar-track {
      flex: 1;
      background: #1b3045;
      border-radius: 20px;
      height: 24px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #d4af37, #f5d47a);
      border-radius: 20px;
      min-width: 2px;
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
    }

    .bar-value {
      width: 90px;
      font-size: 0.85rem;
      color: #f0d68a;
      font-weight: 600;
    }

    .trending-section {
      background: #0f2135;
      border-radius: 18px;
      border: 1px solid #2e4a66;
      padding: 1.8rem 1.5rem;
      margin-bottom: 2.5rem;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }

    .trending-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
    }

    .trend-card {
      background: #132a3f;
      border-radius: 14px;
      padding: 1.2rem;
      border-left: 4px solid #d4af37;
    }

    .trend-card .service {
      font-weight: 600;
      font-size: 1.1rem;
      color: #f5d47a;
      margin-bottom: 0.4rem;
    }

    .trend-card .growth {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .trend-card .growth.positive {
      color: #4cd964;
    }

    .trend-card .growth.negative {
      color: #ff6b6b;
    }

    .trend-card .detail {
      font-size: 0.8rem;
      color: #9fb8d0;
      margin-top: 0.3rem;
    }

    .footer {
      text-align: center;
      color: #7f97b0;
      font-size: 0.8rem;
      padding: 1.5rem 0 0.5rem;
      border-top: 1px solid #2c4059;
      margin-top: 1rem;
    }

    .no-data {
      text-align: center;
      padding: 4rem 2rem;
      color: #b0c7de;
      font-size: 1.2rem;
    }

    .emoji-icon {
      font-size: 1.2rem;
    }

    @media (max-width: 600px) {
      body { padding: 1rem; }
      h1 { font-size: 1.6rem; }
      .bar-label { width: 100px; }
      .bar-value { width: 70px; }
    }
  </style>
</head>

    });

      }
      row += `<td>${trendHtml}</td></tr>`;
      rowsHtml += row;
    });

    const topForBar = [...serviceMeta].sort((a,b)=>b.total-a.total).slice(0,10);
    const maxTotal = topForBar[0]?.total || 1;
    let barHtml = '';
    topForBar.forEach(s => {
      const pct = Math.max(2, Math.round((s.total / maxTotal) * 100));
      const game = isGame(s);
      const label = game ? `🎮 ${s.service}` : s.service;
      barHtml += `
        <div class="bar-item">
          <div class="bar-label" title="${s.service}">${label}</div>

          <div class="bar-value">${fmt(s.total)}</div>
        </div>`;
    });

    // trending: top 3 growth between last two dates with data (per service)
    const growthList = [];
    serviceMeta.forEach(s => {
      if (prevDate && s.daily[prevDate] !== undefined && s.daily[lastDate] !== undefined) {
        const diff = (s.daily[lastDate] || 0) - (s.daily[prevDate] || 0);
        growthList.push({ service: s.service, diff, last: s.daily[lastDate] || 0, prev: s.daily[prevDate] || 0, game: isGame(s) });
      }
    });
    growthList.sort((a,b) => b.diff - a.diff);
    const top3 = growthList.slice(0,3);
    let trendCards = '';
    if (top3.length === 0) {
