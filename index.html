<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 Game Statistics Dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#0a0e1a;
  --bg-secondary:#111827;
  --bg-card:#1a2235;
  --bg-card-hover:#1e2a42;
  --border:#2a3550;
  --text-primary:#e8edf5;
  --text-secondary:#8892a8;
  --text-dim:#555e73;
  --gold:#f0b429;
  --gold-dim:rgba(240,180,41,0.12);
  --gold-glow:rgba(240,180,41,0.25);
  --emerald:#10b981;
  --emerald-dim:rgba(16,185,129,0.15);
  --red:#ef4444;
  --red-dim:rgba(239,68,68,0.15);
  --blue:#3b82f6;
  --purple:#8b5cf6;
  --bar-bg:#1a2235;
  --infra-bg:#151b2b;
  --infra-border:#1e2538;
}
html{font-size:14px;scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg-primary);
  color:var(--text-primary);
  line-height:1.6;
  min-height:100vh;
}
.container{max-width:1440px;margin:0 auto;padding:1.5rem}

/* Header */
.header{
  text-align:center;
  padding:2rem 1rem 1.5rem;
  border-bottom:1px solid var(--border);
  margin-bottom:2rem;
}
.header h1{
  font-size:2rem;
  font-weight:700;
  letter-spacing:-0.5px;
  background:linear-gradient(135deg,var(--gold),#fcd34d,var(--gold));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.header .subtitle{
  color:var(--text-secondary);
  font-size:0.85rem;
  margin-top:0.4rem;
}

/* Stat Cards */
.stats-row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:1rem;
  margin-bottom:2.5rem;
}
.stat-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:1.25rem 1.5rem;
  position:relative;
  overflow:hidden;
  transition:border-color 0.2s;
}
.stat-card:hover{border-color:var(--gold)}
.stat-card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:3px;
  background:linear-gradient(90deg,var(--gold),var(--emerald));
  opacity:0;
  transition:opacity 0.2s;
}
.stat-card:hover::before{opacity:1}
.stat-card .label{
  font-size:0.75rem;
  text-transform:uppercase;
  letter-spacing:0.8px;
  color:var(--text-secondary);
  margin-bottom:0.5rem;
}
.stat-card .value{
  font-size:1.6rem;
  font-weight:700;
  color:var(--text-primary);
}
.stat-card .value.gold{color:var(--gold)}
.stat-card .detail{font-size:0.7rem;color:var(--text-dim);margin-top:0.3rem}

/* Table Section */
.section-title{
  font-size:1.1rem;
  font-weight:600;
  margin-bottom:1rem;
  display:flex;
  align-items:center;
  gap:0.5rem;
}
.section-title .icon{font-size:1.2rem}

.table-wrap{
  overflow-x:auto;
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:2.5rem;
  background:var(--bg-card);
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:0.8rem;
  min-width:1200px;
}
thead{
  position:sticky;
  top:0;
  z-index:2;
}
thead th{
  background:var(--bg-secondary);
  color:var(--text-secondary);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.5px;
  font-size:0.65rem;
  padding:0.75rem 0.6rem;
  text-align:right;
  border-bottom:2px solid var(--border);
  white-space:nowrap;
  cursor:pointer;
  user-select:none;
  transition:color 0.15s;
}
thead th:first-child,thead th:nth-child(2),thead th:nth-child(3),thead th:nth-child(4){text-align:left}
thead th:hover{color:var(--gold)}
thead th.sorted-asc::after{content:' ▲';color:var(--gold)}
thead th.sorted-desc::after{content:' ▼';color:var(--gold)}
tbody tr{
  border-bottom:1px solid var(--border);
  transition:background 0.15s;
}
tbody tr:hover{background:var(--bg-card-hover)}
tbody tr.game-row{background:var(--gold-dim)}
tbody tr.game-row:hover{background:rgba(240,180,41,0.18)}
tbody tr.infra-row{opacity:0.55}
tbody tr.infra-row:hover{opacity:0.75}
tbody td{
  padding:0.6rem 0.6rem;
  text-align:right;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
tbody td:first-child,tbody td:nth-child(2),tbody td:nth-child(3),tbody td:nth-child(4){
  text-align:left;
}
.service-name{font-weight:600;color:var(--text-primary)}
.service-name.game-label{color:var(--gold)}
.service-name.infra-label{color:var(--text-dim)}
.platform-badge{
  display:inline-block;
  padding:0.15rem 0.45rem;
  border-radius:4px;
  font-size:0.65rem;
  font-weight:600;
  text-transform:uppercase;
}
.platform-worker{background:rgba(59,130,246,0.15);color:#60a5fa}
.platform-pages{background:rgba(139,92,246,0.15);color:#a78bfa}
.total-cell{font-weight:700;color:var(--text-primary)}
.trend-up{color:var(--emerald);font-weight:600}
.trend-down{color:var(--red);font-weight:600}
.trend-flat{color:var(--text-dim)}
.day-zero{color:var(--text-dim);opacity:0.5}

/* Bar Chart */
.bar-chart{margin-bottom:2.5rem}
.bar-item{
  display:flex;
  align-items:center;
  margin-bottom:0.4rem;
  gap:0.75rem;
}
.bar-label{
  min-width:180px;
  text-align:right;
  font-size:0.78rem;
  color:var(--text-secondary);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  flex-shrink:0;
}
.bar-track{
  flex:1;
  height:22px;
  background:var(--bar-bg);
  border-radius:4px;
  overflow:hidden;
  position:relative;
}
.bar-fill{
  height:100%;
  border-radius:4px;
  transition:width 0.6s ease;
  position:relative;
}
.bar-fill.game-bar{background:linear-gradient(90deg,var(--gold),#d97706)}
.bar-fill.infra-bar{background:linear-gradient(90deg,#4b5563,#6b7280)}
.bar-value{
  min-width:80px;
  text-align:right;
  font-size:0.75rem;
  color:var(--text-secondary);
  font-variant-numeric:tabular-nums;
  flex-shrink:0;
}

/* Trending */
.trending{margin-bottom:2.5rem}
.trending-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:1rem;
}
.trend-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:1.25rem;
  position:relative;
  overflow:hidden;
}
.trend-card.top-1{border-color:var(--gold)}
.trend-card.top-1::before{
  content:'🥇';
  position:absolute;
  top:0.75rem;right:0.75rem;
  font-size:1.4rem;
}
.trend-card.top-2{border-color:#c0c0c0}
.trend-card.top-2::before{
  content:'🥈';
  position:absolute;
  top:0.75rem;right:0.75rem;
  font-size:1.4rem;
}
.trend-card.top-3{border-color:#cd7f32}
.trend-card.top-3::before{
  content:'🥉';
  position:absolute;
  top:0.75rem;right:0.75rem;
  font-size:1.4rem;
}
.trend-card .trend-service{font-weight:700;font-size:1rem;margin-bottom:0.5rem}
.trend-card .trend-detail{font-size:0.78rem;color:var(--text-secondary)}
.trend-card .trend-amount{
  font-size:1.3rem;
  font-weight:700;
  margin:0.5rem 0;
}
.trend-amount.positive{color:var(--emerald)}
.trend-amount.negative{color:var(--red)}

/* Footer */
.footer{
  text-align:center;
  padding:2rem 1rem;
  border-top:1px solid var(--border);
  margin-top:2rem;
  font-size:0.75rem;
  color:var(--text-dim);
}

/* No data */
.no-data{
  text-align:center;
  padding:4rem 2rem;
  color:var(--text-secondary);
  font-size:1.1rem;
}
.no-data .emoji{font-size:3rem;display:block;margin-bottom:1rem}

@media(max-width:768px){
  .container{padding:0.75rem}
  .header h1{font-size:1.4rem}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .stat-card .value{font-size:1.2rem}
  .bar-label{min-width:100px;font-size:0.7rem}
}
@media(max-width:480px){
  .stats-row{grid-template-columns:1fr}
}
</style>
</head>

const GAME_PATTERNS = /game|trivia|rumble|bible|quran|islamic|dice|bluff|snake|pop|casino|voice|youtrivia|song|arena|break|party|balloon|discord|arrow|blast|hangman|word|puzzle|chess|tetris/i;
const INFRA_NAMES = ['opencode-proxy','audiobooks','youstream-proxy','wstest-probe2','egress-probe','odespace-3','repo-task-keeper','tiktok-reels'];

function isGame(s) {
  if (INFRA_NAMES.includes(s.service)) return false;
  if (GAME_PATTERNS.test(s.service)) return true;
  if (s.kind === 'game') return true;
  return false;
}

function fmt(n) {
  return n == null ? '—' : n.toLocaleString('en-US');
}

function shortDate(d) {
  const parts = d.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[parseInt(parts[1])-1] + ' ' + parseInt(parts[2]);
}

function init() {
  const app = document.getElementById('app');
  document.getElementById('footer-time').textContent = new Date(DATA.updatedAt).toLocaleString('en-US');

  if (!DATA.services || DATA.services.length === 0) {
    app.innerHTML = '<div class="no-data"><span class="emoji">📊</span>No data collected yet</div>';
    return;
  }

  // Collect all dates
  const dateSet = new Set();
  DATA.services.forEach(s => Object.keys(s.daily).forEach(d => dateSet.add(d)));
  const allDates = Array.from(dateSet).sort();

  // Enrich services
  const services = DATA.services.map(s => {
    const total = Object.values(s.daily).reduce((a,b) => a + b, 0);
    const game = isGame(s);
    return { ...s, total, game };
  });

  // Compute summary
  const lastDate = allDates[allDates.length - 1];
  const prevDate = allDates.length >= 2 ? allDates[allDates.length - 2] : null;
  const grandTotal = services.reduce((a,s) => a + s.total, 0);
  const lastDayTotal = services.reduce((a,s) => a + (s.daily[lastDate] || 0), 0);
  const topService = services.reduce((a,s) => s.total > a.total ? s : a, services[0]);

  // Sort services: games first by total desc, then infra
  services.sort((a,b) => {
    if (a.game !== b.game) return a.game ? -1 : 1;
    return b.total - a.total;
  });

  const maxTotal = Math.max(...services.map(s => s.total));

  // Build HTML
  let html = '';

  // Stats Row
  html += `<div class="stats-row">
    <div class="stat-card">
      <div class="label">Last Day Requests (${shortDate(lastDate)})</div>
      <div class="value">${fmt(lastDayTotal)}</div>
      <div class="detail">Across all services</div>
    </div>
    <div class="stat-card">
      <div class="label">All-Time Requests (shown period)</div>
      <div class="value">${fmt(grandTotal)}</div>
      <div class="detail">${allDates.length} days · ${allDates[0]} → ${lastDate}</div>
    </div>
    <div class="stat-card">
      <div class="label">Services Tracked</div>
      <div class="value">${services.length}</div>
      <div class="detail">${services.filter(s=>s.game).length} games · ${services.filter(s=>!s.game).length} infra</div>
    </div>
    <div class="stat-card">
      <div class="label">Top Service (all-time)</div>
      <div class="value gold">${topService.game ? '🎮 ' : ''}${topService.service}</div>
      <div class="detail">${fmt(topService.total)} requests</div>
    </div>
  </div>`;

  // Trending Section
  if (prevDate) {
    const trendData = services.map(s => {
      const cur = s.daily[lastDate] || 0;
      const prev = s.daily[prevDate] || 0;
      return { ...s, currentDay: cur, prevDay: prev, diff: cur - prev };
    }).filter(s => s.total > 0)
      .sort((a,b) => b.diff - a.diff)
      .slice(0, 3);

    html += `<div class="trending"><div class="section-title"><span class="icon">📈</span> Trending — Biggest Growth (${shortDate(prevDate)} → ${shortDate(lastDate)})</div><div class="trending-grid">`;
    trendData.forEach((s, i) => {
      const cls = i === 0 ? 'top-1' : i === 1 ? 'top-2' : 'top-3';
      const sign = s.diff >= 0 ? '+' : '';
      const amtCls = s.diff >= 0 ? 'positive' : 'negative';
      html += `<div class="trend-card ${cls}">
        <div class="trend-service">${s.game ? '🎮 ' : ''}${s.service}</div>
        <div class="trend-detail">${fmt(s.prevDay)} → ${fmt(s.currentDay)} requests</div>
        <div class="trend-amount ${amtCls}">${sign}${fmt(s.diff)}</div>
        <div class="trend-detail">Total: ${fmt(s.total)}</div>
      </div>`;
    });
    html += '</div></div>';
  }

  // Table
  html += `<div class="section-title"><span class="icon">📋</span> All Services</div>`;
  html += '<div class="table-wrap"><table id="main-table"><thead><tr>';
  html += '<th data-col="name">Service</th>';
  html += '<th data-col="account">Account</th>';
  html += '<th data-col="platform">Platform</th>';
  html += '<th data-col="total">Total</th>';
  html += '<th data-col="trend">Trend</th>';
  allDates.forEach(d => {
    html += `<th data-col="day-${d}">${shortDate(d)}</th>`;
  });
  html += '</tr></thead><tbody>';

  services.forEach(s => {
    const rowCls = s.game ? 'game-row' : 'infra-row';
    const nameCls = s.game ? 'service-name game-label' : 'service-name infra-label';
    const label = s.game ? '🎮 ' : '';
    const plCls = s.platform === 'worker' ? 'platform-worker' : 'platform-pages';

    // Trend: compare last two dates with data
    let trendVal = '';
    const lastDayVal = s.daily[lastDate] || 0;
    const prevDayVal = prevDate ? (s.daily[prevDate] || 0) : null;
    if (prevDayVal !== null && lastDayVal > 0 || prevDayVal > 0) {
      const diff = lastDayVal - prevDayVal;
      if (diff > 0) trendVal = `<span class="trend-up">▲ ${fmt(diff)}</span>`;
      else if (diff < 0) trendVal = `<span class="trend-down">▼ ${fmt(Math.abs(diff))}</span>`;
      else trendVal = `<span class="trend-flat">— 0</span>`;
    } else {
      trendVal = `<span class="trend-flat">—</span>`;
    }

    const shortAccount = s.account.substring(0, 8) + '…';

    html += `<tr class="${rowCls}" data-service="${s.service}" data-total="${s.total}">`;
    html += `<td><span class="${nameCls}">${label}${s.service}</span></td>`;
    html += `<td style="font-family:monospace;font-size:0.7rem;color:var(--text-dim)" title="${s.account}">${shortAccount}</td>`;
    html += `<td><span class="platform-badge ${plCls}">${s.platform}</span></td>`;
    html += `<td class="total-cell">${fmt(s.total)}</td>`;
    html += `<td>${trendVal}</td>`;
    allDates.forEach(d => {
      const val = s.daily[d] || 0;
      if (val === 0) html += `<td class="day-zero">0</td>`;
      else html += `<td>${fmt(val)}</td>`;
    });
    html += '</tr>';
  });

  html += '</tbody></table></div>';

  // Bar Chart
  const chartServices = services.filter(s => s.total > 0);
  html += '<div class="section-title"><span class="icon">📊</span> Requests by Service (ranked)</div>';
  html += '<div class="bar-chart">';
  chartServices.forEach(s => {
    const pct = maxTotal > 0 ? (s.total / maxTotal * 100) : 0;
    const barCls = s.game ? 'game-bar' : 'infra-bar';
    const labelCls = s.game ? 'color:var(--gold)' : 'color:var(--text-dim)';
    html += `<div class="bar-item">
      <div class="bar-label" style="${labelCls}">${s.game ? '🎮 ' : ''}${s.service}</div>
      <div class="bar-track"><div class="bar-fill ${barCls}" style="width:${Math.max(pct, 0.5)}%"></div></div>
      <div class="bar-value">${fmt(s.total)}</div>
    </div>`;
  });
  html += '</div>';

  app.innerHTML = html;

  // Simple column sorting
  let sortCol = null;
  let sortAsc = false;
  document.querySelectorAll('thead th').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortCol === col) { sortAsc = !sortAsc; }
      else { sortCol = col; sortAsc = false; }

      document.querySelectorAll('thead th').forEach(t => t.classList.remove('sorted-asc','sorted-desc'));
      th.classList.add(sortAsc ? 'sorted-asc' : 'sorted-desc');

      const tbody = document.querySelector('#main-table tbody');
      const rows = Array.from(tbody.querySelectorAll('tr'));
      rows.sort((a, b) => {
        let va, vb;
        if (col === 'name') {
          va = a.dataset.service; vb = b.dataset.service;
          return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
        } else if (col === 'account') {
          va = a.children[1].textContent; vb = b.children[1].textContent;
          return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
        } else if (col === 'platform') {
          va = a.children[2].textContent; vb = b.children[2].textContent;
          return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
        } else if (col === 'total') {
          va = parseFloat(a.dataset.total); vb = parseFloat(b.dataset.total);
        } else if (col === 'trend') {
          // parse trend difference
          const parseTrend = (r) => {
            const td = r.children[3]; // after name, account, platform, total
            const trendCell = r.children[4];
            const text = trendCell.textContent.trim();
            const match = text.match(/[▲▼]\s*([\d,]+)/);
            if (!match) return 0;
            const num = parseInt(match[1].replace(/,/g,''));
            return text.includes('▲') ? num : -num;
          };
          va = parseTrend(a); vb = parseTrend(b);
        } else if (col.startsWith('day-')) {
          const dateKey = col.replace('day-', '');
          const dateIdx = allDates.indexOf(dateKey);
          const cellIdx = 5 + dateIdx;
          va = parseInt(a.children[cellIdx]?.textContent.replace(/,/g,'')) || 0;
          vb = parseInt(b.children[cellIdx]?.textContent.replace(/,/g,'')) || 0;
        } else {
          return 0;
        }
        return sortAsc ? va - vb : vb - va;
      });
      rows.forEach(r => tbody.appendChild(r));
    });
  });
}

init();
</script>
</body>
</html>
