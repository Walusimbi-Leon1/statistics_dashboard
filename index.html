            padding: 0;

            font-weight: 800;
            color: #fff;
            letter-spacing: 0.5px;
        }
        header .subtitle {
            color: #7d8b9f;
            font-size: 13px;
            margin-left: auto;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .card {
            background: linear-gradient(145deg, #131c2b, #0d1522);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 20px 22px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #f5c542, #10b981);
            opacity: 0.7;
        }
        .card .icon {
            font-size: 18px;
            margin-bottom: 6px;
        }
        .card .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #8b9ab0;
            font-weight: 600;
        }
        .card .value {
            font-size: 28px;
            font-weight: 800;
            color: #f5c542;
            margin-top: 6px;
            line-height: 1.2;
            word-break: break-word;
        }
        .card .sub {
            font-size: 12px;
            color: #5f6f85;
            margin-top: 5px;
        }

        .panel {
            background: #0e1624;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);

        }
        .table-section {
            margin-bottom: 28px;
            overflow: hidden;
        }
        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 1100px;
        }
        thead th {

            color: #8b9ab0;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            padding: 13px 10px;
            text-align: right;
            white-space: nowrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        thead th:nth-child(1),
        thead th:nth-child(2),
        thead th:nth-child(3) {
            text-align: left;
        }
        thead th.sortable {
            cursor: pointer;
            user-select: none;
        }
        thead th.sortable:hover {
            color: #f5c542;
        }
        tbody td {
            padding: 9px 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            text-align: right;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;

        tbody td:nth-child(1),

        }

            text-align: right;
            font-size: 12px;
            color: #9aa8bc;
            white-space: nowrap;
            overflow: hidden;

        .bar-track {
            flex: 1;
            height: 18px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 9px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #f5c542, #e07b39);
            border-radius: 9px;
            min-width: 2px;
            transition: width 0.4s ease;

            font-size: 12px;
            color: #fff;
            font-weight: 600;
            text-align: right;

            padding: 14px 16px;

        const topService = enriched.reduce((a, b) => (a.total >= b.total ? a : b));
        const gameCount = enriched.filter(isGame).length;
        const infraCount = enriched.length - gameCount;

        document.getElementById('header-subtitle').textContent =
            'Cloudflare request counts · Updated ' + new Date(RAW.updatedAt).toUTCString();
        document.getElementById('updated-at').textContent = RAW.updatedAt;

        if (services.length === 0 || grandTotal === 0) {
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('empty-state').classList.remove('hidden');
        } else {
            renderCards();
            renderTableHeaders();
            let sortedEnriched = [...enriched].sort((a, b) => b.total - a.total);
            let serviceSortAsc = true;
            let totalSortAsc = false;

            function renderTable() {
                const tbody = document.getElementById('tbody');
                tbody.innerHTML = '';
                sortedEnriched.forEach(s => {
                    const tr = document.createElement('tr');
                    tr.className = isGame(s) ? 'row-game' : 'row-infra';

                    const tdService = document.createElement('td');
                    tdService.className = 'service-cell';
                    tdService.textContent = (isGame(s) ? '🎮 ' : '🔧 ') + s.service;
                    tr.appendChild(tdService);

                    const tdAccount = document.createElement('td');
                    tdAccount.className = 'account-cell';
                    tdAccount.textContent = s.account.slice(0, 8) + '…';
                    tdAccount.title = s.account;
                    tr.appendChild(tdAccount);

                    const tdPlatform = document.createElement('td');
                    const badge = document.createElement('span');
                    badge.className = 'badge badge-' + s.platform;
                    badge.textContent = s.platform;
                    tdPlatform.appendChild(badge);
                    tr.appendChild(tdPlatform);

                    dates.forEach(d => {
                        const td = document.createElement('td');
                        const v = s.daily[d] || 0;
                        td.textContent = fmt(v);
                        if (!v) td.className = 'zero';
                        tr.appendChild(td);
                    });

                    const tdTotal = document.createElement('td');
                    tdTotal.className = 'total-cell';
                    tdTotal.textContent = fmt(s.total);
                    tr.appendChild(tdTotal);

                    const tdTrend = document.createElement('td');
                    let trendHtml = '—';
                    if (s.prev !== null && s.last > s.prev) trendHtml = '<span class="trend up">▲</span>';
                    else if (s.prev !== null && s.last < s.prev) trendHtml = '<span class="trend down">▼</span>';
                    else trendHtml = '<span class="trend flat">—</span>';
                    tdTrend.innerHTML = trendHtml;
                    tr.appendChild(tdTrend);

                    tbody.appendChild(tr);
                });
            }

            function renderTableHeaders() {
                const headerRow = document.getElementById('header-row');
                headerRow.innerHTML = '';
                ['Service', 'Account', 'Platform'].forEach(t => {
                    const th = document.createElement('th');
                    th.textContent = t;
                    headerRow.appendChild(th);
                });
                dates.forEach(d => {
                    const th = document.createElement('th');
                    th.textContent = new Date(d + 'T00:00:00Z').toLocaleDateString('en-US', {
                        month: 'short',
                        day: '2-digit',
                        timeZone: 'UTC'
                    });
                    th.title = d;
                    headerRow.appendChild(th);
                });
                const thTotal = document.createElement('th');
                thTotal.textContent = 'Total ⇅';
                thTotal.className = 'sortable';
                thTotal.addEventListener('click', () => {
                    sortedEnriched = [...enriched].sort((a, b) => totalSortAsc ? a.total - b.total : b.total - a.total);
                    totalSortAsc = !totalSortAsc;
                    renderTable();
                });
                headerRow.appendChild(thTotal);

                const thTrend = document.createElement('th');
                thTrend.textContent = 'Trend';
                headerRow.appendChild(thTrend);
            }

            function renderCards() {
                const cardsEl = document.getElementById('cards');
                const cardDefs = [
                    { icon: '📥', label: 'Last Day Requests', value: fmt(lastDayTotal),
                        sub: dates.length ? new Date(dates[dates.length - 1] + 'T00:00:00Z').toLocaleDateString('en-US', {
                            month: 'long',
                            day: 'numeric',
                            year: 'numeric',
                            timeZone: 'UTC'
                        }) : '' },
                    { icon: '📊', label: 'All-Time Requests', value: fmt(grandTotal), sub: 'Across ' + dates.length +
                            ' days' },
                    { icon: '🎮', label: 'Services Tracked', value: String(services.length), sub: gameCount +
                            ' games · ' + infraCount + ' infra' },
                    { icon: '🏆', label: 'Top Service', value: topService.service, sub: fmt(topService.total) +
                            ' total requests' }
                ];
                cardDefs.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = '<div class="icon">' + c.icon + '</div><div class="label">' + c.label +
                        '</div><div class="value">' + c.value + '</div><div class="sub">' + c.sub + '</div>';
                    cardsEl.appendChild(div);
                });
            }

            function renderBars() {
                const barsEl = document.getElementById('bars');
                const nonZero = enriched.filter(s => s.total > 0).sort((a, b) => b.total - a.total);
                const maxTotal = nonZero.length ? nonZero[0].total : 1;
                nonZero.forEach(s => {
                    const row = document.createElement('div');
                    row.className = 'bar-row';
                    const pct = Math.max(2, Math.round((s.total / maxTotal) * 100));
                    row.innerHTML = '<span class="bar-label" title="' + s.service + '">' + s.service +
                        '</span><div class="bar-track"><div class="bar-fill" style="width:' + pct +
                        '%"></div></div><span class="bar-value">' + fmt(s.total) + '</span>';
                    barsEl.appendChild(row);
                });
            }

            function renderTrending() {
                const trendingEl = document.getElementById('trending');
                const trending = enriched.filter(s => s.prev !== null && s.delta !== 0)
                    .sort((a, b) => b.delta - a.delta).slice(0, 3);
                if (trending.length === 0) {
                    trendingEl.innerHTML = '<div style="color:#5f6f85;font-size:13px;text-align:center;padding:20px;">Not enough data for trends</div>';
                    return;
                }
                trending.forEach((s, i) => {
                    const pct = s.prev > 0 ? ((s.delta / s.prev) * 100) : null;
                    const card = document.createElement('div');
                    card.className = 'trend-card';
                    const pctHtml = pct !== null ? '+' + pct.toFixed(1) + '%' : '';
                    const range = fmt(s.prev) + ' → ' + fmt(s.last);
                    card.innerHTML = '<div class="trend-rank">#' + (i + 1) + '</div><div class="trend-name">' + s
                        .service + '</div><div class="trend-delta">▲ ' + fmt(s.delta) +
                        '</div><div class="trend-meta">' + pctHtml + '<br>' + range + '</div>';
                    trendingEl.appendChild(card);
                });
            }

            renderTable();
            renderBars();
            renderTrending();
        }
    </script>
</body>
</html>
