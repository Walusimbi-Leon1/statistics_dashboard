<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Game Statistics Dashboard</title>
    <style>
        :root {
            --bg: #0a0f1e;
            --bg-card: rgba(15, 23, 42, 0.85);
            --border: #1e293b;
            --gold: #fbbf24;
            --gold-dim: rgba(251, 191, 36, 0.07);
            --emerald: #10b981;
            --red: #ef4444;
            --text: #e2e8f0;
            --text-dim: #7c8aa0;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background:
                radial-gradient(ellipse at 20% 0%, rgba(251, 191, 36, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 100%, rgba(16, 185, 129, 0.06) 0%, transparent 60%),
                var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
        }
        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 32px 24px;
        }
        header {
            margin-bottom: 28px;
        }
        header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--gold);
            text-shadow: 0 0 30px rgba(251, 191, 36, 0.2);
        }
        .updated {
            color: var(--text-dim);
            font-size: 0.85rem;
            margin: 6px 0 0;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 40px 0 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
        }
        .legend {
            margin-left: auto;
            font-size: 0.75rem;
            font-weight: 400;
            color: var(--text-dim);
            letter-spacing: 0.02em;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px 22px;
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .stat-label {
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            color: var(--text-dim);
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 1.9rem;
            font-weight: 800;
            color: var(--gold);
            line-height: 1.1;
            word-break: break-word;
        }
        .stat-sub {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-top: 6px;
        }
        .table-wrap {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow-x: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 1050px;
        }
        thead th {
            background: #0f172a;
            color: var(--text-dim);
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.06em;
            padding: 12px 14px;
            text-align: right;
            white-space: nowrap;
            border-bottom: 1px solid var(--border);
        }
        thead th:first-child,
        tbody td:first-child {
            text-align: left;
        }
        tbody td {
            padding: 10px 14px;
            border-bottom: 1px solid rgba(30, 41, 59, 0.7);
            text-align: right;
            white-space: nowrap;
        }
        tbody tr:last-child td {
            border-bottom: none;
        }
        tbody tr:hover {
            background: rgba(148, 163, 184, 0.04);
        }
        .game-row {
            background: var(--gold-dim);
        }
        .game-row:hover {
            background: rgba(251, 191, 36, 0.12);
        }
        .game-row td:first-child {
            color: var(--gold);
            font-weight: 600;
        }
        .infra-row {
            opacity: 0.5;
        }
        .infra-row:hover {
            opacity: 0.75;
        }
        code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.75rem;
            color: #7d8ea6;
        }
        .total-cell {
            font-weight: 700;
            color: var(--text);
        }
        .trend-up {
            color: var(--emerald);
            font-weight: 700;
        }
        .trend-down {
            color: var(--red);
            font-weight: 700;
        }
        .trend-flat {
            color: #64748b;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .bar-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 10px;
        }
        .bar-label {
            width: 220px;
            flex-shrink: 0;
            text-align: right;
            font-size: 0.82rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-dim);
        }
        .bar-label.game-label {
            color: var(--gold);
        }
        .bar-track {
            flex: 1;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 8px;
            height: 22px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: 8px;
            background: linear-gradient(90deg, #d97706, #fbbf24);
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.3);
            min-width: 0;
            transition: width 0.4s ease;
        }
        .bar-fill.infra {
            background: #3e4c63;
            box-shadow: none;
        }
        .bar-value {
            width: 100px;
            flex-shrink: 0;
            font-size: 0.82rem;
            color: var(--text-dim);
            text-align: right;
        }
        .trending-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }
        .trending-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px 22px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .trending-service {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 6px;
            color: var(--text);
        }
        .trending-delta {
            font-size: 1.5rem;
            font-weight: 800;
        }
        .trending-sub {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-top: 4px;
        }
        .growth-up {
            color: var(--emerald);
        }
        .growth-down {
            color: var(--red);
        }
        .growth-flat {
            color: #64748b;
        }
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            font-size: 1.3rem;
            color: var(--text-dim);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            margin: 40px 0;
        }
        footer {
            margin-top: 48px;
            padding: 20px 0;
            border-top: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 0.78rem;
            text-align: center;
        }
        @media (max-width: 640px) {
            .bar-label {
                width: 120px;
                font-size: 0.7rem;
            }
            .bar-value {
                width: 70px;
                font-size: 0.7rem;
            }
            header h1 {
                font-size: 1.5rem;
            }
            .legend {
                display: none;
            }
        }
    </style>
</head>

                title = '−' + fmt(Math.abs(s.diff));
            } else {
                cls = 'trend-flat';
                arrow = '—';
                title = '0';
            }
            return `<span class="${cls}" title="${title} vs previous day">${arrow}</span>`;
        }

        const allDatesSet = new Set();
        services.forEach(s => Object.keys(s.daily || {}).forEach(d => allDatesSet.add(d)));
        const dates = Array.from(allDatesSet).sort();
        const lastDate = dates.length ? dates[dates.length - 1] : null;

        const enriched = services.map(s => {
            const sortedDates = Object.keys(s.daily || {}).filter(d => d && s.daily[d] !== undefined).sort();
            const values = dates.map(d => s.daily[d] || 0);
            const total = values.reduce((a, b) => a + b, 0);
            let diff = null;
            if (sortedDates.length >= 2) {
                const last = sortedDates[sortedDates.length - 1];
                const prev = sortedDates[sortedDates.length - 2];
                diff = (s.daily[last] || 0) - (s.daily[prev] || 0);
            }
            return {
                ...s,
                sortedDates,
                values,
                total,
                diff,
                isGame: isGame(s.service, s.kind)
            };
        });

        const totalAllTime = enriched.reduce((sum, s) => sum + s.total, 0);
        const totalLastDay = lastDate ? enriched.reduce((sum, s) => sum + (s.daily[lastDate] || 0), 0) : 0;
        const sortedByTotal = enriched.slice().sort((a, b) => b.total - a.total);
        const topService = sortedByTotal[0];

        document.getElementById('headerUpdated').textContent = 'Updated ' + (updatedAt ? new Date(updatedAt).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' }) : '—');

        const footer = document.getElementById('footer');
        footer.innerHTML = 'Generated by big-pickle · ' + escapeHtml(updatedAt) + ' · Data: Cloudflare GraphQL Analytics';

        const app = document.getElementById('app');

        if (services.length === 0 || dates.length === 0 || totalAllTime === 0) {
            app.innerHTML = '<div class="empty-state">😴 No data collected yet</div>';
        } else {
            const summaryCards = `
                <div class="summary-grid">
                    <div class="stat-card">
                        <div class="stat-label">📥 Requests · Last Day</div>
                        <div class="stat-value">${fmt(totalLastDay)}</div>
                        <div class="stat-sub">${lastDate ? shortDate(lastDate) : '—'}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">📊 Requests · All Time</div>
                        <div class="stat-value">${fmt(totalAllTime)}</div>
                        <div class="stat-sub">${dates.length} days of data</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">🗂️ Services Tracked</div>
                        <div class="stat-value">${services.length}</div>
                        <div class="stat-sub">${enriched.filter(s => s.isGame).length} games · ${enriched.filter(s => !s.isGame).length} infrastructure</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">🏆 Top Service</div>
                        <div class="stat-value">${topService && topService.total > 0 ? (topService.isGame ? '🎮 ' : '⚙️ ') + escapeHtml(topService.service) : '—'}</div>
                        <div class="stat-sub">${topService && topService.total > 0 ? fmt(topService.total) + ' total requests' : 'No traffic yet'}</div>
                    </div>
                </div>`;

            const table = `
                <div class="section-title">📋 Services Breakdown <span class="legend">🎮 Game · ⚙️ Infrastructure</span></div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Service</th>
                                <th>Account</th>
                                <th>Platform</th>
                                ${dates.map(d => `<th>${shortDate(d)}</th>`).join('')}
                                <th>Total</th>
                                <th>Trend</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${enriched.map(s => `
                                <tr class="${s.isGame ? 'game-row' : 'infra-row'}">
                                    <td>${s.isGame ? '🎮 ' : '⚙️ '}${escapeHtml(s.service)}</td>
                                    <td><code title="${escapeHtml(s.account)}">${escapeHtml(shortAccount(s.account))}</code></td>
                                    <td>${escapeHtml(s.platform)}</td>
                                    ${s.values.map(v => `<td>${v === 0 ? '0' : fmt(v)}</td>`).join('')}
                                    <td class="total-cell">${fmt(s.total)}</td>
                                    <td>${trendCell(s)}</td>
                                </tr>`).join('')}
                        </tbody>
                    </table>
                </div>`;

            const maxTotal = sortedByTotal[0] ? sortedByTotal[0].total : 1;
            const barRows = sortedByTotal.map(s => {
                const pct = s.total > 0 ? Math.max((s.total / maxTotal) * 100, 1) : 0;
                const labelClass = s.isGame ? 'bar-label game-label' : 'bar-label';
                const fillClass = s.isGame ? 'bar-fill' : 'bar-fill infra';
                return `
                    <div class="bar-row">
                        <div class="${labelClass}" title="${escapeHtml(s.service)}">${s.isGame ? '🎮 ' : '⚙️ '}${escapeHtml(s.service)}</div>
                        <div class="bar-track"><div class="${fillClass}" style="width:${pct.toFixed(2)}%"></div></div>
                        <div class="bar-value">${fmt(s.total)}</div>
                    </div>`;
            }).join('');

            const barChart = `
                <div class="section-title">📈 Requests by Service</div>
                <div class="card">${barRows}</div>`;

            const trendingList = enriched
                .filter(s => {
                    if (s.diff === null || s.total === 0) return false;
                    if (s.sortedDates.length < 2) return false;
                    const last = s.sortedDates[s.sortedDates.length - 1];
                    const prev = s.sortedDates[s.sortedDates.length - 2];
                    return (s.daily[last] || 0) > 0 || (s.daily[prev] || 0) > 0;
                })
                .sort((a, b) => b.diff - a.diff)
                .slice(0, 3);

            let trendingHtml;
            if (trendingList.length === 0) {
                trendingHtml = '<div class="section-title">🚀 Trending Now</div><div class="card"><div class="stat-sub">Not enough data for trending.</div></div>';
            } else {
                trendingHtml = `
                    <div class="section-title">🚀 Trending Now</div>
                    <div class="trending-grid">
                        ${trendingList.map(s => {
                            const cls = s.diff > 0 ? 'growth-up' : s.diff < 0 ? 'growth-down' : 'growth-flat';
                            const arrow = s.diff > 0 ? '▲' : s.diff < 0 ? '▼' : '—';
                            const delta = s.diff > 0 ? '+' + fmt(s.diff) : s.diff < 0 ? '−' + fmt(Math.abs(s.diff)) : '0';
                            return `
                                <div class="trending-card">
                                    <div class="trending-service">${s.isGame ? '🎮 ' : '⚙️ '}${escapeHtml(s.service)}</div>
                                    <div class="trending-delta ${cls}">${arrow} ${delta}</div>
                                    <div class="trending-sub">${shortDate(s.sortedDates[s.sortedDates.length - 2])} → ${shortDate(s.sortedDates[s.sortedDates.length - 1])} · ${fmt(s.total)} total</div>
                                </div>`;
                        }).join('')}
                    </div>`;
            }

            app.innerHTML = summaryCards + table + barChart + trendingHtml;
        }
    </script>
</body>
</html>
