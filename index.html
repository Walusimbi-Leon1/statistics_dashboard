    <title>Game Statistics Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b1120;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #e2e8f0;
            padding: 2rem 1.5rem;
            line-height: 1.5;
        }
        .dashboard {
            max-width: 1440px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.8rem;
            color: #fbbf24;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 2.5rem;
        }
        .stat-card {
            background: #1e293b;
            border-radius: 1rem;
            padding: 1.2rem 1.2rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border: 1px solid #334155;
            transition: transform 0.15s ease;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            border-color: #fbbf24;
        }
        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }
        .stat-value {
            font-size: 1.7rem;
            font-weight: 700;
            color: #f1f5f9;
            line-height: 1.2;
        }
        .stat-sub {
            font-size: 0.8rem;
            color: #7c8ba1;
            margin-top: 0.3rem;
        }
        .table-container {
            background: #111c2e;
            border-radius: 1rem;
            border: 1px solid #2a3a52;
            overflow-x: auto;
            margin-bottom: 2.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1100px;
            font-size: 0.85rem;
        }
        th {
            background: #1e2a3f;
            color: #b9c7da;
            font-weight: 600;
            padding: 0.9rem 0.8rem;
            text-align: right;
            white-space: nowrap;
            border-bottom: 2px solid #2f405c;
        }
        th:first-child, td:first-child {
            text-align: left;
            position: sticky;
            left: 0;
            background: #1e2a3f;
            z-index: 2;
        }
        td:first-child {
            background: #152032;
        }
        td {
            padding: 0.7rem 0.8rem;
            border-bottom: 1px solid #1f2d42;
            text-align: right;
            white-space: nowrap;
            color: #cbd5e1;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .service-name {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 500;
            color: #e2e8f0;
        }
        .game-badge {
            background: rgba(251, 191, 36, 0.12);
            color: #fbbf24;
            padding: 0.2rem 0.5rem;
            border-radius: 0.4rem;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }
        .infra-badge {
            background: #2d3b4f;
            color: #7d8b9f;
            padding: 0.2rem 0.5rem;
            border-radius: 0.4rem;
            font-size: 0.7rem;
            font-weight: 500;
            border: 1px solid #3b4a61;
        }
        .trend-up {
            color: #4ade80;
            font-weight: 600;
        }
        .trend-down {
            color: #f87171;
            font-weight: 600;
        }
        .trend-flat {
            color: #94a3b8;
        }
        .bar-chart-section {
            background: #111c2e;
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid #2a3a52;
            margin-bottom: 2.5rem;
        }
        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .bar-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 0.7rem;
        }
        .bar-label {
            width: 160px;
            font-size: 0.8rem;
            color: #b9c7da;
            text-align: right;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .bar-track {
            flex: 1;
            background: #1e2a3f;
            height: 22px;
            border-radius: 12px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            border-radius: 12px;
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(251,191,36,0.3);
        }
        .bar-value {
            width: 100px;
            font-size: 0.8rem;
            color: #e2e8f0;
            font-weight: 500;
        }
        .trending-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 2.5rem;
        }
        .trend-card {
            background: #1e293b;
            border-radius: 1rem;
            padding: 1.2rem;
            border-left: 4px solid #fbbf24;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }
        .trend-card .service {
            font-weight: 600;
            color: #fbbf24;
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .trend-card .growth {
            font-size: 1.3rem;
            font-weight: 700;
            color: #4ade80;
        }
        .trend-card .growth.negative {
            color: #f87171;
        }
        .trend-card .detail {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 0.3rem;
        }
        footer {
            margin-top: 2rem;
            padding-top: 1.2rem;
            border-top: 1px solid #2a3a52;
            color: #64748b;
            font-size: 0.8rem;
            text-align: center;
        }
        .dimmed-row {
            opacity: 0.55;
        }
        .dimmed-row td:first-child {
            background: #1a2334;
        }
        .gold-bg {
            background: rgba(251, 191, 36, 0.05) !important;
        }
        .gold-bg td:first-child {
            background: rgba(251, 191, 36, 0.07) !important;
        }
        .no-data {
            padding: 3rem;
            text-align: center;
            color: #94a3b8;
            font-size: 1.2rem;
        }
        .emoji-icon {
            font-size: 1.2rem;
        }
    </style>

        const prevDate = allDates[allDates.length-2];

        // compute totals per service

            allDates.forEach(d => { total += (s.daily[d] || 0); });
            const lastVal = s.daily[lastDate] || 0;
            const prevVal = s.daily[prevDate] || 0;
            const trend = (lastVal - prevVal);
            return { ...s, total, lastVal, prevVal, trend };
        }).filter(s => s.total > 0 || s.lastVal > 0 || s.prevVal > 0); // keep only services with any activity

        // if no services at all
        if (serviceRows.length === 0) {

            return;

        // summary cards

        const topService = serviceRows.reduce((max, s) => s.total > max.total ? s : max, serviceRows[0]);

        // trending: top 3 by growth (last - prev)
        const trending = [...serviceRows].sort((a,b) => b.trend - a.trend).slice(0,3);

        // build HTML
        let html = '';

        // cards

            <div class="stat-card"><div class="stat-label">📅 Last Day (${lastDate})</div><div class="stat-value">${fmt(totalLastDay)}</div><div class="stat-sub">requests</div></div>
            <div class="stat-card"><div class="stat-label">📊 All Time</div><div class="stat-value">${fmt(totalAllTime)}</div><div class="stat-sub">total requests</div></div>
            <div class="stat-card"><div class="stat-label">🛠️ Services</div><div class="stat-value">${serviceRows.length}</div><div class="stat-sub">tracked</div></div>
            <div class="stat-card"><div class="stat-label">🏆 Top Service</div><div class="stat-value" style="font-size:1.2rem;">${topService.service}</div><div class="stat-sub">${fmt(topService.total)} total</div></div>
        </div>`;

        // table
        html += `<div class="table-container"><table><thead><tr><th>Service</th><th>Account</th><th>Platform</th>`;
        allDates.forEach(d => { html += `<th>${d.slice(5)}</th>`; });
        html += `<th>Total</th><th>Trend</th></tr></thead><tbody>`;

        serviceRows.forEach(s => {

            const rowClass = isGame ? 'gold-bg' : 'dimmed-row';

            html += `<td>${s.platform}</td>`;
            allDates.forEach(d => {
                const val = s.daily[d] || 0;
                html += `<td>${val ? fmt(val) : '—'}</td>`;
            });
            html += `<td style="font-weight:600;">${fmt(s.total)}</td>`;
            let trendHtml = '';
            if (s.prevVal !== undefined && s.lastVal !== undefined) {
                const diff = s.lastVal - s.prevVal;
                if (diff > 0) trendHtml = `<span class="trend-up">▲ ${fmt(diff)}</span>`;
                else if (diff < 0) trendHtml = `<span class="trend-down">▼ ${fmt(Math.abs(diff))}</span>`;
                else trendHtml = `<span class="trend-flat">● 0</span>`;
            } else trendHtml = `<span class="trend-flat">—</span>`;
            html += `<td>${trendHtml}</td>`;
            html += `</tr>`;
        });

        html += `</tbody></table></div>`;

        const sortedForBar = [...serviceRows].sort((a,b) => b.total - a.total).slice(0,10);
