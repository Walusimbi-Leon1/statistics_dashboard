<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Statistics Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a1220;
    --bg2: #0d1b2a;
    --panel: rgba(255,255,255,0.035);
    --border: rgba(255,255,255,0.08);
    --text: #e6edf3;
    --muted: #8b98ab;
    --gold: #f5c518;
    --emerald: #10b981;
    --red: #f87171;
    --purple: #a78bfa;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 800px at 80% -10%, #123a33 0%, #0b1f2e 35%, #071120 70%, #050a14 100%);
    color: var(--text);
    min-height: 100vh;
    padding: 28px 24px;
    line-height: 1.45;
  }
  .container { max-width: 1440px; margin: 0 auto; }

  .header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .header h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #fff 20%, var(--gold) 80%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .updated {
    font-size: 13px;
    color: var(--muted);
    background: rgba(245,197,24,0.08);
    border: 1px solid rgba(245,197,24,0.2);
    border-radius: 999px;
    padding: 6px 14px;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold), var(--emerald));
  }
  .card-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .card-value {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #fff;
  }
  .card-value.gold { color: var(--gold); }
  .card-value.green { color: var(--emerald); }
  .card-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 28px;
  }
  .panel h2 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .grid-2 { grid-template-columns: 1fr; }
  }

  .table-wrap {
    overflow-x: auto;
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 1200px;
  }
  thead th {
    background: rgba(0,0,0,0.25);
    padding: 10px 10px;
    text-align: right;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    position: sticky;
    top: 0;
    z-index: 2;
  }
  thead th:first-child,
  thead th:nth-child(2),
  thead th:nth-child(3) { text-align: left; }
  tbody td {
    padding: 9px 10px;
    text-align: right;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  tbody td:first-child,
  tbody td:nth-child(2),
  tbody td:nth-child(3) { text-align: left; }
  tbody tr:hover { background: rgba(255,255,255,0.04); }
  tbody tr.game { background: rgba(245,197,24,0.05); }
  tbody tr.game td:first-child { border-left: 3px solid var(--gold); }
  tbody tr.infra { opacity: 0.6; }
  .service-name { font-weight: 600; }
  .account {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--muted);
  }
  .platform {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .platform.worker { background: rgba(16,185,129,0.12); color: var(--emerald); }
  .platform.pages { background: rgba(167,139,250,0.15); color: var(--purple); }
  td.total { font-weight: 700; color: #fff; }
  .na { color: #4a5568; }
  .up { color: var(--emerald); font-weight: 600; }
  .down { color: var(--red); font-weight: 600; }
  .flat { color: var(--muted); font-weight: 600; }
  .muted { color: #4a5568; }

  .legend {
    display: flex;
    gap: 20px;
    margin-top: 14px;
    font-size: 12px;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }

  .bar-chart { display: flex; flex-direction: column; gap: 8px; }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .bar-label {
    flex: 0 0 180px;
    text-align: right;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bar-track {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border-radius: 8px;
    height: 20px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 8px;
    background: linear-gradient(90deg, var(--emerald), var(--gold));
    transition: width 0.3s ease;
  }
  .bar-fill.infra-fill {
    background: linear-gradient(90deg, #334155, #475569);
  }
  .bar-value {
    flex: 0 0 90px;
    font-size: 13px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  .trending-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
  }
  .trend-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
  }
  .trend-card .trend-name {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .trend-card .trend-delta {
    font-size: 28px;
    font-weight: 800;
  }
  .trend-card .trend-delta.up { color: var(--emerald); }
  .trend-card .trend-delta.down { color: var(--red); }
  .trend-card .trend-meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }

  .footer {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    padding: 24px 0 8px;
    border-top: 1px solid var(--border);
    margin-top: 12px;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    font-size: 18px;
    color: var(--muted);
  }
  .empty .big { font-size: 48px; display: block; margin-bottom: 12px; }
</style>
</head>

  function fmtDate(iso) {
    var d = new Date(iso + 'T00:00:00Z');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
  }

  function fmtUpdated(iso) {
    var d = new Date(iso);
    return d.toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'UTC' }) + ' UTC';
  }

  var gamePattern = /trivia|bible|quran|dice|bluff|snake|pop|casino|voice|youtrivia|rumble|brick|arrow|blast/i;
  function isGame(name) {
    return gamePattern.test(name);
  }

  // Union of all dates
  var allDatesSet = {};
  services.forEach(function (s) {
    Object.keys(s.daily).forEach(function (d) { allDatesSet[d] = true; });
  });
  var allDates = Object.keys(allDatesSet).sort();

  if (allDates.length === 0) {
    document.querySelector('.container').innerHTML = '<div class="empty"><span class="big">😴</span>No data collected yet</div>';
    return;
  }

  // Enrich services
  var stats = services.map(function (s) {
    var keys = Object.keys(s.daily).sort();
    var total = keys.reduce(function (sum, k) { return sum + (Number(s.daily[k]) || 0); }, 0);
    var lastKey = keys[keys.length - 1];
    var prevKey = keys[keys.length - 2];
    var last = lastKey ? (Number(s.daily[lastKey]) || 0) : 0;
    var prev = prevKey ? (Number(s.daily[prevKey]) || 0) : null;
    var delta = prev !== null ? last - prev : null;
    return { service: s.service, account: s.account, platform: s.platform, kind: s.kind, daily: s.daily, total: total, last: last, prev: prev, delta: delta, lastKey: lastKey, prevKey: prevKey };
  });

  // Stat cards
  var latestDate = allDates[allDates.length - 1];
  var lastDayTotal = stats.reduce(function (sum, s) { return sum + (Number(s.daily[latestDate]) || 0); }, 0);
  var allTimeTotal = stats.reduce(function (sum, s) { return sum + s.total; }, 0);
  var topService = stats.slice().sort(function (a, b) { return b.total - a.total; })[0];

  document.getElementById('updatedAt').textContent = fmtUpdated(updatedAt);
  document.getElementById('footerUpdated').textContent = fmtUpdated(updatedAt);

  var cardsHTML =
    '<div class="card"><div class="card-label">Requests · Last Day</div><div class="card-value green">' + fmt(lastDayTotal) + '</div><div class="card-sub">' + fmtDate(latestDate) + '</div></div>' +
    '<div class="card"><div class="card-label">Requests · All Time</div><div class="card-value gold">' + fmt(allTimeTotal) + '</div><div class="card-sub">' + allDates.length + ' days tracked</div></div>' +
    '<div class="card"><div class="card-label">Services Tracked</div><div class="card-value">' + fmt(services.length) + '</div><div class="card-sub">' + stats.filter(function (s) { return s.total > 0; }).length + ' with traffic</div></div>' +
    '<div class="card"><div class="card-label">Top Service</div><div class="card-value" style="font-size:22px;">' + (isGame(topService.service) ? '🎮 ' : '🔧 ') + topService.service + '</div><div class="card-sub">' + fmt(topService.total) + ' total requests</div></div>';
  document.getElementById('statCards').innerHTML = cardsHTML;

  // Table
  var thead = document.getElementById('tableHead');
  var headRow = document.createElement('tr');
  headRow.innerHTML = '<th>Service</th><th>Account</th><th>Platform</th>' +
    allDates.map(function (d) { return '<th>' + fmtDate(d) + '</th>'; }).join('') +
    '<th>Total</th><th>Trend</th>';
  thead.appendChild(headRow);

  function deltaHtml(delta) {
    if (delta === null) return '<span class="muted">—</span>';
    if (delta > 0) return '<span class="up">▲ ' + fmt(delta) + '</span>';
    if (delta < 0) return '<span class="down">▼ ' + fmt(Math.abs(delta)) + '</span>';
    return '<span class="flat">◆ 0</span>';
  }

  var tbody = document.getElementById('tableBody');
  var frag = document.createDocumentFragment();

  stats.forEach(function (s) {
    var tr = document.createElement('tr');
    tr.className = isGame(s.service) ? 'game' : 'infra';
    var accountShort = s.account.slice(0, 8) + '…';
    var dailyCells = allDates.map(function (d) {
      var v = s.daily[d];
      return v !== undefined ? '<td>' + fmt(v) + '</td>' : '<td class="na">–</td>';
    }).join('');
    tr.innerHTML = '<td class="service-name">' + (isGame(s.service) ? '🎮 ' : '🔧 ') + s.service + '</td>' +
      '<td class="account" title="' + s.account + '">' + accountShort + '</td>' +
      '<td><span class="platform ' + s.platform + '">' + s.platform + '</span></td>' +
      dailyCells +
      '<td class="total">' + fmt(s.total) + '</td>' +
      '<td>' + deltaHtml(s.delta) + '</td>';
    frag.appendChild(tr);
  });
  tbody.appendChild(frag);

  // Bar chart
  var chartData = stats.filter(function (s) { return s.total > 0; }).sort(function (a, b) { return b.total - a.total; });
  var maxTotal = chartData.length ? chartData[0].total : 1;
  var chartEl = document.getElementById('barChart');

  if (chartData.length === 0) {
    chartEl.innerHTML = '<div class="empty">No requests recorded</div>';
  } else {
    chartData.forEach(function (s) {
      var row = document.createElement('div');
      row.className = 'bar-row';
      var width = Math.max((s.total / maxTotal) * 100, 0.5);
      var game = isGame(s.service);
      var label = (game ? '🎮 ' : '🔧 ') + s.service + (s.platform === 'pages' ? ' <span style="color:var(--muted);font-size:11px;">(pages)</span>' : '');
      row.innerHTML = '<div class="bar-label" title="' + s.service + '">' + label + '</div>' +
        '<div class="bar-track"><div class="bar-fill ' + (game ? '' : 'infra-fill') + '" style="width:' + width + '%"></div></div>' +
        '<div class="bar-value">' + fmt(s.total) + '</div>';
      chartEl.appendChild(row);
    });
  }

  // Trending
  var trending = stats.filter(function (s) {
    return s.total > 0 && s.delta !== null && s.last >= 100;
  }).sort(function (a, b) { return b.delta - a.delta; }).slice(0, 3);

  var trendingEl = document.getElementById('trending');
  if (trending.length === 0) {
    trendingEl.innerHTML = '<div class="empty">Not enough data yet</div>';
  } else {
    trending.forEach(function (s) {
      var card = document.createElement('div');
      card.className = 'trend-card';
      var arrow = s.delta >= 0 ? '▲' : '▼';
      var cls = s.delta >= 0 ? 'up' : 'down';
      card.innerHTML = '<div class="trend-name">' + (isGame(s.service) ? '🎮 ' : '🔧 ') + s.service + '</div>' +
        '<div class="trend-delta ' + cls + '">' + arrow + ' ' + fmt(Math.abs(s.delta)) + '</div>' +
        '<div class="trend-meta">' + fmt(s.prev) + ' → ' + fmt(s.last) + '</div>';
      trendingEl.appendChild(card);
    });
  }
})();
</script>
</body>
</html>
