        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #0a0f1e 0%, #0d1527 50%, #0a1a1a 100%);
            color: #e0e7ff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            line-height: 1.5;
        }
        .container {
            max-width: 1440px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid #fbbf24;
            padding-bottom: 1rem;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }
        .header .emoji {
            font-size: 2.5rem;
        }
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2.5rem;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(251, 191, 36, 0.15);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            transition: transform 0.2s, border-color 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(251, 191, 36, 0.4);
        }
        .stat-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }
        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fbbf24;
        }
        .stat-sub {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.25rem;
        }
        .table-wrapper {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow-x: auto;
            margin-bottom: 2.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 1200px;
        }
        thead {
            background: rgba(251, 191, 36, 0.08);
        }
        th {
            padding: 0.9rem 1rem;
            text-align: right;
            font-weight: 600;
            color: #fbbf24;
            border-bottom: 2px solid rgba(251, 191, 36, 0.2);
            white-space: nowrap;
            position: sticky;
            top: 0;
            background: #0d1527;
        }
        th:first-child, th:nth-child(2), th:nth-child(3) {
            text-align: left;
        }
        td {
            padding: 0.7rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            text-align: right;
            white-space: nowrap;
        }
        td:first-child, td:nth-child(2), td:nth-child(3) {
            text-align: left;
        }
        tbody tr {
            transition: background 0.15s;
        }
        tbody tr:hover {
            background: rgba(251, 191, 36, 0.04);
        }
        .service-name {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
        }
        .service-name .emoji {
            font-size: 1rem;
        }
        .game-row {
            background: rgba(251, 191, 36, 0.04);
        }
        .game-row:hover {
            background: rgba(251, 191, 36, 0.08);
        }
        .infra-row {
            opacity: 0.5;
        }
        .infra-row:hover {
            opacity: 0.8;
        }
        .trend-up {
            color: #10b981;
            font-weight: 600;
        }
        .trend-down {
            color: #ef4444;
            font-weight: 600;
        }
        .trend-flat {
            color: #64748b;
        }
        .total-cell {
            font-weight: 700;
            color: #fbbf24;
        }
        .bar-chart-section {
            margin-bottom: 2.5rem;
        }
        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #fbbf24;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .bar-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .bar-label {
            min-width: 180px;
            text-align: right;
            font-size: 0.8rem;
            color: #94a3b8;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .bar-track {
            flex: 1;
            height: 24px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            border-radius: 12px;
            transition: width 0.5s ease;
            min-width: 2px;
        }
        .bar-value {
            min-width: 80px;
            font-size: 0.8rem;
            color: #e0e7ff;
            text-align: left;
        }
        .trending-section {
            margin-bottom: 2.5rem;
        }
        .trending-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.25rem;
        }
        .trend-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(251, 191, 36, 0.15);
            border-radius: 16px;
            padding: 1.5rem;
            transition: transform 0.2s;
        }
        .trend-card:hover {
            transform: translateY(-3px);
        }
        .trend-card .service {
            font-size: 1rem;
            font-weight: 600;
            color: #fbbf24;
            margin-bottom: 0.5rem;
        }
        .trend-card .change {
            font-size: 1.5rem;
            font-weight: 700;
        }
        .trend-card .change.positive {
            color: #10b981;
        }
        .trend-card .change.negative {
            color: #ef4444;
        }
        .trend-card .detail {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 0.5rem;
        }
        .footer {
            text-align: center;
            padding: 2rem 0 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: #64748b;
            font-size: 0.8rem;
        }
        .footer span {
            color: #fbbf24;
        }
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            font-size: 1.2rem;
            color: #94a3b8;
        }
        .empty-state .emoji {
            font-size: 3rem;
            display: block;
            margin-bottom: 1rem;
        }
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            .header h1 {
                font-size: 1.5rem;
            }
            .stat-value {
                font-size: 1.4rem;
            }
            .bar-label {
                min-width: 120px;
            }
        }
    </style>
