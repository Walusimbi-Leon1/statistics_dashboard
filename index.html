<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Statistics Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0b1a2a 0%, #0d1f2d 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #e0e7f0;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .dashboard {
            max-width: 1400px;
            width: 100%;
            background: rgba(10, 25, 35, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 2rem;
            padding: 2rem 2rem 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 215, 0, 0.08);
            border: 1px solid #2a3f4e;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #f5e7c6;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.2);
            margin-bottom: 1.8rem;
            border-bottom: 1px solid #2e4a5a;
            padding-bottom: 1rem;
        }

        h1 .emoji {
            font-size: 2.5rem;
            filter: drop-shadow(0 0 8px #f0b429);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: #10232e;
            border-radius: 1.2rem;
            padding: 1.2rem 1rem;
            border-left: 4px solid #f0b429;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-3px);
        }

        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8fa8b8;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.9rem;
            font-weight: 700;
            color: #f5e7c6;
            line-height: 1.2;
        }

        .stat-sub {
            font-size: 0.8rem;
            color: #6f8a9a;
            margin-top: 0.3rem;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 1.2rem;
            background: #0d1e29;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4);
            margin-bottom: 2.5rem;
            border: 1px solid #1f3644;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
            font-size: 0.85rem;
        }

        th {
            background: #132a38;
            color: #c9dbe8;
            font-weight: 600;
            padding: 0.9rem 0.8rem;
            text-align: right;
            white-space: nowrap;
            border-bottom: 2px solid #2a4a5a;
            position: sticky;
            top: 0;
        }

        th:first-child {
            text-align: left;
            padding-left: 1.2rem;
        }

        td {
            padding: 0.7rem 0.8rem;
            text-align: right;
            border-bottom: 1px solid #1a2f3c;
            white-space: nowrap;
            color: #c5d5e0;
        }

        td:first-child {
            text-align: left;
            font-weight: 500;
            padding-left: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .service-name {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .game-tag {
            background: #2a3f2a;
            color: #f0b429;
            font-size: 0.7rem;
            padding: 0.1rem 0.5rem;
            border-radius: 1rem;
            border: 1px solid #f0b42940;
            font-weight: 500;
        }

        .infra-tag {
            background: #1e2e38;
            color: #6f8a9a;
            font-size: 0.7rem;
            padding: 0.1rem 0.5rem;
            border-radius: 1rem;
            border: 1px solid #3a4f5a;
        }

        .game-row {
            background: rgba(240, 180, 40, 0.04);
            border-left: 3px solid #f0b429;
        }

        .infra-row {
            opacity: 0.65;
            background: transparent;
        }

        .trend-up {
            color: #4cd964;
            font-weight: 600;
        }

        .trend-down {
            color: #ff6b6b;
            font-weight: 600;
        }

        .trend-flat {
            color: #8fa8b8;
        }

        .total-cell {
            font-weight: 700;
            color: #f5e7c6;
            background: #132a38;
        }

        .bar-chart-section {
            background: #0d1e29;
            border-radius: 1.2rem;
            padding: 1.5rem;
            margin-bottom: 2.5rem;
            border: 1px solid #1f3644;
        }

        .bar-chart-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #f5e7c6;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .bar-row {
            display: flex;
            align-items: center;
            margin-bottom: 0.6rem;
            gap: 0.8rem;
        }

        .bar-label {
            width: 180px;
            text-align: right;
            font-size: 0.8rem;
            color: #a0b8c8;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bar-track {
            flex: 1;
            height: 24px;
            background: #1a2f3c;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #f0b429, #f7d774);
            border-radius: 1rem;
            min-width: 2px;
            box-shadow: 0 0 10px rgba(240, 180, 40, 0.3);
        }

        .bar-value {
            width: 100px;
            text-align: left;
            font-size: 0.8rem;
            color: #e0e7f0;
            font-weight: 500;
        }

        .trending-section {
            background: #0d1e29;
            border-radius: 1.2rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid #1f3644;
        }

        .trending-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #f5e7c6;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .trending-list {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .trending-item {
            background: #132a38;
            border-radius: 1rem;
            padding: 0.8rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1 1 200px;
            border-left: 4px solid #f0b429;
        }

        .trending-rank {
            font-size: 1.5rem;
            font-weight: 800;
            color: #f0b429;
        }

        .trending-service {
            font-weight: 600;
            color: #e0e7f0;
        }

        .trending-growth {
            margin-left: auto;
            font-weight: 700;
            color: #4cd964;
        }

        .footer {
            text-align: center;
            color: #6f8a9a;
            font-size: 0.8rem;
            padding-top: 1rem;
            border-top: 1px solid #1f3644;
            margin-top: 0.5rem;
        }

        .no-data {
            text-align: center;
            padding: 3rem;
            color: #8fa8b8;
            font-size: 1.2rem;
        }

        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }
            .dashboard {
                padding: 1rem;
            }
            .bar-label {
                width: 100px;
            }
            .bar-value {
                width: 70px;
            }
        }
    </style>
</head>

    (function() {
        const raw = JSON.parse(document.getElementById('rawData').textContent);
        const services = raw.services || [];
        const updatedAt = raw.updatedAt || '';

        // helper: format number
        const fmt = (num) => Number(num).toLocaleString('en-US');

        // determine if service is a game
        const gameKeywords = ['trivia', 'bible', 'quran', 'dice', 'bluff', 'snake', 'pop', 'casino', 'voice', 'youtrivia', 'stickman', 'arrow', 'brick', 'memory', 'balloon', 'rumble', 'game'];
        function isGame(service) {
            const name = service.service.toLowerCase();
            const kind = (service.kind || '').toLowerCase();
            if (kind.includes('game')) return true;
            return gameKeywords.some(k => name.includes(k));
        }

        // collect all dates from all services, sorted
        const dateSet = new Set();
        services.forEach(s => {
            Object.keys(s.daily || {}).forEach(d => dateSet.add(d));
        });
        const allDates = Array.from(dateSet).sort();

        // compute totals per service
        const serviceStats = services.map(s => {
            let total = 0;
            const daily = s.daily || {};
            allDates.forEach(d => {
                total += (daily[d] || 0);
            });
            return { ...s, total };
        });

        // filter out services with zero total? keep all but show dimmed
        // but for table we show all, but bar chart only top 10 by total
        const nonZeroServices = serviceStats.filter(s => s.total > 0);
        const hasData = nonZeroServices.length > 0;

        // summary cards
        const lastDate = allDates.length ? allDates[allDates.length - 1] : null;
        const prevDate = allDates.length > 1 ? allDates[allDates.length - 2] : null;

        let lastDayTotal = 0;
        let allTimeTotal = 0;
        serviceStats.forEach(s => {
            if (lastDate) lastDayTotal += (s.daily[lastDate] || 0);
            allTimeTotal += s.total;
        });

        const topService = serviceStats.reduce((a, b) => a.total > b.total ? a : b, { total: 0, service: '—' });

        const summaryHtml = `
            <div class="stat-card"><div class="stat-label">📅 Last Day (${lastDate || '—'})</div><div class="stat-value">${fmt(lastDayTotal)}</div><div class="stat-sub">requests</div></div>
            <div class="stat-card"><div class="stat-label">📊 All Time</div><div class="stat-value">${fmt(allTimeTotal)}</div><div class="stat-sub">total requests</div></div>
            <div class="stat-card"><div class="stat-label">🛠️ Services</div><div class="stat-value">${services.length}</div><div class="stat-sub">tracked</div></div>
            <div class="stat-card"><div class="stat-label">🏆 Top Service</div><div class="stat-value" style="font-size:1.2rem;">${topService.service}</div><div class="stat-sub">${fmt(topService.total)} total</div></div>
        `;
        document.getElementById('summaryCards').innerHTML = summaryHtml;

        // table
        if (!hasData) {
            document.getElementById('tableContainer').innerHTML = '<div class="no-data">📭 No data collected yet</div>';
        } else {
            // build header
            let header = `<tr><th>Service</th><th>Account</th><th>Platform</th>`;
            allDates.forEach(d => {
                header += `<th>${d.slice(5)}</th>`;
            });
            header += `<th>Total</th><th>Trend</th></tr>`;

            let rows = '';
            serviceStats.forEach(s => {
                const isGameService = isGame(s);
                const rowClass = isGameService ? 'game-row' : 'infra-row';
                const tag = isGameService ? '<span class="game-tag">🎮 game</span>' : '<span class="infra-tag">⚙️ infra</span>';
                const accountShort = s.account.slice(0, 6) + '…';
                let trend = '—';
                if (lastDate && prevDate && s.daily[lastDate] !== undefined && s.daily[prevDate] !== undefined) {
                    const diff = (s.daily[lastDate] || 0) - (s.daily[prevDate] || 0);
                    if (diff > 0) trend = `<span class="trend-up">▲ ${fmt(diff)}</span>`;
                    else if (diff < 0) trend = `<span class="trend-down">▼ ${fmt(Math.abs(diff))}</span>`;
                    else trend = `<span class="trend-flat">▬ 0</span>`;
                }
                let row = `<tr class="${rowClass}"><td><span class="service-name">${s.service} ${tag}</span></td><td>${accountShort}</td><td>${s.platform}</td>`;
                allDates.forEach(d => {
                    const val = s.daily[d] || 0;
                    row += `<td>${fmt(val)}</td>`;
                });
                row += `<td class="total-cell">${fmt(s.total)}</td><td>${trend}</td></tr>`;
                rows += row;
            });

            document.getElementById('tableContainer').innerHTML = `<table><thead>${header}</thead><tbody>${rows}</tbody></table>`;
        }

        // bar chart (top 10 by total)
        const sorted = serviceStats.slice().sort((a, b) => b.total - a.total).slice(0, 10);
        const maxTotal = sorted.length ? sorted[0].total : 1;
        let barHtml = `<div class="bar-chart-title">🏆 Top Services by Total Requests</div>`;
        sorted.forEach(s => {
            const width = Math.max(2, (s.total / maxTotal) * 100);
            const isGameService = isGame(s);
            const label = isGameService ? '🎮 ' + s.service : '⚙️ ' + s.service;
            barHtml += `
                <div class="bar-row">
                    <div class="bar-label">${label}</div>
                    <div class="bar-track"><div class="bar-fill" style="width:${width}%"></div></div>
                    <div class="bar-value">${fmt(s.total)}</div>
                </div>`;
        });
        document.getElementById('barChart').innerHTML = barHtml;

        // trending: biggest growth between last two days with data (for services that have both)
        let trending = [];
        if (lastDate && prevDate) {
            serviceStats.forEach(s => {
                const lastVal = s.daily[lastDate] || 0;
                const prevVal = s.daily[prevDate] || 0;
                if (s.total > 0) {
                    trending.push({ service: s.service, growth: lastVal - prevVal, lastVal, prevVal, isGame: isGame(s) });
                }
            });
            trending.sort((a, b) => b.growth - a.growth);
            trending = trending.slice(0, 3);
        }

        let trendHtml = `<div class="trending-title">📈 Trending (${prevDate || '—'} → ${lastDate || '—'})</div>`;
        if (trending.length === 0) {
            trendHtml += `<div class="no-data" style="padding:1rem;">Not enough data</div>`;
        } else {
            trendHtml += `<div class="trending-list">`;
            trending.forEach((t, i) => {
                const arrow = t.growth >= 0 ? '▲' : '▼';
                const color = t.growth >= 0 ? '#4cd964' : '#ff6b6b';
                const emoji = t.isGame ? '🎮' : '⚙️';
                trendHtml += `
                    <div class="trending-item">
                        <span class="trending-rank">${i + 1}</span>
                        <span class="trending-service">${emoji} ${t.service}</span>
                        <span class="trending-growth" style="color:${color}">${arrow} ${fmt(Math.abs(t.growth))}</span>
                    </div>`;
            });
            trendHtml += `</div>`;
        }
        document.getElementById('trendingSection').innerHTML = trendHtml;

        // footer
        document.getElementById('footer').innerHTML = `Generated by big-pickle · ${updatedAt} · Data: Cloudflare GraphQL Analytics`;
    })();
</script>
</body>
</html>
