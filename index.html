<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 Game Statistics Dashboard</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-body:#080c16;
  --bg-primary:#0c1222;
  --bg-card:#111b2e;
  --bg-card-hover:#162036;
  --bg-table-head:#0f1829;
  --bg-table-row:#0c1424;
  --bg-table-row-alt:#0e172a;
  --accent:#f59e0b;
  --accent-light:#fbbf24;
  --accent-dim:rgba(245,158,11,0.10);
  --accent-border:rgba(245,158,11,0.25);
  --text:#f1f5f9;
  --text-sec:#94a3b8;
  --text-dim:#4b5563;
  --text-muted:#2d3a4f;
  --green:#22c55e;
  --red:#ef4444;
  --border:#1a2744;
  --radius:10px;
  --shadow:0 2px 12px rgba(0,0,0,0.35);
}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg-body);
  background-image:radial-gradient(ellipse at 20% 0%,rgba(245,158,11,0.04) 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(34,197,94,0.03) 0%,transparent 50%);
  color:var(--text);
  min-height:100vh;
  line-height:1.5;
}
.container{max-width:1440px;margin:0 auto;padding:24px 20px 40px}

/* Header */
.header{text-align:center;margin-bottom:32px;padding:32px 0 24px}
.header h1{font-size:2.2rem;font-weight:800;letter-spacing:-0.5px;background:linear-gradient(135deg,var(--accent-light),var(--accent),#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header .sub{color:var(--text-sec);font-size:0.95rem;margin-top:6px}

/* Summary Cards */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:36px}
.stat-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px 22px;position:relative;overflow:hidden;transition:border-color .2s,transform .15s;
}
.stat-card:hover{border-color:var(--accent-border);transform:translateY(-2px)}
.stat-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent),transparent);opacity:0.7;
}
.stat-card .label{font-size:0.8rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-sec);font-weight:600}
.stat-card .value{font-size:1.75rem;font-weight:800;color:var(--text);margin-top:6px}
.stat-card .value.gold{color:var(--accent)}
.stat-card .detail{font-size:0.78rem;color:var(--text-dim);margin-top:4px}

/* Section Titles */
.section-title{
  font-size:1.15rem;font-weight:700;margin-bottom:18px;
  display:flex;align-items:center;gap:10px;color:var(--text);
}
.section-title span{font-size:1.2rem}

/* Trending */
.trending{margin-bottom:36px}
.trending-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.trend-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;display:flex;align-items:center;gap:16px;transition:border-color .2s;
}
.trend-card:hover{border-color:var(--accent-border)}
.trend-rank{
  width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:1.1rem;flex-shrink:0;
}
.trend-rank.r1{background:linear-gradient(135deg,#f59e0b,#d97706);color:#0a0e1a}
.trend-rank.r2{background:linear-gradient(135deg,#94a3b8,#64748b);color:#0a0e1a}
.trend-rank.r3{background:linear-gradient(135deg,#b45309,#78350f);color:#fef3c7}
.trend-info .trend-name{font-weight:700;font-size:0.95rem}
.trend-info .trend-change{font-size:0.85rem;margin-top:2px}
.trend-up{color:var(--green)}
.trend-down{color:var(--red)}
.trend-neutral{color:var(--text-dim)}

/* Bar Chart */
.chart-section{margin-bottom:36px}
.bar-chart{display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;align-items:center;gap:12px}
.bar-label{
  width:160px;flex-shrink:0;text-align:right;font-size:0.8rem;
  font-weight:600;color:var(--text-sec);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;
}
.bar-label.dim{color:var(--text-dim)}
.bar-track{flex:1;height:26px;background:var(--bg-primary);border-radius:4px;overflow:hidden;position:relative}
.bar-fill{
  height:100%;border-radius:4px;transition:width .8s cubic-bezier(.22,1,.36,1);
  display:flex;align-items:center;padding:0 10px;min-width:0;
}
.bar-fill.game{background:linear-gradient(90deg,#b45309,#f59e0b,#fbbf24)}
.bar-fill.infra{background:linear-gradient(90deg,#374151,#4b5563)}
.bar-value{
  font-size:0.75rem;font-weight:700;color:var(--text);white-space:nowrap;
  text-shadow:0 1px 3px rgba(0,0,0,0.6);margin-left:auto;
}
.bar-value-outside{
  font-size:0.75rem;font-weight:700;color:var(--text-sec);white-space:nowrap;
  margin-left:8px;flex-shrink:0;width:80px;
}

/* Table */
.table-section{margin-bottom:36px}
.table-wrapper{
  overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--bg-primary);box-shadow:var(--shadow);
  -webkit-overflow-scrolling:touch;
}
table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:0.82rem}
thead{position:sticky;top:0;z-index:2}
thead th{
  background:var(--bg-table-head);color:var(--text-sec);font-weight:700;
  padding:12px 10px;text-align:right;border-bottom:2px solid var(--border);
  cursor:pointer;user-select:none;transition:color .15s;
  font-size:0.75rem;text-transform:uppercase;letter-spacing:0.5px;
}
thead th:first-child,thead th:nth-child(2),thead th:nth-child(3){text-align:left;padding-left:14px}
thead th:hover{color:var(--accent)}
thead th.sorted{color:var(--accent)}
thead th .sort-arrow{margin-left:4px;font-size:0.65rem}
tbody tr{transition:background .15s}
tbody tr:nth-child(odd){background:var(--bg-table-row)}
tbody tr:nth-child(even){background:var(--bg-table-row-alt)}
tbody tr:hover{background:var(--bg-card-hover)}
tbody td{padding:9px 10px;text-align:right;border-bottom:1px solid rgba(26,39,68,0.5)}
tbody td:first-child{text-align:left;padding-left:14px;font-weight:600;color:var(--text);max-width:200px;overflow:hidden;text-overflow:ellipsis}
tbody td:nth-child(2){text-align:left;padding-left:14px;font-size:0.72rem;color:var(--text-sec);font-family:'SF Mono',Monaco,Consolas,monospace}
tbody td:nth-child(3){text-align:left;padding-left:14px}
tbody td.total-col{font-weight:700;color:var(--accent-light)}
tbody td.trend-col{font-weight:700;font-size:0.8rem}
.trend-cell-up{color:var(--green)}
.trend-cell-down{color:var(--red)}
.trend-cell-flat{color:var(--text-dim)}
.game-row{background:var(--accent-dim) !important}
.game-badge{margin-right:4px;font-size:0.85rem}
.infra-label{font-size:0.7rem;color:var(--text-dim);font-style:italic}
.platform-badge{
  display:inline-block;padding:2px 7px;border-radius:4px;font-size:0.7rem;
  font-weight:700;text-transform:uppercase;letter-spacing:0.5px;
}
.platform-worker{background:rgba(99,102,241,0.15);color:#818cf8;border:1px solid rgba(99,102,241,0.25)}
.platform-pages{background:rgba(34,197,94,0.15);color:#4ade80;border:1px solid rgba(34,197,94,0.25)}
.cell-dim{color:var(--text-muted)}
.cell-zero{color:var(--text-dim)}
.cell-small{color:var(--text-sec)}
.cell-mid{color:#fbbf24}
.cell-large{color:var(--accent);font-weight:700}
.no-data-msg{text-align:center;padding:60px 20px;color:var(--text-sec);font-size:1.1rem}

/* Footer */
.footer{
  text-align:center;padding:24px 0;margin-top:16px;
  border-top:1px solid var(--border);color:var(--text-dim);font-size:0.8rem;
}
.footer a{color:var(--accent);text-decoration:none}

/* Responsive */
@media(max-width:768px){
  .container{padding:16px 12px 32px}
  .header h1{font-size:1.6rem}
  .summary{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{padding:14px 16px}
  .stat-card .value{font-size:1.3rem}
  .bar-label{width:110px;font-size:0.72rem}
  .trending-grid{grid-template-columns:1fr}
}
@media(max-width:480px){
  .summary{grid-template-columns:1fr}
}
</style>
</head>

-12":0,"2026-08-13":0,"2026-08-14":0,"2026-08-15":0,"2026-08-16":0,"2026-08-17":0,"2026-08-18":0,"2026-08-19":0,"2026-08-20":0,"2026-08-21":0}},{"account":"2b4b9a55f950042b9f9bcea76eb24b08","service":"egress-probe","platform":"worker","kind":"worker","daily":{"2026-08-12":0,"2026-08-13":0,"2026-08-14":0,"2026-08-15":0,"2026-08-16":0,"2026-08-17":0,"2026-08-18":0,"2026-08-19":0,"2026-08-20":0,"2026-08-21":0}}]};

function fmt(n){return n==null?'—':n.toLocaleString('en-US')}
function fmtShort(d){const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const p=d.split('-');return m[parseInt(p[1],10)-1]+' '+parseInt(p[2],10)}
function isGame(name){
  const n=name.toLowerCase();
  const kw=['trivia','bible','quran','dice','bluff','snake','pop','casino','voice','youtrivia','rumble','brick','arrow','song','party','arena','balloon','break'];
  return kw.some(k=>n.includes(k));
}
function shortAcct(a){return a.substring(0,8)+'…'}

// Collect all dates
const dateSet=new Set();
RAW.services.forEach(s=>Object.keys(s.daily).forEach(d=>dateSet.add(d)));
const ALL_DATES=[...dateSet].sort();
const LAST_DATE=ALL_DATES[ALL_DATES.length-1];
const PREV_DATE=ALL_DATES.length>1?ALL_DATES[ALL_DATES.length-2]:null;

// Process services
let services=RAW.services.map(s=>{
  const total=Object.values(s.daily).reduce((a,b)=>a+b,0);
  const game=isGame(s.service);
  let growth=null;
  if(PREV_DATE){
    const lv=s.daily[LAST_DATE]||0;
    const pv=s.daily[PREV_DATE]||0;
    growth=lv-pv;
  }
  return {...s,total,game,growth};
});

// Sort by total desc
services.sort((a,b)=>b.total-a.total);

// Check if any data
const hasData=services.some(s=>s.total>0);

// Find top service
const topService=services[0];

// Compute summary stats
const totalLastDay=services.reduce((a,s)=>a+(s.daily[LAST_DATE]||0),0);
const totalAllTime=services.reduce((a,s)=>a+s.total,0);
const numServices=services.length;

// Trending - top 3 by growth
const trending=[...services].filter(s=>s.growth!==null).sort((a,b)=>b.growth-a.growth).slice(0,3);

// Bar chart - top 15 by total
const barData=services.filter(s=>s.total>0).slice(0,15);
const maxTotal=barData.length?barData[0].total:1;

// Current sort state
let sortCol='total';
let sortDir=-1;

function getSortVal(s,col){
  if(col==='service')return s.service;
  if(col==='account')return s.account;
  if(col==='platform')return s.platform;
  if(col==='total')return s.total;
  if(col==='growth')return s.growth||0;
  if(col.startsWith('day:'))return s.daily[col.substring(4)]||0;
  return 0;
}

function sortServices(){
  services.sort((a,b)=>{
    let va=getSortVal(a,sortCol),vb=getSortVal(b,sortCol);
    if(typeof va==='string')return sortDir*va.localeCompare(vb);
    return sortDir*(va-vb);
  });
}

function toggleSort(col){
  if(sortCol===col)sortDir*=-1;
  else{sortCol=col;sortDir=col==='service'?1:-1;}
  renderTable();
}

function cellClass(val){
  if(!val||val===0)return 'cell-zero';
  if(val<100)return 'cell-small';
  if(val<5000)return 'cell-mid';
  return 'cell-large';
}

function render(){
  const app=document.getElementById('app');
  if(!hasData){
    app.innerHTML='<div class="no-data-msg">🎮 No data collected yet</div>';
    return;
  }
  let html='';
  // Summary
  html+=`<section class="summary">
    <div class="stat-card"><div class="label">Last Day Requests (${fmtShort(LAST_DATE)})</div><div class="value gold">${fmt(totalLastDay)}</div><div class="detail">Across all ${numServices} services</div></div>
    <div class="stat-card"><div class="label">All-Time Requests</div><div class="value">${fmt(totalAllTime)}</div><div class="detail">${ALL_DATES.length} days tracked</div></div>
    <div class="stat-card"><div class="label">Services Tracked</div><div class="value">${numServices}</div><div class="detail">${services.filter(s=>s.game).length} games · ${services.filter(s=>!s.game).length} infra</div></div>
    <div class="stat-card"><div class="label">🏆 Top Service (All-Time)</div><div class="value gold" style="font-size:1.1rem">${topService.service}</div><div class="detail">${fmt(topService.total)} total requests</div></div>
  </section>`;

  // Trending
  html+=`<section class="trending"><div class="section-title"><span>📈</span> Trending — Top Growth (${fmtShort(PREV_DATE)} → ${fmtShort(LAST_DATE)})</div><div class="trending-grid">`;
  trending.forEach((t,i)=>{
    const rcls=i===0?'r1':i===1?'r2':'r3';
    const sign=t.growth>0?'+':'';
    const cls=t.growth>0?'trend-up':t.growth<0?'trend-down':'trend-neutral';
    html+=`<div class="trend-card"><div class="trend-rank ${rcls}">${i+1}</div><div class="trend-info"><div class="trend-name">${t.game?'🎮 ':''}${t.service}</div><div class="trend-change ${cls}">${sign}${fmt(t.growth)} requests · ${sign}${((t.growth/((t.daily[PREV_DATE]||1)))*100).toFixed(0)}%</div></div></div>`;
  });
  html+=`</div></section>`;

  // Bar chart
  html+=`<section class="chart-section"><div class="section-title"><span>📊</span> Request Volume — Top ${barData.length}</div><div class="bar-chart">`;
  barData.forEach(s=>{
    const pct=Math.max((s.total/maxTotal)*100,1);
    const cls=s.game?'game':'infra';
    const lblCls=s.game?'':' dim';
    html+=`<div class="bar-row"><div class="bar-label${lblCls}">${s.game?'🎮 ':''}${s.service}</div><div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div><div class="bar-value-outside">${fmt(s.total)}</div></div>`;
  });
  html+=`</div></section>`;

  // Table
  html+=`<section class="table-section"><div class="section-title"><span>📋</span> Detailed Breakdown</div><div class="table-wrapper"><table id="data-table"><thead><tr>`;
  const cols=[
    {key:'service',label:'Service'},
    {key:'account',label:'Account'},
    {key:'platform',label:'Platform'}
  ];
  ALL_DATES.forEach(d=>cols.push({key:'day:'+d,label:fmtShort(d)}));
  cols.push({key:'total',label:'Total'});
  cols.push({key:'growth',label:'Trend'});

  cols.forEach(c=>{
    const isSorted=sortCol===c.key;
    const arrow=isSorted?(sortDir===1?'▲':'▼'):'';
    const cls=isSorted?'sorted':'';
    const align=(c.key==='service'||c.key==='account'||c.key==='platform')?'text-align:left;padding-left:14px':'text-align:right';
    html+=`<th class="${cls}" style="${align}" onclick="toggleSort('${c.key}')">${c.label}${arrow?`<span class="sort-arrow">${arrow}</span>`:''}</th>`;
  });
  html+=`</tr></thead><tbody>`;

  services.forEach(s=>{
    const rowCls=s.game?'game-row':'';
    html+=`<tr class="${rowCls}">`;
    html+=`<td>${s.game?'<span class="game-badge">🎮</span>':''}${s.service}${s.game?'':'<br><span class="infra-label">infrastructure</span>'}</td>`;
    html+=`<td>${shortAcct(s.account)}</td>`;
    html+=`<td><span class="platform-badge platform-${s.platform}">${s.platform}</span></td>`;

    ALL_DATES.forEach(d=>{
      const v=s.daily[d];
      if(v==null){
        html+=`<td class="cell-dim">—</td>`;
      } else {
        html+=`<td class="${cellClass(v)}">${fmt(v)}</td>`;
      }
    });

    html+=`<td class="total-col">${fmt(s.total)}</td>`;

    if(s.growth!==null){
      const sign=s.growth>0?'+':'';
      const cls=s.growth>0?'trend-cell-up':s.growth<0?'trend-cell-down':'trend-cell-flat';
      html+=`<td class="trend-col ${cls}">${s.growth===0?'—':`${sign}${fmt(s.growth)}`}</td>`;
    } else {
      html+=`<td class="trend-col trend-cell-flat">—</td>`;
    }
    html+=`</tr>`;
  });

  html+=`</tbody></table></div></section>`;

  app.innerHTML=html;
  document.getElementById('ft-date').textContent=RAW.updatedAt;
}

render();
</script>
