<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Statistics Dashboard</title>
    <style>
        :root {
            --bg-primary: #0f1923;
            --bg-secondary: #1a2735;
            --bg-tertiary: #243345;
            --accent-gold: #ffd700;
            --accent-emerald: #10b981;
            --accent-navy: #0d47a1;
            --text-primary: #e0e0e0;
            --text-secondary: #90a4ae;
            --text-dimmed: #546e7a;
            --game-bg: rgba(255, 215, 0, 0.08);
            --game-border: rgba(255, 215, 0, 0.3);
            --infrastructure-bg: rgba(144, 164, 174, 0.05);
            --border-color: #2d3748;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #0a1628 50%, #0d2137 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, #ffaa00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
        
        /* Summary Cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .summary-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .summary-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }
        
        .card-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .card-title {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .card-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-gold);
        }
        
        .card-detail {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 5px;
        }
        
        /* Table Section */
        .table-container {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 40px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }
        
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        h2 {
            color: var(--accent-gold);
            font-size: 1.5rem;
        }
        
        .table-controls {
            display: flex;
            gap: 10px;
        }
        
        .table-controls button {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        
        .table-controls button:hover {
            background: rgba(255, 215, 0, 0.1);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }
        
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        
        th {
            background: var(--bg-tertiary);
            color: var(--accent-gold);
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        tr {
            transition: background 0.2s;
        }
        
        tr:hover {
            background: rgba(255, 215, 0, 0.05);
        }
        
        tr.game-service {
            background: var(--game-bg);
            border-left: 3px solid var(--accent-gold);
        }
        
        tr.game-service:hover {
            background: rgba(255, 215, 0, 0.1);
        }
        
        tr.infrastructure {
            color: var(--text-dimmed);
            background: var(--infrastructure-bg);
        }
        
        .service-name {
            font-weight: 600;
            white-space: nowrap;
        }
        
        .game-icon {
            margin-right: 8px;
        }
        
        .trend-up {
            color: var(--accent-emerald);
        }
        
        .trend-down {
            color: #ef4444;
        }
        
        .trend-neutral {
            color: var(--text-secondary);
        }
        
        /* Bar Chart */
        .chart-section {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 40px;
            border: 1px solid var(--border-color);
        }
        
        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 20px;
        }
        
        .bar-item {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .bar-label {
            min-width: 180px;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .bar-container {
            flex: 1;
            background: var(--bg-tertiary);
            border-radius: 4px;
            height: 30px;
            overflow: hidden;
        }
        
        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-navy) 0%, var(--accent-emerald) 100%);
            border-radius: 4px;
            transition: width 1s ease-out;
        }
        
        .bar-value {
            min-width: 80px;
            text-align: right;
            font-weight: 600;
            color: var(--accent-gold);
        }
        
        /* Trending Section */
        .trending-section {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 40px;
            border: 1px solid var(--border-color);
        }
        
        .trending-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .trending-card {
            background: var(--bg-tertiary);
            border-radius: 10px;
            padding: 15px;
            border-left: 4px solid var(--accent-gold);
        }
        
        .trending-rank {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-gold);
            opacity: 0.8;
        }
        
        .trending-service {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 5px 0;
        }
        
        .trending-growth {
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 10px;
        }
        
        .trending-details {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 5px;
        }
        
        /* Footer */
        footer {
            text-align: center;
            padding: 30px 0;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        /* No Data Message */
        .no-data {
            text-align: center;
            padding: 40px;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        
        .no-data h3 {
            color: var(--text-secondary);
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .summary-grid {
                grid-template-columns: 1fr;
            }
            
            .table-container {
                padding: 10px;
            }
            
            .trending-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        // Game service keywords
        const gameKeywords = ['trivia', 'bible', 'quran', 'dice', 'bluff', 'snake', 'pop', 'casino', 'voice', 'youtrivia', 'game', 'party', 'balloon', 'rumble'];
        const infrastructureServices = ['opencode-proxy', 'audiobooks', 'youstream-proxy', 'wstest-probe2', 'repo-task-keeper', 'egress-probe', 'odespace-3', 'tiktok-reels'];
        
        // Helper functions
        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }
        
        function isGameService(service) {
            const serviceName = service.service.toLowerCase();
            // Check if it's in the infrastructure list first
            if (infrastructureServices.some(infra => serviceName.includes(infra))) {
                return false;
            }
            // Check if any game keyword is present in the service name
            return gameKeywords.some(keyword => serviceName.includes(keyword));
        }
        
        // Process data
        function processData() {
            const data = rawData;
            
            if (!data.services || data.services.length === 0) {
                document.getElementById('summary-grid').innerHTML = '<div class="no-data"><h3>No data collected yet</h3><p>Check back later for statistics.</p></div>';
                return;
            }
            
            // Get all unique dates
            const allDates = new Set();
            data.services.forEach(service => {
                Object.keys(service.daily).forEach(date => allDates.add(date));
            });
            
            // Sort dates in descending order (newest last in table)
            const sortedDates = Array.from(allDates).sort().reverse();
            
            // Process services
            const servicesWithStats = data.services.map(service => {
                const dailyValues = Object.values(service.daily);
                const total = dailyValues.reduce((sum, val) => sum + val, 0);
                
                // Get last two dates with data (for trend)
                const datesWithData = Object.entries(service.daily)
                    .filter(([_, val]) => val > 0)
                    .sort(([a], [b]) => b.localeCompare(a));
                
                let trend = null;
                let trendValue = 0;
                
                if (datesWithData.length >= 2) {
                    const [prevDate, prevVal] = datesWithData[1];
                    const [lastDate, lastVal] = datesWithData[0];
                    trendValue = lastVal - prevVal;
                    trend = trendValue > 0 ? 'up' : trendValue < 0 ? 'down' : 'neutral';
                }
                
                // Get the last day value (most recent date with data)
                const lastDay = datesWithData.length > 0 ? datesWithData[0][1] : 0;
                const lastDayDate = datesWithData.length > 0 ? datesWithData[0][0] : null;
                
                return {
                    ...service,
                    total,
                    trend,
                    trendValue,
                    lastDay,
                    lastDayDate,
                    isGame: isGameService(service)
                };
            });
            
            // Sort by total requests descending
            const sortedServices = [...servicesWithStats].sort((a, b) => b.total - a.total);
            
            // Calculate summary stats
            const totalRequestsAllTime = servicesWithStats.reduce((sum, s) => sum + s.total, 0);
            const totalRequestsLastDay = servicesWithStats.reduce((sum, s) => sum + s.lastDay, 0);
            const topService = sortedServices[0];
            
            // Render summary cards
            renderSummaryCards({
                totalRequestsLastDay,
                totalRequestsAllTime,
                totalServices: data.services.length,
                topService
            });
            
            // Render table
            renderTable(sortedServices, sortedDates);
            
            // Render bar chart
            renderBarChart(sortedServices.slice(0, 15)); // Top 15 for chart
            
            // Render trending section
            renderTrending(sortedServices);
            
            // Update timestamp
            document.getElementById('update-time').textContent = new Date(data.updatedAt).toLocaleString();
        }
        
        // Render summary cards
        function renderSummaryCards(stats) {
            const summaryGrid = document.getElementById('summary-grid');
            summaryGrid.innerHTML = `
                <div class="summary-card">
                    <div class="card-icon">📊</div>
                    <div class="card-title">Total Requests (Last Day)</div>
                    <div class="card-value">${formatNumber(stats.totalRequestsLastDay)}</div>
                    <div class="card-detail">Combined requests for all services</div>
                </div>
                <div class="summary-card">
                    <div class="card-icon">📈</div>
                    <div class="card-title">Total Requests (All Time)</div>
                    <div class="card-value">${formatNumber(stats.totalRequestsAllTime)}</div>
                    <div class="card-detail">All requests across date range</div>
                </div>
                <div class="summary-card">
                    <div class="card-icon">⚙️</div>
                    <div class="card-title">Services Tracked</div>
                    <div class="card-value">${stats.totalServices}</div>
                    <div class="card-detail">Active services in monitoring</div>
                </div>
                <div class="summary-card">
                    <div class="card-icon">${stats.topService.isGame ? '🎮' : '🏆'}</div>
                    <div class="card-title">Top Service (All Time)</div>
                    <div class="card-value">${stats.topService.service}</div>
                    <div class="card-detail">${formatNumber(stats.topService.total)} total requests</div>
                </div>
            `;
        }
        
        // Render table
        function renderTable(services, dates) {
            const tableSection = document.getElementById('data-table-section');
            
            // Limit dates to show in table (last 10 days to keep table manageable)
            const displayDates = dates.slice(0, 10);
            
            let tableHTML = `
                <div class="table-container">
                    <div class="table-header">
                        <h2>📋 Service Details</h2>
                        <div class="table-controls">
                            <button onclick="sortTable('service')">Sort by Name</button>
                            <button onclick="sortTable('total')">Sort by Requests</button>
                        </div>
                    </div>
                    <div style="overflow-x: auto;">
                        <table id="services-table">
                            <thead>
                                <tr>
                                    <th>Service</th>
                                    <th>Account</th>
                                    <th>Platform</th>
                                    ${displayDates.map(date => `<th>${date}</th>`).join('')}
                                    <th>Total</th>
                                    <th>Trend</th>
                                </tr>
                            </thead>
                            <tbody>
            `;
            
            services.forEach(service => {
                const rowClass = service.isGame ? 'game-service' : (infrastructureServices.some(infra => service.service.includes(infra)) ? 'infrastructure' : '');
                
                tableHTML += `<tr class="${rowClass}">`;
                tableHTML += `<td class="service-name">${service.isGame ? '<span class="game-icon">🎮</span>' : ''}${service.service}</td>`;
                tableHTML += `<td>${service.account.substring(0, 8)}...</td>`;
                tableHTML += `<td>${service.platform}</td>`;
                
                displayDates.forEach(date => {
                    const value = service.daily[date] || 0;
                    tableHTML += `<td>${value > 0 ? formatNumber(value) : '-'}</td>`;
                });
                
                tableHTML += `<td style="font-weight: 700; color: var(--accent-gold);">${formatNumber(service.total)}</td>`;
                
                // Trend column
                let trendHTML = '';
                if (service.trend === 'up') {
                    trendHTML = `<span class="trend-up">▲ ${formatNumber(Math.abs(service.trendValue))}</span>`;
                } else if (service.trend === 'down') {
                    trendHTML = `<span class="trend-down">▼ ${formatNumber(Math.abs(service.trendValue))}</span>`;
                } else {
                    trendHTML = '<span class="trend-neutral">—</span>';
                }
                tableHTML += `<td>${trendHTML}</td>`;
                
                tableHTML += '</tr>';
            });
            
            tableHTML += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            
            tableSection.innerHTML = tableHTML;
        }
        
        // Render bar chart
        function renderBarChart(services) {
            const chartSection = document.getElementById('chart-section');
            
            if (services.length === 0) {
                chartSection.innerHTML = '';
                return;
            }
            
            const maxRequests = Math.max(...services.map(s => s.total));
            
            let chartHTML = `
                <div class="chart-section">
                    <h2>📊 Top Services by Total Requests</h2>
                    <div class="bar-chart">
            `;
            
            services.forEach(service => {
                const percentage = (service.total / maxRequests) * 100;
                chartHTML += `
                    <div class="bar-item">
                        <div class="bar-label">${service.isGame ? '🎮 ' : ''}${service.service}</div>
                        <div class="bar-container">
                            <div class="bar-fill" style="width: ${percentage}%"></div>
                        </div>
                        <div class="bar-value">${formatNumber(service.total)}</div>
                    </div>
                `;
            });
            
            chartHTML += `
                    </div>
                </div>
            `;
            
            chartSection.innerHTML = chartHTML;
        }
        
        // Render trending section
        function renderTrending(services) {
            const trendingSection = document.getElementById('trending-section');
            
            // Filter services with trend data (at least 2 days with data)
            const servicesWithTrend = services.filter(s => s.trend !== null && s.trendValue !== 0);
            
            // Sort by trend value (biggest growth first)
            const trendingServices = [...servicesWithTrend].sort((a, b) => b.trendValue - a.trendValue).slice(0, 3);
            
            if (trendingServices.length === 0) {
                trendingSection.innerHTML = '';
                return;
            }
            
            let trendingHTML = `
                <div class="trending-section">
                    <h2>🚀 Trending Services</h2>
                    <div class="trending-grid">
            `;
            
            trendingServices.forEach((service, index) => {
                const growth = service.trendValue > 0 ? '+' + formatNumber(service.trendValue) : formatNumber(service.trendValue);
                const growthClass = service.trendValue > 0 ? 'trend-up' : 'trend-down';
                
                trendingHTML += `
                    <div class="trending-card">
                        <div class="trending-rank">#${index + 1}</div>
                        <div class="trending-service">${service.isGame ? '🎮 ' : ''}${service.service}</div>
                        <div class="trending-growth ${growthClass}">${growth} requests</div>
                        <div class="trending-details">
                            Last two days: ${service.lastDayDate || 'N/A'}<br>
                            Previous: ${service.lastDay > 0 ? formatNumber(service.lastDay) : '0'} → ${formatNumber(service.lastDay)}
                        </div>
                    </div>
                `;
            });
            
            trendingHTML += `
                    </div>
                </div>
            `;
            
            trendingSection.innerHTML = trendingHTML;
        }
        
        // Simple sorting function for table
        function sortTable(column) {
            const table = document.getElementById('services-table');
            const rows = Array.from(table.querySelectorAll('tbody tr'));
            
            rows.sort((a, b) => {
                const aIndex = column === 'service' ? 0 : 9; // Total column index
                const aVal = a.cells[aIndex].textContent.replace(/,/g, '');
                const bVal = b.cells[aIndex].textContent.replace(/,/g, '');
                
                if (column === 'service') {
                    return aVal.localeCompare(bVal);
                } else {
                    return parseInt(bVal) - parseInt(aVal);
                }
            });
            
            const tbody = table.querySelector('tbody');
            rows.forEach(row => tbody.appendChild(row));
        }
        
        // Initialize dashboard
        processData();
    </script>
