<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Statistics Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0b1a2e 0%, #10243a 100%);
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            color: #e2e8f0;
            padding: 2rem 1.5rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .dashboard {
            max-width: 1440px;
            width: 100%;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 1.8rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #fbbf24;
            text-shadow: 0 4px 12px rgba(251, 191, 36, 0.15);
            border-bottom: 2px solid rgba(251, 191, 36, 0.25);
            padding-bottom: 0.75rem;
        }

        h1 span {
            font-size: 2.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: rgba(15, 30, 48, 0.8);
            backdrop-filter: blur(4px);
            border: 1px solid #2d4b6e;
            border-radius: 20px;
            padding: 1.5rem 1.2rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: #fbbf24;
        }

        .stat-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #f8fafc;
            line-height: 1.2;
        }

        .stat-value.gold {
            color: #fbbf24;
        }

        .table-container {
            background: rgba(10, 22, 38, 0.7);
            border-radius: 20px;
            border: 1px solid #2d4b6e;
            overflow-x: auto;
            margin-bottom: 2.5rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 1200px;
        }

        th {
            background: #0f1f33;
            color: #fbbf24;
            font-weight: 600;
            padding: 0.9rem 0.8rem;
            text-align: right;
            white-space: nowrap;
            border-bottom: 2px solid #2d4b6e;
            position: sticky;
            top: 0;
        }

        th:first-child, th:nth-child(2), th:nth-child(3) {
            text-align: left;
        }

        td {
            padding: 0.7rem 0.8rem;
            border-bottom: 1px solid #1e3a5a;
            text-align: right;
            white-space: nowrap;
        }

        td:first-child, td:nth-child(2), td:nth-child(3) {
            text-align: left;
        }

        tr:hover {
            background: rgba(251, 191, 36, 0.05);
        }

        .service-name {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 500;
        }

        .game-service {
            background: rgba(251, 191, 36, 0.12);
            border-left: 3px solid #fbbf24;
        }

        .game-service .service-name {
            color: #fde68a;
        }

        .infra-service {
            opacity: 0.55;
            filter: grayscale(0.4);
        }

        .infra-service .service-name::after {
            content: "🛠️";
            font-size: 0.8rem;
            margin-left: 0.2rem;
        }

        .trend-up {
            color: #4ade80;
            font-weight: 600;
        }

        .trend-down {
            color: #f87171;
            font-weight: 600;
        }

        .trend-flat {
            color: #94a3b8;
        }

        .total-cell {
            font-weight: 700;
            color: #fbbf24;
        }

        .chart-section {
            background: rgba(10, 22, 38, 0.7);
            border-radius: 20px;
            border: 1px solid #2d4b6e;
            padding: 1.8rem 1.5rem;
            margin-bottom: 2.5rem;
        }

        .chart-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #fbbf24;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .bar-row {
            display: flex;
            align-items: center;
            margin-bottom: 0.6rem;
            gap: 0.8rem;
        }

        .bar-label {
            width: 180px;
            text-align: right;
            font-size: 0.8rem;
            color: #cbd5e1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .bar-track {
            flex: 1;
            background: #1e3a5a;
            border-radius: 20px;
            height: 22px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            border-radius: 20px;
            min-width: 2px;
            box-shadow: 0 0 8px rgba(251, 191, 36, 0.3);
        }

        .bar-value {
            width: 90px;
            font-size: 0.8rem;
            color: #f8fafc;
            font-weight: 500;
            text-align: left;
        }

        .trending-section {
            background: rgba(10, 22, 38, 0.7);
            border-radius: 20px;
            border: 1px solid #2d4b6e;
            padding: 1.8rem 1.5rem;
            margin-bottom: 2.5rem;
        }

        .trending-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #fbbf24;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .trending-list {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
        }

        .trending-item {
            background: #0f1f33;
            border-radius: 16px;
            padding: 1rem 1.5rem;
            border: 1px solid #2d4b6e;
            flex: 1;
            min-width: 200px;
        }

        .trending-item .service {
            font-weight: 600;
            color: #fde68a;
            margin-bottom: 0.3rem;
        }

        .trending-item .growth {
            font-size: 1.4rem;
            font-weight: 700;
            color: #4ade80;
        }

        .trending-item .growth.negative {
            color: #f87171;
        }

        .footer {
            text-align: center;
            color: #64748b;
            font-size: 0.8rem;
            padding-top: 1.5rem;
            border-top: 1px solid #1e3a5a;
            margin-top: 1rem;
        }

        .no-data {
            text-align: center;
            padding: 4rem 2rem;
            font-size: 1.2rem;
            color: #94a3b8;
        }

        .emoji-icon {
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            h1 { font-size: 1.6rem; }
            .stat-value { font-size: 1.5rem; }
            .bar-label { width: 100px; }
            .bar-value { width: 70px; }
        }
    </style>
</head>

        // game detection
        const gameKeywords = ['trivia', 'bible', 'quran', 'dice', 'bluff', 'snake', 'pop', 'casino', 'voice', 'youtrivia', 'stickman', 'memory', 'brick', 'arrow', 'balloon', 'rumble', 'game'];
        const isGame = (s) => {
            const name = s.service.toLowerCase();
            return gameKeywords.some(k => name.includes(k));
        };

        // format number
        const fmt = (n) => n.toLocaleString('en-US');

        // trend: compare last two dates with data (for each service)
        const getTrend = (s) => {
            let lastVal = null, prevVal = null;
            for (let i = sortedDates.length - 1; i >= 0; i--) {
                const d = sortedDates[i];
                const v = s.daily[d] || 0;
                if (lastVal === null) {
                    lastVal = v;
                } else {
                    prevVal = v;
                    break;
                }
            }
            if (prevVal === null) return { delta: 0, direction: 'flat' };
            const delta = lastVal - prevVal;
            if (delta > 0) return { delta, direction: 'up' };
            if (delta < 0) return { delta, direction: 'down' };
            return { delta, direction: 'flat' };
        };

        // build table header
        let headerHtml = `<tr><th>Service</th><th>Account</th><th>Platform</th>`;
        sortedDates.forEach(d => {
            const short = d.slice(5); // MM-DD
            headerHtml += `<th>${short}</th>`;
        });
        headerHtml += `<th>Total</th><th>Trend</th></tr>`;

        // build rows
        let rowsHtml = '';
        serviceTotals.forEach(s => {
            const game = isGame(s);
            const rowClass = game ? 'game-service' : 'infra-service';
            const trend = getTrend(s);
            const trendIcon = trend.direction === 'up' ? '▲' : (trend.direction === 'down' ? '▼' : '•');
            const trendClass = trend.direction === 'up' ? 'trend-up' : (trend.direction === 'down' ? 'trend-down' : 'trend-flat');
            const trendText = trend.direction === 'flat' ? '—' : `${trendIcon} ${fmt(Math.abs(trend.delta))}`;

            rowsHtml += `<tr class="${rowClass}">`;
            rowsHtml += `<td><div class="service-name">${game ? '🎮 ' : ''}${s.service}</div></td>`;
            rowsHtml += `<td>${s.account.slice(0, 8)}…</td>`;
            rowsHtml += `<td>${s.platform}</td>`;
            sortedDates.forEach(d => {
                const val = s.daily[d] || 0;
                rowsHtml += `<td>${fmt(val)}</td>`;
            });
            rowsHtml += `<td class="total-cell">${fmt(s.total)}</td>`;
            rowsHtml += `<td class="${trendClass}">${trendText}</td>`;
            rowsHtml += `</tr>`;
        });

        // chart data (top 10 by total)
        const topServices = [...serviceTotals].sort((a,b) => b.total - a.total).slice(0, 10);
        const maxTotal = topServices[0]?.total || 1;
        let chartHtml = '';
        topServices.forEach(s => {
            const width = Math.max(2, (s.total / maxTotal) * 100);
            chartHtml += `
                <div class="bar-row">
                    <div class="bar-label">${s.service}</div>
                    <div class="bar-track"><div class="bar-fill" style="width: ${width}%"></div></div>
                    <div class="bar-value">${fmt(s.total)}</div>
                </div>`;
        });

        // trending: top 3 growth between last two days with data
        const growthList = services.map(s => {
            const last = s.daily[sortedDates[sortedDates.length-1]] || 0;
            const prev = s.daily[sortedDates[sortedDates.length-2]] || 0;
            return { service: s.service, growth: last - prev, last, prev };
        }).sort((a,b) => b.growth - a.growth).slice(0, 3);

        let trendingHtml = '';
        growthList.forEach((g, idx) => {
            const cls = g.growth >= 0 ? 'growth' : 'growth negative';
            const sign = g.growth >= 0 ? '+' : '';
            trendingHtml += `
                <div class="trending-item">
                    <div class="service">${idx+1}. ${g.service}</div>
                    <div class="${cls}">${sign}${fmt(g.growth)}</div>
                    <div style="font-size:0.8rem; color:#94a3b8;">last: ${fmt(g.last)} | prev: ${fmt(g.prev)}</div>
                </div>`;
        });

        // assemble dashboard
        root.innerHTML = `
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-label">Last day requests</div><div class="stat-value gold">${fmt(totalLastDay)}</div></div>
                <div class="stat-card"><div class="stat-label">All-time requests</div><div class="stat-value">${fmt(totalAllTime)}</div></div>
                <div class="stat-card"><div class="stat-label">Services tracked</div><div class="stat-value">${services.length}</div></div>
                <div class="stat-card"><div class="stat-label">Top service</div><div class="stat-value" style="font-size:1.4rem;">${topService.service}</div><div style="color:#fbbf24; font-size:1rem;">${fmt(topService.total)}</div></div>
            </div>

            <div class="table-container">
                <table>
                    <thead>${headerHtml}</thead>
                    <tbody>${rowsHtml}</tbody>
                </table>
            </div>

            <div class="chart-section">
                <div class="chart-title">📊 Top services by total requests</div>
                ${chartHtml}
            </div>

            <div class="trending-section">
                <div class="trending-title">🔥 Trending (biggest growth last day)</div>
                <div class="trending-list">${trendingHtml}</div>
            </div>

            <div class="footer">Generated by big-pickle · ${updatedAt} · Data: Cloudflare GraphQL Analytics</div>
        `;
    })();
</script>
</body>
</html>
