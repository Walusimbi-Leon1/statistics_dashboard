<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Statistics Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #0b1a2e 0%, #10243a 100%);
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      color: #e2e9f2;
      padding: 2rem 1.5rem;
      min-height: 100vh;
    }

    .dashboard {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: #f5e7c6;
      text-shadow: 0 2px 10px rgba(212, 175, 55, 0.2);
    }

    h1 span {
      font-size: 2.5rem;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .stat-card {
      background: rgba(20, 40, 60, 0.7);
      backdrop-filter: blur(4px);
      border: 1px solid #2c4a6b;
      border-radius: 20px;
      padding: 1.2rem 1rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      transition: 0.2s;
    }

    .stat-card:hover {
      border-color: #d4af37;
      transform: translateY(-3px);
    }

    .stat-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #9bb5d4;
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-size: 1.9rem;
      font-weight: 700;
      color: #f5e7c6;
      line-height: 1.2;
    }

    .stat-sub {
      font-size: 0.8rem;
      color: #7f9cbb;
      margin-top: 0.3rem;
    }

    .table-container {
      background: rgba(12, 25, 40, 0.7);
      border-radius: 24px;
      border: 1px solid #2c4a6b;
      overflow-x: auto;
      margin-bottom: 2.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1000px;
      font-size: 0.9rem;
    }

    th {
      background: #1a334d;
      color: #d4af37;
      font-weight: 600;
      padding: 1rem 0.8rem;
      text-align: right;
      white-space: nowrap;
      border-bottom: 2px solid #2c4a6b;
    }

    th:first-child, td:first-child {
      text-align: left;
      position: sticky;
      left: 0;
      background: #0e1f30;
      z-index: 2;
    }

    td {
      padding: 0.8rem 0.8rem;
      border-bottom: 1px solid #1e3a52;
      text-align: right;
      white-space: nowrap;
      color: #cbdae9;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background: rgba(212, 175, 55, 0.05);
    }

    .service-name {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .game-badge {
      background: rgba(212, 175, 55, 0.12);
      border-left: 3px solid #d4af37;
    }

    .game-badge .service-name {
      color: #f5e7c6;
    }

    .infra-row {
      opacity: 0.55;
      filter: grayscale(0.5);
    }

    .infra-row .service-name {
      color: #8ba3c0;
    }

    .trend-up {
      color: #4cd964;
      font-weight: 600;
    }

    .trend-down {
      color: #ff5e5e;
      font-weight: 600;
    }

    .trend-flat {
      color: #a0b8d0;
    }

    .total-cell {
      font-weight: 700;
      color: #f5e7c6;
    }

    .bar-chart-section {
      background: rgba(12, 25, 40, 0.7);
      border-radius: 24px;
      padding: 1.8rem 1.5rem;
      border: 1px solid #2c4a6b;
      margin-bottom: 2.5rem;
      backdrop-filter: blur(4px);
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: #f5e7c6;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .bar-row {
      display: flex;
      align-items: center;
      margin-bottom: 0.8rem;
      gap: 0.8rem;
    }

    .bar-label {
      width: 180px;
      text-align: right;
      font-size: 0.85rem;
      color: #b0c6de;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bar-track {
      flex: 1;
      height: 24px;
      background: #1a2f44;
      border-radius: 30px;
      overflow: hidden;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #d4af37, #f0d78c);
      border-radius: 30px;
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
      min-width: 2px;
      transition: width 0.3s ease;
    }

    .bar-value {
      width: 100px;
      font-size: 0.85rem;
      color: #f5e7c6;
      font-weight: 500;
    }

    .trending-section {
      background: rgba(12, 25, 40, 0.7);
      border-radius: 24px;
      padding: 1.8rem 1.5rem;
      border: 1px solid #2c4a6b;
      margin-bottom: 2rem;
    }

    .trending-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    .trend-item {
      background: #0e2032;
      border-radius: 16px;
      padding: 1rem 1.5rem;
      flex: 1 1 200px;
      border: 1px solid #2c4a6b;
    }

    .trend-item .service {
      font-weight: 600;
      color: #f5e7c6;
      margin-bottom: 0.5rem;
    }

    .trend-item .growth {
      font-size: 1.2rem;
      font-weight: 700;
      color: #4cd964;
    }

    .trend-item .growth.negative {
      color: #ff5e5e;
    }

    .footer {
      text-align: center;
      color: #7f9cbb;
      font-size: 0.85rem;
      margin-top: 2rem;
      border-top: 1px solid #1e3a52;
      padding-top: 1.5rem;
    }

    .emoji-icon {
      font-size: 1.2rem;
    }

    .dim {
      color: #6a86a3;
    }

    .no-data {
      text-align: center;
      padding: 4rem 2rem;
      font-size: 1.2rem;
      color: #a0b8d0;
      background: rgba(12, 25, 40, 0.5);
      border-radius: 24px;
    }
  </style>
</head>

        {"account":"d21711ae11a362bc4d57d4fd48deae61","service":"audiobooks","platform":"worker","kind":"worker","daily":{"2026-08-06":0,"2026-08-07":0,"2026-08-08":0,"2026-08-09":0,"2026-08-10":2,"2026-08-11":0,"2026-08-12":0,"2026-08-13":0,"2026-08-14":0,"2026-08-15":8,"2026-08-16":0,"2026-08-17":0,"2026-08-18":0,"2026-08-19":0,"2026-08-20":0,"2026-08-21":0,"2026-08-22":0,"2026-08-23":0,"2026-08-24":0,"2026-08-25":0,"2026-08-26":0,"2026-08-27":1,"2026-08-28":0,"2026-08-29":0,"2026-08-30":0,"2026-08-31":0},
        {"account":"d21711ae11a362bc4d57d4fd48deae61","service":"oc-whatsapp","platform":"worker","kind":"worker","daily":{"2026-08-27":0,"2026-08-28":0,"2026-08-29":3,"2026-08-30":0,"2026-08-31":0},
        {"account":"d21711ae11a362bc4d57d4fd48deae61","service":"youstream-proxy","platform":"worker","kind":"worker","daily":{"2026-08-06":0,"2026-08-07":0,"2026-08-08":0,"2026-08-09":0,"2026-08-10":0,"2026-08-11":0,"2026-08-12":0,"2026-08-13":0,"2026-08-14":0,"2026-08-15":0,"2026-08-16":0,"2026-08-17":0,"2026-08-18":0,"2026-08-19":0,"2026-08-20":0,"2026-08-21":0,"2026-08-22":0,"2026-08-23":0,"2026-08-24":0,"2026-08-25":0,"2026-08-26":0,"2026-08-27":0,"2026-08-28":0,"2026-08-29":0,"2026-08-30":0,"2026-08-31":0},
        {"account":"d21711ae11a362bc4d57d4fd48deae61","service":"egress-probe","platform":"worker","kind":"worker","daily":{"2026-08-12":0,"2026-08-13":0,"2026-08-14":0,"2026-08-15":0,"2026-08-16":0,"2026-08-17":0,"2026-08-18":0,"2026-08-19":0,"2026-08-20":0,"2026-08-21":0,"2026-08-22":0,"2026-08-23":0,"2026-08-24":0,"2026-08-25":0,"2026-08-26":0,"2026-08-27":0,"2026-08-28":0,"2026-08-29":0,"2026-08-30":0,"2026-08-31":0}
      ]
    };

    const services = rawData.services;
    const updatedAt = rawData.updatedAt;

    // collect all dates
    const dateSet = new Set();
    services.forEach(s => Object.keys(s.daily).forEach(d => dateSet.add(d)));
    const allDates = Array.from(dateSet).sort(); // lexicographic works for YYYY-MM-DD
    const lastDate = allDates[allDates.length - 1];
    const prevDate = allDates[allDates.length - 2];

    // enrich service with total
    const enriched = services.map(s => {
      let total = 0;
      allDates.forEach(d => {
        total += (s.daily[d] || 0);
      });
      return { ...s, total };
    });

    // determine game vs infra
    const gameKeywords = ['trivia', 'bible', 'quran', 'dice', 'bluff', 'snake', 'pop', 'casino', 'voice', 'youtrivia', 'rumble', 'stickman', 'arrow', 'brick', 'memory', 'balloon'];
    function isGameService(s) {
      const name = s.service.toLowerCase();
      return gameKeywords.some(k => name.includes(k));
    }

    // last day total
    const lastDayTotal = enriched.reduce((acc, s) => acc + (s.daily[lastDate] || 0), 0);
    const allTimeTotal = enriched.reduce((acc, s) => acc + s.total, 0);
    const serviceCount = enriched.length;
    const topService = enriched.reduce((a, b) => a.total > b.total ? a : b);

    // trend calculation for each service (last two dates)
    const trendMap = {};
    enriched.forEach(s => {
      const lastVal = s.daily[lastDate] || 0;
      const prevVal = s.daily[prevDate] || 0;
      trendMap[s.service] = { lastVal, prevVal, diff: lastVal - prevVal };
    });

    // build table rows
    const tbodyRows = enriched.map(s => {
      const isGame = isGameService(s);
      const rowClass = isGame ? 'game-badge' : 'infra-row';
      const serviceDisplay = isGame ? `🎮 ${s.service}` : `${s.service} (infra)`;
      const trend = trendMap[s.service];
      let trendHtml = '<span class="trend-flat">—</span>';
      if (prevDate && trend) {
        const diff = trend.diff;
        if (diff > 0) trendHtml = `<span class="trend-up">▲ ${diff.toLocaleString()}</span>`;
        else if (diff < 0) trendHtml = `<span class="trend-down">▼ ${Math.abs(diff).toLocaleString()}</span>`;
        else trendHtml = `<span class="trend-flat">0</span>`;
      }
      let dateCells = '';
      allDates.forEach(d => {
        const val = s.daily[d] || 0;
        dateCells += `<td>${val.toLocaleString()}</td>`;
      });
      return `<tr class="${rowClass}">
        <td><div class="service-name">${serviceDisplay}</div></td>
        <td>${s.account.slice(0,8)}…</td>
        <td>${s.platform}</td>
        ${dateCells}
        <td class="total-cell">${s.total.toLocaleString()}</td>
        <td>${trendHtml}</td>
      </tr>`;
    }).join('');

    // header dates
    let dateHeaders = allDates.map(d => `<th>${d.slice(5)}</th>`).join('');

    // bar chart data (top 8 by total)
    const sortedForBar = [...enriched].sort((a,b) => b.total - a.total).slice(0,8);
    const maxTotal = sortedForBar[0]?.total || 1;
    const barHtml = sortedForBar.map(s => {
      const width = Math.max(2, (s.total / maxTotal) * 100);
      return `<div class="bar-row">
        <div class="bar-label">${s.service}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${width}%"></div></div>
        <div class="bar-value">${s.total.toLocaleString()}</div>
      </div>`;
    }).join('');

    // trending top 3 by growth (diff) between last two days
    const trending = enriched
      .filter(s => trendMap[s.service] && prevDate)
      .map(s => ({ name: s.service, diff: trendMap[s.service].diff }))
      .sort((a,b) => b.diff - a.diff)
      .slice(0,3);

    let trendingHtml = '';
    if (trending.length) {
      trendingHtml = trending.map(t => {
        const cls = t.diff >= 0 ? '' : 'negative';
        return `<div class="trend-item">
          <div class="service">${t.name}</div>
          <div class="growth ${cls}">${t.diff >= 0 ? '+' : ''}${t.diff.toLocaleString()}</div>
        </div>`;
      }).join('');
    } else {
      trendingHtml = '<div class="dim">No trend data</div>';
    }

    // check if any data exists
    const hasData = allTimeTotal > 0;

    if (!hasData) {
      document.getElementById('app').innerHTML = `<div class="no-data">📊 No data collected yet</div>`;
      return;
    }

    const appHtml = `
      <div class="cards-grid">
        <div class="stat-card"><div class="stat-label">Last day (${lastDate})</div><div class="stat-value">${lastDayTotal.toLocaleString()}</div><div class="stat-sub">requests</div></div>
        <div class="stat-card"><div class="stat-label">All time</div><div class="stat-value">${allTimeTotal.toLocaleString()}</div><div class="stat-sub">total requests</div></div>
        <div class="stat-card"><div class="stat-label">Services</div><div class="stat-value">${serviceCount}</div><div class="stat-sub">tracked</div></div>
        <div class="stat-card"><div class="stat-label">Top service</div><div class="stat-value" style="font-size:1.2rem;">${topService.service}</div><div class="stat-sub">${topService.total.toLocaleString()} total</div></div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr><th>Service</th><th>Account</th><th>Platform</th>${dateHeaders}<th>Total</th><th>Trend</th></tr>
          </thead>
          <tbody>${tbodyRows}</tbody>
        </table>
      </div>

      <div class="bar-chart-section">
        <div class="section-title">📊 Top services by total requests</div>
        ${barHtml}
      </div>

      <div class="trending-section">
        <div class="section-title">🔥 Trending (last day vs previous)</div>
        <div class="trending-grid">${trendingHtml}</div>
      </div>

      <div class="footer">Generated by big-pickle · ${updatedAt} · Data: Cloudflare GraphQL Analytics</div>
    `;

    document.getElementById('app').innerHTML = appHtml;
  })();
</script>
