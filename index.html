<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Statistics Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b1a2a;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: #e6edf3;
            padding: 2rem 1.5rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .dashboard {
            max-width: 1440px;
            width: 100%;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 1.8rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: #f5c542;
            text-shadow: 0 2px 8px rgba(245, 197, 66, 0.2);
            border-bottom: 1px solid #2a3f5a;
            padding-bottom: 0.8rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2.5rem;
        }
        .stat-card {
            background: #102433;
            border: 1px solid #2a3f5a;
            border-radius: 16px;
            padding: 1.2rem 1rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.2s ease;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            border-color: #f5c542;
        }
        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8fa3b8;
            margin-bottom: 0.5rem;
        }
        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #f5c542;
            line-height: 1.2;
        }
        .stat-sub {
            font-size: 0.8rem;
            color: #7d8fa3;
            margin-top: 0.3rem;
        }
        .table-wrapper {
            background: #0e1f2e;
            border-radius: 18px;
            border: 1px solid #2a3f5a;
            overflow-x: auto;
            margin-bottom: 2.5rem;
            box-shadow: 0 6px 18px rgba(0,0,0,0.4);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1100px;
            font-size: 0.85rem;
        }
        th {
            background: #1a3042;
            color: #bdd1e2;
            font-weight: 600;
            text-align: right;
            padding: 0.9rem 0.8rem;
            white-space: nowrap;
            border-bottom: 2px solid #f5c542;
            font-size: 0.75rem;
            letter-spacing: 0.3px;
        }
        th:first-child, td:first-child {
            text-align: left;
            position: sticky;
            left: 0;
            background: #0e1f2e;
            z-index: 2;
        }
        td {
            padding: 0.6rem 0.8rem;
            border-bottom: 1px solid #1d3347;
            text-align: right;
            white-space: nowrap;
            color: #d3e1ef;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tbody tr:hover {
            background: #132a3d;
        }
        .service-name {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .game-badge {
            background: #2a3f2a;
            color: #f5c542;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
            border: 1px solid #f5c54255;
        }
        .infra-badge {
            background: #2a3f5a;
            color: #8fa3b8;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            font-size: 0.7rem;
            border: 1px solid #3a5168;
        }
        .game-row {
            background: #1a2e1e;
        }
        .infra-row {
            opacity: 0.55;
            background: #0c1a26;
        }
        .trend-up { color: #4ade80; font-weight: 600; }
        .trend-down { color: #f87171; font-weight: 600; }
        .total-cell {
            font-weight: 700;
            color: #f5c542;
        }
        .chart-section {
            background: #0e1f2e;
            border-radius: 18px;
            padding: 1.8rem 1.5rem;
            border: 1px solid #2a3f5a;
            margin-bottom: 2.5rem;
        }
        .chart-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #f5c542;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .bar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 0.8rem;
        }
        .bar-label {
            width: 180px;
            text-align: right;
            font-size: 0.8rem;
            color: #b0c4d8;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .bar-track {
            flex: 1;
            height: 22px;
            background: #1a3042;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.4);
        }
        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #f5c542, #e0a82e);
            border-radius: 30px;
            min-width: 2px;
            box-shadow: 0 0 8px #f5c54266;
        }
        .bar-value {
            width: 90px;
            font-size: 0.8rem;
            color: #f5c542;
            font-weight: 500;
        }
        .trending-section {
            background: #0e1f2e;
            border-radius: 18px;
            padding: 1.8rem 1.5rem;
            border: 1px solid #2a3f5a;
            margin-bottom: 2rem;
        }
        .trending-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .trend-card {
            background: #102433;
            border-radius: 14px;
            padding: 1rem 1.4rem;
            flex: 1 1 200px;
            border-left: 4px solid #f5c542;
        }
        .trend-service {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.3rem;
            color: #e6edf3;
        }
        .trend-growth {
            font-size: 1.4rem;
            font-weight: 700;
            color: #4ade80;
        }
        .trend-growth.negative {
            color: #f87171;
        }
        .footer {
            text-align: center;
            color: #6b7f93;
            font-size: 0.8rem;
            margin-top: 2rem;
            border-top: 1px solid #1d3347;
            padding-top: 1.5rem;
        }
        .dim {
            color: #6b7f93;
        }
        .emoji {
            font-size: 1.2rem;
        }
        .no-data {
            padding: 3rem;
            text-align: center;
            color: #8fa3b8;
            font-size: 1.2rem;
        }
    </style>
</head>

<script>
    (function() {
        const raw = document.getElementById('data').textContent;
        const data = JSON.parse(raw);
        const services = data.services;
        const updatedAt = data.updatedAt;

        // Helper: is game service?
        function isGameService(svc) {
            const name = svc.service.toLowerCase();
            const gameKeywords = ['trivia', 'bible', 'quran', 'dice', 'bluff', 'snake', 'pop', 'casino', 'voice', 'youtrivia', 'stickman', 'brick', 'memory', 'arrow', 'discord-activity', 'rumble'];
            return gameKeywords.some(k => name.includes(k));
        }

        // Build date list (all unique dates sorted)
        const dateSet = new Set();
        services.forEach(s => Object.keys(s.daily).forEach(d => dateSet.add(d)));
        const allDates = Array.from(dateSet).sort(); // ISO strings sort lexicographically

        // Compute totals per service and overall
        const serviceTotals = services.map(s => {
            let total = 0;
            Object.values(s.daily).forEach(v => total += v);
            return { ...s, total };
        });

        const totalAllTime = serviceTotals.reduce((acc, s) => acc + s.total, 0);
        const lastDate = allDates[allDates.length - 1];
        const totalLastDay = serviceTotals.reduce((acc, s) => acc + (s.daily[lastDate] || 0), 0);
        const topService = serviceTotals.reduce((a, b) => a.total >= b.total ? a : b);

        // Render stat cards
        const statCards = `
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-label">📅 Last day (${lastDate})</div><div class="stat-value">${totalLastDay.toLocaleString()}</div><div class="stat-sub">requests</div></div>
                <div class="stat-card"><div class="stat-label">📊 All time</div><div class="stat-value">${totalAllTime.toLocaleString()}</div><div class="stat-sub">total requests</div></div>
                <div class="stat-card"><div class="stat-label">🛠️ Services</div><div class="stat-value">${services.length}</div><div class="stat-sub">tracked</div></div>
                <div class="stat-card"><div class="stat-label">🏆 Top service</div><div class="stat-value" style="font-size:1.2rem;">${topService.service}</div><div class="stat-sub">${topService.total.toLocaleString()} req</div></div>
            </div>
        `;

        // Build table header
        let headerHtml = `<tr><th>Service</th><th>Account</th><th>Platform</th>`;
        allDates.forEach(d => { headerHtml += `<th>${d.slice(5)}</th>`; });
        headerHtml += `<th>Total</th><th>Trend</th></tr>`;

        // Build rows
        let rowsHtml = '';
        serviceTotals.forEach(s => {
            const isGame = isGameService(s);
            const rowClass = isGame ? 'game-row' : 'infra-row';
            const badge = isGame ? '<span class="game-badge">🎮 game</span>' : '<span class="infra-badge">⚙️ infra</span>';
            const serviceDisplay = isGame ? `🎮 ${s.service}` : `${s.service}`;
            // previous day trend: last two dates with data
            let trend = '';
            const datesWithData = allDates.filter(d => s.daily[d] !== undefined);
            if (datesWithData.length >= 2) {
                const last = datesWithData[datesWithData.length - 1];
                const prev = datesWithData[datesWithData.length - 2];
                const diff = (s.daily[last] || 0) - (s.daily[prev] || 0);
                if (diff > 0) trend = `<span class="trend-up">▲ ${diff.toLocaleString()}</span>`;
                else if (diff < 0) trend = `<span class="trend-down">▼ ${Math.abs(diff).toLocaleString()}</span>`;
                else trend = `<span class="dim">▬ 0</span>`;
            } else {
                trend = '<span class="dim">—</span>';
            }

            let row = `<tr class="${rowClass}">`;
            row += `<td><div class="service-name">${serviceDisplay} ${badge}</div></td>`;
            row += `<td>${s.account.slice(0,8)}…</td>`;
            row += `<td>${s.platform}</td>`;
            allDates.forEach(d => {
                const val = s.daily[d] || 0;
                row += `<td>${val.toLocaleString()}</td>`;
            });
            row += `<td class="total-cell">${s.total.toLocaleString()}</td>`;
            row += `<td>${trend}</td></tr>`;
            rowsHtml += row;
        });

        const tableHtml = `
            <div class="table-wrapper">
                <table>
                    <thead>${headerHtml}</thead>
                    <tbody>${rowsHtml}</tbody>
                </table>
            </div>
        `;

        // Horizontal bar chart (top 10 by total)
        const sortedForChart = [...serviceTotals].sort((a,b) => b.total - a.total).slice(0,10);
        const maxTotal = sortedForChart[0]?.total || 1;
        let chartBars = '';
        sortedForChart.forEach(s => {
            const width = (s.total / maxTotal * 100).toFixed(1);
            chartBars += `
                <div class="bar-item">
                    <div class="bar-label">${s.service}</div>
                    <div class="bar-track"><div class="bar-fill" style="width: ${width}%"></div></div>
                    <div class="bar-value">${s.total.toLocaleString()}</div>
                </div>
            `;
        });
        const chartHtml = `
            <div class="chart-section">
                <div class="chart-title">📊 Top services by total requests</div>
                ${chartBars || '<div class="no-data">No data</div>'}
            </div>
        `;

        // Trending: top 3 growth between last two days with data (per service)
        let trendingItems = [];
        serviceTotals.forEach(s => {
            const datesWithData = allDates.filter(d => s.daily[d] !== undefined);
            if (datesWithData.length >= 2) {
                const last = datesWithData[datesWithData.length - 1];
                const prev = datesWithData[datesWithData.length - 2];
                const diff = (s.daily[last] || 0) - (s.daily[prev] || 0);
                trendingItems.push({ service: s.service, diff, lastVal: s.daily[last] || 0 });
            }
        });
        trendingItems.sort((a,b) => b.diff - a.diff);
        const topTrending = trendingItems.slice(0,3);

        let trendingCards = '';
        if (topTrending.length === 0) {
            trendingCards = '<div class="no-data">No trend data</div>';
        } else {
            topTrending.forEach(t => {
                const cls = t.diff >= 0 ? '' : 'negative';
                const arrow = t.diff >= 0 ? '▲' : '▼';
                trendingCards += `
                    <div class="trend-card">
                        <div class="trend-service">${t.service}</div>
                        <div class="trend-growth ${cls}">${arrow} ${Math.abs(t.diff).toLocaleString()}</div>
                        <div class="dim">last: ${t.lastVal.toLocaleString()}</div>
                    </div>
                `;
            });
        }

        const trendingHtml = `
            <div class="trending-section">
                <div class="chart-title">🚀 Trending (biggest growth vs previous day)</div>
                <div class="trending-cards">${trendingCards}</div>
            </div>
        `;

        // Assemble final content
        const content = `
            ${statCards}
            ${tableHtml}
            ${chartHtml}
            ${trendingHtml}
        `;

        document.getElementById('dashboard-content').innerHTML = content;
    })();
